<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisper Transkription</title>
  <link rel="manifest" href="manifest-whisper.json">
  <meta name="theme-color" content="#7c3aed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Whisper">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f0eeff;
      --layer1:   #ffffff;
      --layer2:   #ede9ff;
      --border:   rgba(100,60,220,0.12);
      --border2:  rgba(100,60,220,0.20);
      --text:     #1a1030;
      --muted:    #7060a0;
      --accent:   #7c3aed;
      --accent-d: #6028d8;
      --accent-dim: rgba(124,58,237,0.12);
      --green:    #059669;
      --red:      #dc2626;
      --red-dim:  rgba(220,38,38,0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:       #0d0b18;
        --layer1:   #14101f;
        --layer2:   #1e1830;
        --border:   rgba(160,120,255,0.12);
        --border2:  rgba(160,120,255,0.22);
        --text:     #e8e0ff;
        --muted:    #8a7ab0;
        --accent:   #a78bfa;
        --accent-d: #9060ff;
        --accent-dim: rgba(167,139,250,0.15);
        --green:    #34d399;
        --red:      #f87171;
        --red-dim:  rgba(248,113,113,0.14);
      }
    }
    :root[data-theme="dark"] {
      --bg:       #0d0b18;
      --layer1:   #14101f;
      --layer2:   #1e1830;
      --border:   rgba(160,120,255,0.12);
      --border2:  rgba(160,120,255,0.22);
      --text:     #e8e0ff;
      --muted:    #8a7ab0;
      --accent:   #a78bfa;
      --accent-d: #9060ff;
      --accent-dim: rgba(167,139,250,0.15);
      --green:    #34d399;
      --red:      #f87171;
      --red-dim:  rgba(248,113,113,0.14);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 60px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Header ── */
    .app-header {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 16px 0;
    }
    .back-btn {
      background: var(--layer2);
      border: 1px solid var(--border2);
      color: var(--text);
      border-radius: 12px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer; text-decoration: none;
      transition: opacity 0.12s;
      flex-shrink: 0;
    }
    .back-btn:active { opacity: 0.7; }
    .app-title {
      flex: 1;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .settings-btn {
      background: var(--layer2);
      border: 1px solid var(--border2);
      color: var(--muted);
      border-radius: 12px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; cursor: pointer;
      transition: color 0.15s;
    }
    .settings-btn:hover { color: var(--accent); }

    /* ── Mode tabs ── */
    .mode-tabs {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 8px;
      padding: 14px 16px 0;
    }
    .mode-tab {
      flex: 1;
      padding: 9px 12px;
      border-radius: 14px;
      border: 1.5px solid var(--border2);
      background: var(--layer2);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      font-family: inherit;
    }
    .mode-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ── Lang + options row ── */
    .options-row {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px 0;
    }
    .lang-select {
      background: var(--layer2);
      border: 1px solid var(--border2);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      font-family: inherit;
      flex: 1;
    }
    .lang-select:focus { border-color: var(--accent); }
    .clear-btn {
      background: var(--red-dim);
      border: 1px solid rgba(220,38,38,0.2);
      color: var(--red);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: opacity 0.12s;
    }
    .clear-btn:active { opacity: 0.7; }

    /* ── Mic zone ── */
    .mic-zone {
      width: 100%;
      max-width: 480px;
      padding: 20px 16px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .mic-btn {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
      user-select: none;
      -webkit-user-select: none;
    }
    .mic-btn:active { transform: scale(0.94); }
    .mic-btn.recording {
      background: var(--red-dim);
      border-color: var(--red);
      animation: pulse-ring 1.2s ease-in-out infinite;
    }
    .mic-btn.loading {
      background: var(--accent-dim);
      border-color: var(--accent);
      opacity: 0.7;
      pointer-events: none;
    }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0   rgba(220,38,38,0.35); }
      70%  { box-shadow: 0 0 0 18px rgba(220,38,38,0); }
      100% { box-shadow: 0 0 0 0   rgba(220,38,38,0); }
    }

    .mic-status {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      min-height: 20px;
      text-align: center;
    }
    .mic-status.active { color: var(--red); }
    .mic-status.loading { color: var(--accent); }

    /* ── Waveform visualizer ── */
    #waveCanvas {
      width: 100%;
      max-width: 480px;
      height: 40px;
      display: block;
      padding: 0 16px;
    }

    /* ── Upload zone ── */
    .upload-zone {
      width: 100%;
      max-width: 480px;
      padding: 0 16px;
      margin-top: 4px;
    }
    .upload-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 2px dashed var(--border2);
      border-radius: 16px;
      padding: 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .upload-label:hover, .upload-label.drag-over {
      border-color: var(--accent);
      color: var(--accent);
    }
    #fileInput { display: none; }

    /* ── Timer ── */
    .rec-timer {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--red);
      font-variant-numeric: tabular-nums;
      min-height: 36px;
      display: none;
    }
    .rec-timer.visible { display: block; }

    /* ── Transcript area ── */
    .transcript-wrap {
      width: 100%;
      max-width: 480px;
      padding: 14px 16px 0;
    }
    .transcript-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .transcript-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .transcript-actions {
      display: flex;
      gap: 6px;
    }
    .action-btn {
      background: var(--layer2);
      border: 1px solid var(--border2);
      color: var(--muted);
      border-radius: 10px;
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
    }
    .action-btn:hover { color: var(--accent); border-color: var(--accent); }
    .action-btn.copied { color: var(--green); border-color: var(--green); }

    .transcript-box {
      background: var(--layer1);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      min-height: 160px;
      max-height: 40vh;
      overflow-y: auto;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
    }
    .transcript-box:focus {
      outline: none;
      border-color: var(--accent);
    }
    .transcript-placeholder {
      color: var(--muted);
      font-style: italic;
      font-size: 14px;
      pointer-events: none;
      position: absolute;
      top: 16px; left: 16px;
    }
    .interim-text {
      color: var(--muted);
      font-style: italic;
    }

    /* ── Word count ── */
    .word-count {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      margin-top: 6px;
    }

    /* ── History ── */
    .history-wrap {
      width: 100%;
      max-width: 480px;
      padding: 14px 16px 0;
    }
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .history-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .history-clear-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
    }
    .history-clear-btn:hover { color: var(--red); }
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-item {
      background: var(--layer1);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.12s;
    }
    .history-item:hover { border-color: var(--accent); }
    .history-item-text {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .history-item-meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .history-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--accent-dim);
      color: var(--accent);
    }

    /* ── Settings overlay ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 500;
      align-items: flex-end;
      justify-content: center;
    }
    .overlay.open { display: flex; }
    .overlay-box {
      background: var(--layer1);
      width: 100%;
      max-width: 480px;
      border-radius: 24px 24px 0 0;
      border-top: 1px solid var(--border2);
      padding: 20px 20px 40px;
    }
    .overlay-handle {
      width: 40px; height: 4px;
      background: var(--border2);
      border-radius: 2px;
      margin: 0 auto 16px;
    }
    .overlay-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .overlay-sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .overlay-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }
    .overlay-input {
      width: 100%;
      background: var(--layer2);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      margin-bottom: 12px;
    }
    .overlay-input:focus { border-color: var(--accent); }
    .overlay-btns {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .overlay-cancel {
      flex: 1;
      padding: 13px;
      border-radius: 14px;
      border: 1px solid var(--border2);
      background: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .overlay-save {
      flex: 2;
      padding: 13px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .key-status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
    }
    .key-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .key-dot.set { background: var(--green); }
    .key-text {
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Error toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--layer1);
      border: 1.5px solid var(--border2);
      border-radius: 16px;
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      max-width: calc(100vw - 32px);
      text-align: center;
    }
    .toast.show { opacity: 1; }
    .toast.error { border-color: var(--red); color: var(--red); }
    .toast.success { border-color: var(--green); color: var(--green); }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2.5px solid var(--border2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <a class="back-btn" href="index.html">‹</a>
    <div class="app-title">🎙️ Transkription</div>
    <button class="settings-btn" onclick="openSettings()" title="API-Key einrichten">⚙</button>
  </div>

  <!-- Mode Tabs -->
  <div class="mode-tabs">
    <button class="mode-tab active" id="tabBrowser" onclick="setMode('browser')">🌐 Browser</button>
    <button class="mode-tab" id="tabWhisper" onclick="setMode('whisper')">✨ Whisper API</button>
    <button class="mode-tab" id="tabUpload" onclick="setMode('upload')">📁 Datei</button>
  </div>

  <!-- Options row -->
  <div class="options-row">
    <select class="lang-select" id="langSelect">
      <option value="de-DE">🇩🇪 Deutsch</option>
      <option value="en-US">🇺🇸 English</option>
      <option value="fr-FR">🇫🇷 Français</option>
      <option value="es-ES">🇪🇸 Español</option>
      <option value="it-IT">🇮🇹 Italiano</option>
      <option value="auto">🌍 Auto</option>
    </select>
    <button class="clear-btn" onclick="clearTranscript()">✕ Löschen</button>
  </div>

  <!-- Mic zone (browser + whisper mode) -->
  <div class="mic-zone" id="micZone">
    <div class="rec-timer" id="recTimer">0:00</div>
    <button class="mic-btn" id="micBtn" onclick="toggleRecord()">🎙️</button>
    <canvas id="waveCanvas" height="40"></canvas>
    <div class="mic-status" id="micStatus">Tippen zum Aufnehmen</div>
  </div>

  <!-- Upload zone -->
  <div class="upload-zone" id="uploadZone" style="display:none;margin-top:20px">
    <label class="upload-label" id="uploadLabel" for="fileInput">
      <span style="font-size:28px">📁</span>
      <div>
        <div style="font-size:14px;font-weight:700;margin-bottom:2px">Audio-Datei hochladen</div>
        <div style="font-size:12px">MP3, M4A, WAV, WEBM, MP4 · max. 25 MB</div>
      </div>
    </label>
    <input type="file" id="fileInput" accept="audio/*,video/webm,video/mp4" onchange="onFileSelect(this)">
  </div>

  <!-- Transcript -->
  <div class="transcript-wrap">
    <div class="transcript-header">
      <span class="transcript-label">Transkript</span>
      <div class="transcript-actions">
        <button class="action-btn" id="copyBtn" onclick="copyTranscript()">📋 Kopieren</button>
        <button class="action-btn" onclick="saveToHistory()">💾 Speichern</button>
      </div>
    </div>
    <div class="transcript-box" id="transcriptBox" contenteditable="true" spellcheck="true">
      <span class="transcript-placeholder" id="placeholder">Aufnahme starten oder Datei hochladen…</span>
    </div>
    <div class="word-count" id="wordCount">0 Wörter · 0 Zeichen</div>
  </div>

  <!-- History -->
  <div class="history-wrap" id="historyWrap" style="display:none">
    <div class="history-header">
      <span class="history-label">Verlauf</span>
      <button class="history-clear-btn" onclick="clearHistory()">Alle löschen</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- Settings overlay -->
  <div class="overlay" id="settingsOverlay" onclick="if(event.target===this)closeSettings()">
    <div class="overlay-box">
      <div class="overlay-handle"></div>
      <div class="overlay-title">⚙ Einstellungen</div>
      <div class="overlay-sub">Für die Whisper API wird ein OpenAI API-Key benötigt. Er wird nur lokal im Browser gespeichert.</div>
      <div class="overlay-label">OpenAI API-Key</div>
      <div class="key-status">
        <div class="key-dot" id="keyDot"></div>
        <span class="key-text" id="keyText">Kein Key gespeichert</span>
      </div>
      <input class="overlay-input" id="apiKeyInput" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
      <div class="overlay-btns">
        <button class="overlay-cancel" onclick="closeSettings()">Abbrechen</button>
        <button class="overlay-save" onclick="saveSettings()">Speichern</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
// ── State ──
let currentMode = 'browser';  // 'browser' | 'whisper' | 'upload'
let isRecording = false;
let recognition = null;
let mediaRecorder = null;
let audioChunks = [];
let timerInterval = null;
let recStartTime = 0;
let animFrame = null;
let analyser = null;
let dataArray = null;
let audioCtx = null;
let stream = null;

const LS_KEY = 'whisper_history_v1';
const LS_LANG = 'whisper_lang';
const LS_API  = 'whisper_apikey';

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  const savedLang = localStorage.getItem(LS_LANG) || 'de-DE';
  document.getElementById('langSelect').value = savedLang;
  document.getElementById('langSelect').addEventListener('change', () => {
    localStorage.setItem(LS_LANG, document.getElementById('langSelect').value);
  });
  document.getElementById('transcriptBox').addEventListener('input', updateWordCount);
  renderHistory();
  updateKeyStatus();
  if (!('SpeechRecognition' in window) && !('webkitSpeechRecognition' in window)) {
    document.getElementById('tabBrowser').disabled = true;
    document.getElementById('tabBrowser').style.opacity = '0.4';
    document.getElementById('tabBrowser').title = 'Browser unterstützt keine Spracherkennung';
  }
});

// ── Mode ──
function setMode(mode) {
  currentMode = mode;
  stopRecord();
  ['browser','whisper','upload'].forEach(m => {
    document.getElementById('tab' + m.charAt(0).toUpperCase() + m.slice(1)).classList.toggle('active', m === mode);
  });
  document.getElementById('micZone').style.display  = mode === 'upload' ? 'none' : 'flex';
  document.getElementById('uploadZone').style.display = mode === 'upload' ? 'block' : 'none';
  const statusEl = document.getElementById('micStatus');
  if (mode === 'browser') statusEl.textContent = 'Tippen zum Aufnehmen';
  else if (mode === 'whisper') statusEl.textContent = 'Aufnehmen → Whisper API transkribiert';
  else statusEl.textContent = '';
}

// ── Recording ──
function toggleRecord() {
  if (isRecording) stopRecord();
  else startRecord();
}

async function startRecord() {
  if (currentMode === 'browser') {
    startBrowserRecognition();
  } else if (currentMode === 'whisper') {
    await startWhisperRecording();
  }
}

// Browser Web Speech API
function startBrowserRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { showToast('Browser unterstützt keine Spracherkennung', 'error'); return; }

  recognition = new SpeechRecognition();
  const lang = document.getElementById('langSelect').value;
  recognition.lang = lang === 'auto' ? '' : lang;
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  let finalText = getTranscriptText();

  recognition.onstart = () => {
    isRecording = true;
    setRecordingUI(true);
    recStartTime = Date.now();
    startTimer();
  };

  recognition.onresult = (e) => {
    let interim = '';
    let newFinal = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        newFinal += e.results[i][0].transcript;
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    if (newFinal) finalText += (finalText ? ' ' : '') + newFinal.trim();
    renderTranscriptLive(finalText, interim);
  };

  recognition.onerror = (e) => {
    if (e.error === 'aborted') return;
    const msgs = { 'no-speech':'Keine Sprache erkannt', 'audio-capture':'Mikrofon nicht verfügbar', 'not-allowed':'Mikrofon-Zugriff verweigert', 'network':'Netzwerkfehler' };
    showToast(msgs[e.error] || 'Fehler: ' + e.error, 'error');
    stopRecord();
  };

  recognition.onend = () => {
    if (isRecording) recognition.start();  // keep alive on natural pause
  };

  recognition.start();
}

// Whisper API recording
async function startWhisperRecording() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    showToast('Mikrofon-Zugriff verweigert', 'error');
    return;
  }

  // Setup analyser for waveform
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  source.connect(analyser);
  drawWave();

  audioChunks = [];
  const mime = getSupportedMime();
  mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = () => sendToWhisper(audioChunks, mime);
  mediaRecorder.start();

  isRecording = true;
  setRecordingUI(true);
  recStartTime = Date.now();
  startTimer();
}

function getSupportedMime() {
  const types = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
  return types.find(t => MediaRecorder.isTypeSupported(t)) || null;
}

function stopRecord() {
  isRecording = false;
  setRecordingUI(false);
  stopTimer();
  if (recognition) { recognition.onend = null; recognition.stop(); recognition = null; }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  if (audioCtx) { audioCtx.close().catch(()=>{}); audioCtx = null; analyser = null; }
  clearWave();
}

// ── Whisper API upload ──
async function sendToWhisper(chunks, mime) {
  const key = localStorage.getItem(LS_API);
  if (!key) {
    showToast('Kein API-Key gesetzt – in ⚙ eintragen', 'error');
    return;
  }
  const ext = mime && mime.includes('webm') ? 'webm' : mime && mime.includes('ogg') ? 'ogg' : mime && mime.includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(chunks, { type: mime || 'audio/webm' });
  await transcribeBlob(blob, ext, key);
}

async function transcribeBlob(blob, ext, key) {
  setMicStatus('Transkribiert…', 'loading');
  document.getElementById('micBtn').classList.add('loading');
  const formData = new FormData();
  formData.append('file', blob, 'audio.' + ext);
  formData.append('model', 'whisper-1');
  const lang = document.getElementById('langSelect').value;
  if (lang !== 'auto') formData.append('language', lang.split('-')[0]);

  try {
    const res = await fetch('https://api.openai.com/v1/audio/transcriptions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + key },
      body: formData
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || 'API-Fehler ' + res.status);
    }
    const data = await res.json();
    const text = data.text?.trim() || '';
    if (text) {
      const cur = getTranscriptText();
      setTranscriptText(cur ? cur + '\n' + text : text);
      showToast('Transkription fertig ✓', 'success');
    } else {
      showToast('Keine Sprache erkannt', 'error');
    }
  } catch(e) {
    showToast('Fehler: ' + e.message, 'error');
  } finally {
    document.getElementById('micBtn').classList.remove('loading');
    setMicStatus(currentMode === 'whisper' ? 'Aufnehmen → Whisper API transkribiert' : 'Tippen zum Aufnehmen', '');
  }
}

// ── File upload ──
function onFileSelect(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  const key = localStorage.getItem(LS_API);
  if (!key) { showToast('Whisper API-Key benötigt – in ⚙ eintragen', 'error'); return; }
  const ext = file.name.split('.').pop().toLowerCase();
  transcribeBlob(file, ext, key);
}

// drag-and-drop on upload label
document.addEventListener('DOMContentLoaded', () => {
  const label = document.getElementById('uploadLabel');
  if (!label) return;
  label.addEventListener('dragover', e => { e.preventDefault(); label.classList.add('drag-over'); });
  label.addEventListener('dragleave', () => label.classList.remove('drag-over'));
  label.addEventListener('drop', e => {
    e.preventDefault();
    label.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (!file) return;
    const key = localStorage.getItem(LS_API);
    if (!key) { showToast('Whisper API-Key benötigt', 'error'); return; }
    const ext = file.name.split('.').pop().toLowerCase();
    transcribeBlob(file, ext, key);
  });
});

// ── UI helpers ──
function setRecordingUI(on) {
  const btn = document.getElementById('micBtn');
  const timer = document.getElementById('recTimer');
  btn.classList.toggle('recording', on);
  btn.textContent = on ? '⏹' : '🎙️';
  timer.classList.toggle('visible', on);
  if (on) setMicStatus(currentMode === 'browser' ? 'Läuft – sprechen…' : 'Aufnahme läuft…', 'active');
  else setMicStatus(currentMode === 'browser' ? 'Tippen zum Aufnehmen' : 'Aufnehmen → Whisper API transkribiert', '');
}

function setMicStatus(text, cls) {
  const el = document.getElementById('micStatus');
  el.textContent = text;
  el.className = 'mic-status' + (cls ? ' ' + cls : '');
}

// ── Timer ──
function startTimer() {
  timerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - recStartTime) / 1000);
    const m = Math.floor(s / 60);
    document.getElementById('recTimer').textContent = m + ':' + String(s % 60).padStart(2, '0');
  }, 500);
}
function stopTimer() {
  clearInterval(timerInterval);
  document.getElementById('recTimer').textContent = '0:00';
  document.getElementById('recTimer').classList.remove('visible');
}

// ── Waveform ──
function drawWave() {
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth * devicePixelRatio;
  const H = canvas.offsetHeight * devicePixelRatio;
  canvas.width = W;
  canvas.height = H;

  const draw = () => {
    if (!analyser) return;
    animFrame = requestAnimationFrame(draw);
    analyser.getByteTimeDomainData(dataArray);
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#7c3aed';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const sliceW = W / dataArray.length;
    let x = 0;
    for (let i = 0; i < dataArray.length; i++) {
      const v = dataArray[i] / 128;
      const y = (v * H) / 2;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
      x += sliceW;
    }
    ctx.lineTo(W, H / 2);
    ctx.stroke();
  };
  draw();
}
function clearWave() {
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// ── Transcript text ──
function getTranscriptText() {
  const box = document.getElementById('transcriptBox');
  const placeholder = document.getElementById('placeholder');
  if (placeholder && box.contains(placeholder)) return '';
  return box.innerText.trim();
}

function setTranscriptText(text) {
  const box = document.getElementById('transcriptBox');
  const ph  = document.getElementById('placeholder');
  box.innerHTML = '';
  if (text) {
    if (ph) ph.remove();
    box.appendChild(document.createTextNode(text));
  } else {
    if (ph) box.appendChild(ph);
  }
  updateWordCount();
}

function renderTranscriptLive(final, interim) {
  const box = document.getElementById('transcriptBox');
  const ph  = document.getElementById('placeholder');
  if (ph && box.contains(ph)) ph.remove();
  box.innerHTML = '';
  const finalNode = document.createTextNode(final);
  box.appendChild(finalNode);
  if (interim) {
    const interimSpan = document.createElement('span');
    interimSpan.className = 'interim-text';
    interimSpan.textContent = (final ? ' ' : '') + interim;
    box.appendChild(interimSpan);
  }
  box.scrollTop = box.scrollHeight;
  updateWordCount();
}

function clearTranscript() {
  const ph = document.getElementById('placeholder');
  const box = document.getElementById('transcriptBox');
  box.innerHTML = '';
  if (!ph) {
    const newPh = document.createElement('span');
    newPh.className = 'transcript-placeholder';
    newPh.id = 'placeholder';
    newPh.textContent = 'Aufnahme starten oder Datei hochladen…';
    box.appendChild(newPh);
  } else {
    box.appendChild(ph);
  }
  updateWordCount();
}

function updateWordCount() {
  const text = getTranscriptText();
  const words = text ? text.trim().split(/\s+/).filter(Boolean).length : 0;
  document.getElementById('wordCount').textContent = words + ' Wörter · ' + text.length + ' Zeichen';
}

function copyTranscript() {
  const text = getTranscriptText();
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ Kopiert';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Kopieren'; btn.classList.remove('copied'); }, 1500);
  }).catch(() => showToast('Kopieren nicht möglich', 'error'));
}

// ── History ──
function saveToHistory() {
  const text = getTranscriptText();
  if (!text) return;
  const hist = loadHistory();
  hist.unshift({ text, ts: Date.now(), mode: currentMode });
  if (hist.length > 30) hist.splice(30);
  localStorage.setItem(LS_KEY, JSON.stringify(hist));
  renderHistory();
  showToast('Gespeichert ✓', 'success');
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { return []; }
}

function renderHistory() {
  const hist = loadHistory();
  const wrap = document.getElementById('historyWrap');
  const list = document.getElementById('historyList');
  if (!hist.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  const modeLabel = { browser: 'Browser', whisper: 'Whisper', upload: 'Upload' };
  list.innerHTML = hist.map((h, i) => {
    const d = new Date(h.ts);
    const dt = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ', '
             + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    return `<div class="history-item" onclick="loadHistoryItem(${i})">
      <div class="history-item-text">${escapeHtml(h.text)}</div>
      <div class="history-item-meta">
        <span>${dt}</span>
        <span class="history-badge">${modeLabel[h.mode] || h.mode}</span>
      </div>
    </div>`;
  }).join('');
}

function loadHistoryItem(i) {
  const hist = loadHistory();
  if (hist[i]) setTranscriptText(hist[i].text);
}

function clearHistory() {
  if (!confirm('Verlauf löschen?')) return;
  localStorage.removeItem(LS_KEY);
  renderHistory();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Settings ──
function openSettings() {
  updateKeyStatus();
  document.getElementById('apiKeyInput').value = '';
  document.getElementById('settingsOverlay').classList.add('open');
  setTimeout(() => document.getElementById('apiKeyInput').focus(), 80);
}
function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('open');
}
function saveSettings() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (key) localStorage.setItem(LS_API, key);
  else localStorage.removeItem(LS_API);
  updateKeyStatus();
  closeSettings();
  showToast(key ? 'API-Key gespeichert ✓' : 'API-Key entfernt', key ? 'success' : '');
}
function updateKeyStatus() {
  const key = localStorage.getItem(LS_API);
  const dot = document.getElementById('keyDot');
  const txt = document.getElementById('keyText');
  if (key) {
    dot.classList.add('set');
    txt.textContent = 'Key gesetzt (sk-…' + key.slice(-4) + ')';
  } else {
    dot.classList.remove('set');
    txt.textContent = 'Kein Key gespeichert';
  }
}

// ── Toast ──
let toastTimer = null;
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
