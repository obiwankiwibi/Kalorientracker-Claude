<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Apps</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #1e2030;
      --surface: #272a3d;
      --border:  #3a3d55;
      --text:    #eef0f8;
      --muted:   #7880a0;
      --teal:    #3dbdb5;
      --salmon:  #e8635a;
      --amber:   #f5a623;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 400px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 20px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: transform 0.15s, border-color 0.15s;
      cursor: pointer;
    }

    .card:active { transform: scale(0.96); }

    .card:hover { border-color: var(--teal); }

    .card-icon {
      font-size: 42px;
      line-height: 1;
    }

    .card-name {
      font-size: 15px;
      font-weight: 600;
      text-align: center;
    }

    .card-desc {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    .card.teal  { border-color: rgba(61,189,181,0.3); }
    .card.coral { border-color: rgba(232,99,90,0.3);  }
  </style>
</head>
<body>

  <h1>Meine Apps</h1>
  <p class="sub">Wähle eine App</p>

  <div class="grid">
    <a class="card teal" href="einkaufsliste.html">
      <div class="card-icon">🛒</div>
      <div class="card-name">Einkaufsliste</div>
      <div class="card-desc">Gemeinsam einkaufen, in Echtzeit synchronisiert</div>
    </a>

    <a class="card coral" href="kalorien.html">
      <div class="card-icon">🥗</div>
      <div class="card-name">Kalorientracker</div>
      <div class="card-desc">Mahlzeiten & Nährstoffe im Blick behalten</div>
    </a>
  </div>

</body>
</html>
