<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freizeitaktivitäten</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#17202a;--muted:#718096;--line:#dce2e8;--brand:#6c4fd8;--soft:#ede9fb;--warn:#a66016;--radius:13px;--shadow:0 10px 30px rgba(23,32,42,.07)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1015;--card:#181525;--ink:#e8e4ff;--muted:#8980a9;--line:#28224a;--brand:#9d7fff;--soft:#201a45;--warn:#e2a85c;--shadow:none}}
:root[data-theme=dark]{--bg:#0d1015;--card:#181525;--ink:#e8e4ff;--muted:#8980a9;--line:#28224a;--brand:#9d7fff;--soft:#201a45;--warn:#e2a85c;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:1050px;margin:auto;padding:0 18px 80px}
.site-nav{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:4px;padding:0 12px;height:52px;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:20px}
.site-nav-title{flex:1;font-size:17px;font-weight:700;padding:0 4px;color:var(--ink)}
.site-nav-btn{width:36px;height:36px;border-radius:50%;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0;font-family:inherit;transition:background .15s}
.site-nav-btn:active{background:var(--card)}
.topstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.stat{background:var(--card);padding:14px 16px;border-right:1px solid var(--line)}.stat:last-child{border-right:none}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.big{font-size:25px;font-weight:750;margin-top:3px;color:var(--brand)}.hint{font-size:12px;color:var(--muted)}
.filter-bar{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:18px}
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:9px 12px;font:inherit;flex:1;min-width:120px}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:99px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;font-family:inherit;transition:background .15s,color .15s,border-color .15s}
.chip.active{background:var(--soft);border-color:var(--brand);color:var(--brand)}
.primary{border:0;background:var(--brand);color:#fff;border-radius:9px;padding:10px 16px;font:700 14px/1 inherit;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.primary:active{opacity:.85}
.secondary{border:1px solid var(--brand);background:none;color:var(--brand);border-radius:9px;padding:9px 15px;font:700 14px/1 inherit;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.secondary:active{opacity:.8}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:750;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';display:block;width:3px;height:14px;border-radius:2px;background:var(--brand);flex-shrink:0}
.count{font-size:11px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--muted)}
.activities-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.act-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px}
.act-card.is-fav{border-color:var(--brand)}
.act-header{display:flex;gap:10px;align-items:flex-start}
.cat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--soft)}
.act-name{font-weight:750;font-size:15px;line-height:1.3;flex:1}
.act-cat{font-size:11px;color:var(--brand);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.act-address{font-size:12px;color:var(--muted);display:flex;gap:5px;align-items:flex-start}
.act-note{font-size:13px;color:var(--ink);background:var(--bg);border-radius:8px;padding:8px 10px;line-height:1.4}
.act-footer{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.act-rating{display:flex;gap:2px;font-size:17px;line-height:1}
.star-btn{border:0;background:none;padding:0;font-size:17px;line-height:1;color:var(--line)}
.star-btn.on{color:#f6c000}
.fav-btn{border:0;background:none;padding:2px 4px;cursor:pointer;font-size:20px;line-height:1;color:var(--line);margin-left:auto;transition:color .15s}
.fav-btn.active{color:var(--brand)}
.visit-badge{font-size:11px;border-radius:99px;padding:3px 9px;background:var(--soft);color:var(--brand);font-weight:700}
.act-actions{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap}
.act-btn{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:6px 11px;font:600 12px/1 inherit;cursor:pointer;transition:background .12s;text-decoration:none;display:inline-flex;align-items:center}
.act-btn:hover{background:var(--bg)}
.act-btn.danger{color:var(--warn);border-color:var(--warn)}
.route-btn{color:var(--brand);border-color:var(--brand)}
.empty{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:44px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.fav-section{margin-top:26px}

/* ── Overlays ── */
.overlay{position:fixed;inset:0;background:rgba(9,15,18,.65);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.overlay.open{display:flex}
.modal{width:min(500px,100%);background:var(--card);border:1px solid var(--line);border-radius:15px;padding:24px;max-height:90vh;overflow-y:auto}
.modal h2{margin:0 0 18px;font-size:20px}
.field{margin-bottom:14px}.field label{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:10px 11px;font:inherit;resize:vertical}
.field textarea{min-height:72px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.ghost{border:1px solid var(--line);background:none;color:var(--ink);border-radius:9px;padding:9px 14px;cursor:pointer;font:inherit}
.star-pick{display:flex;gap:4px;font-size:24px;padding-top:4px}
.star-pick span{cursor:pointer;color:var(--line);transition:color .12s;user-select:none}
.star-pick span.on{color:#f6c000}

/* ── OSM Search overlay ── */
.search-overlay{position:fixed;inset:0;background:rgba(9,15,18,.7);display:none;align-items:flex-start;justify-content:center;padding:16px;padding-top:52px;z-index:30}
.search-overlay.open{display:flex}
.search-modal{width:min(580px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.search-head{padding:14px 16px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.search-inp{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:10px 13px;font:inherit;outline:none}
.search-inp:focus{border-color:var(--brand)}
.search-icon-btn{width:40px;height:40px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:9px;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;transition:border-color .15s,color .15s}
.search-icon-btn:hover{border-color:var(--brand);color:var(--brand)}
.search-status{padding:9px 16px;font-size:12px;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line);min-height:34px;line-height:1.4}
.search-results-list{overflow-y:auto;flex:1}
.sr-item{display:flex;gap:12px;align-items:center;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .1s}
.sr-item:last-child{border-bottom:none}
.sr-item:hover,.sr-item:active{background:var(--soft)}
.sr-icon{width:38px;height:38px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sr-body{flex:1;min-width:0}
.sr-name{font-weight:700;font-size:14px;line-height:1.3}
.sr-meta{font-size:11px;color:var(--brand);font-weight:700;margin-top:1px}
.sr-addr{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-add{border:1px solid var(--brand);background:none;color:var(--brand);border-radius:8px;padding:6px 12px;font:700 12px/1 inherit;cursor:pointer;flex-shrink:0;white-space:nowrap}
.search-empty{padding:40px 20px;text-align:center;color:var(--muted)}
.search-empty strong{display:block;color:var(--ink);margin-bottom:6px}

@media(max-width:600px){.topstats{grid-template-columns:1fr 1fr}.field-row{grid-template-columns:1fr}.filter-row{flex-wrap:wrap}}
@media(max-width:400px){.activities-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="site-nav">
  <div class="site-nav-title">🎡 Freizeitaktivitäten</div>
  <button class="site-nav-btn" id="themeBtn" title="Design wechseln">◐</button>
  <a href="index.html" class="site-nav-btn" title="Startseite">⌂</a>
</header>

<div class="topstats">
  <div class="stat"><div class="eyebrow">Aktivitäten</div><div class="big" id="statTotal">0</div><div class="hint">gesamt eingetragen</div></div>
  <div class="stat"><div class="eyebrow">Besucht</div><div class="big" id="statVisited">0</div><div class="hint">mindestens einmal</div></div>
  <div class="stat"><div class="eyebrow">Favoriten</div><div class="big" id="statFavs">0</div><div class="hint">auf Merkliste</div></div>
  <div class="stat"><div class="eyebrow">Top-Kategorie</div><div class="big" id="statCat">—</div><div class="hint" id="statCatHint">meiste Einträge</div></div>
</div>

<div class="filter-bar">
  <div class="filter-row">
    <input id="filterInput" class="filter-input" placeholder="In meiner Liste suchen …">
    <button class="secondary" id="osmSearchBtn">🔍 Ort suchen</button>
    <button class="primary" id="addBtn">＋ Manuell</button>
  </div>
  <div class="filter-chips" id="catChips">
    <button class="chip active" data-cat="">Alle</button>
  </div>
</div>

<div class="section-head">
  <div class="section-title">Aktivitäten</div>
  <span class="count" id="listCount">0</span>
</div>
<div class="activities-grid" id="actGrid"></div>

<div class="fav-section" id="favSection" style="display:none">
  <div class="section-head">
    <div class="section-title">Favoriten</div>
    <span class="count" id="favCount">0</span>
  </div>
  <div class="activities-grid" id="favGrid"></div>
</div>
</div>

<!-- ── OSM Suche ── -->
<div class="search-overlay" id="searchOverlay">
<div class="search-modal">
  <div class="search-head">
    <input id="osmInp" class="search-inp" placeholder="z. B. Schwimmbad Siegen, Kino Hilchenbach …" autocomplete="off" autocorrect="off">
    <button class="search-icon-btn" id="osmGpsBtn" title="Aktivitäten in meiner Nähe">📍</button>
    <button class="search-icon-btn" id="osmCloseBtn" title="Schließen">✕</button>
  </div>
  <div class="search-status" id="osmStatus">Suchbegriff eingeben oder 📍 für Aktivitäten in der Nähe</div>
  <div class="search-results-list" id="osmResults"></div>
</div>
</div>

<!-- ── Hinzufügen / Bearbeiten ── -->
<div class="overlay" id="overlay">
<div class="modal">
  <h2 id="modalTitle">Aktivität hinzufügen</h2>
  <input type="hidden" id="editId">
  <div class="field"><label>Name *</label><input id="fName" placeholder="z. B. Freizeitbad Siegen"></div>
  <div class="field-row">
    <div class="field"><label>Kategorie *</label>
      <select id="fCat">
        <option value="">Wählen …</option>
        <option>🏊 Schwimmbad</option>
        <option>⛳ Minigolf</option>
        <option>🎬 Kino</option>
        <option>🎭 Theater</option>
        <option>🏛️ Museum</option>
        <option>🎳 Bowling</option>
        <option>🧗 Klettern</option>
        <option>🛼 Rollschuhlaufen</option>
        <option>🎡 Freizeitpark</option>
        <option>🏋️ Fitness</option>
        <option>🎮 Gaming / Escape Room</option>
        <option>🍕 Restaurant</option>
        <option>☕ Café</option>
        <option>🌳 Natur / Wandern</option>
        <option>🚴 Radfahren</option>
        <option>⛷️ Ski / Winter</option>
        <option>🎨 Kunst / Ausstellung</option>
        <option>🎵 Konzert / Event</option>
        <option>🐾 Zoo / Tierpark</option>
        <option>🎯 Sonstiges</option>
      </select>
    </div>
    <div class="field"><label>Bewertung</label>
      <div class="star-pick" id="starPick">
        <span data-s="1">★</span><span data-s="2">★</span><span data-s="3">★</span><span data-s="4">★</span><span data-s="5">★</span>
      </div>
    </div>
  </div>
  <div class="field"><label>Adresse / Ort</label><input id="fAddr" placeholder="z. B. Sandstraße 1, 57072 Siegen"></div>
  <div class="field"><label>Website (optional)</label><input id="fUrl" type="url" placeholder="https://…"></div>
  <div class="field"><label>Notizen</label><textarea id="fNote" placeholder="Öffnungszeiten, Preise, Tipps …"></textarea></div>
  <div class="field-row">
    <div class="field"><label>Zuletzt besucht</label><input id="fVisit" type="date"></div>
    <div class="field"><label>Preis-Niveau</label>
      <select id="fPrice">
        <option value="">Unbekannt</option>
        <option value="free">Kostenlos</option>
        <option value="low">Günstig (€)</option>
        <option value="mid">Mittel (€€)</option>
        <option value="high">Teuer (€€€)</option>
      </select>
    </div>
  </div>
  <div class="modal-actions">
    <button class="ghost" id="cancelBtn">Abbrechen</button>
    <button class="primary" id="saveBtn">Speichern</button>
  </div>
</div>
</div>

<script>
const STORE = 'freizeit_v1';
const themes = ['system','light','dark'];
let state = { activities: [], theme: 'system' };
try { state = Object.assign(state, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch(e) {}
if (!Array.isArray(state.activities)) state.activities = [];

const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist() { localStorage.setItem(STORE, JSON.stringify(state)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

const PRICE_LABEL = { free:'Kostenlos', low:'€', mid:'€€', high:'€€€' };

/* ── OSM category mapping ── */
const OSM_CAT = {
  swimming_pool:'🏊 Schwimmbad', water_park:'🏊 Schwimmbad',
  miniature_golf:'⛳ Minigolf',
  cinema:'🎬 Kino',
  theatre:'🎭 Theater',
  museum:'🏛️ Museum',
  bowling_alley:'🎳 Bowling',
  climbing:'🧗 Klettern', climbing_wall:'🧗 Klettern',
  ice_rink:'🛼 Rollschuhlaufen',
  theme_park:'🎡 Freizeitpark', amusement_park:'🎡 Freizeitpark',
  fitness_centre:'🏋️ Fitness', gym:'🏋️ Fitness', sports_centre:'🏋️ Fitness',
  amusement_arcade:'🎮 Gaming / Escape Room', escape_game:'🎮 Gaming / Escape Room',
  restaurant:'🍕 Restaurant', fast_food:'🍕 Restaurant', food_court:'🍕 Restaurant',
  cafe:'☕ Café', coffee_shop:'☕ Café',
  park:'🌳 Natur / Wandern', nature_reserve:'🌳 Natur / Wandern', forest:'🌳 Natur / Wandern',
  gallery:'🎨 Kunst / Ausstellung', arts_centre:'🎨 Kunst / Ausstellung', exhibition:'🎨 Kunst / Ausstellung',
  zoo:'🐾 Zoo / Tierpark', animal_shelter:'🐾 Zoo / Tierpark',
  concert_hall:'🎵 Konzert / Event', events_venue:'🎵 Konzert / Event',
};

function osmCat(r) {
  const tags = r.tags || {};
  for (const key of ['leisure','amenity','tourism','sport','natural']) {
    const v = tags[key];
    if (v && OSM_CAT[v]) return OSM_CAT[v];
  }
  return '🎯 Sonstiges';
}

function osmName(r) {
  return (r.tags && (r.tags.name || r.tags['name:de'])) || r.display_name?.split(',')[0] || 'Unbekannt';
}

function osmAddress(r) {
  if (r.address) {
    const a = r.address;
    const street = a.road ? a.road + (a.house_number ? ' ' + a.house_number : '') : '';
    const city = a.city || a.town || a.village || a.municipality || '';
    const parts = [street, (a.postcode ? a.postcode + ' ' : '') + city].filter(Boolean);
    return parts.join(', ');
  }
  if (r.tags) {
    const t = r.tags;
    const street = t['addr:street'] ? t['addr:street'] + (t['addr:housenumber'] ? ' ' + t['addr:housenumber'] : '') : '';
    const city = t['addr:city'] || t['addr:town'] || '';
    const postcode = t['addr:postcode'] || '';
    const parts = [street, (postcode ? postcode + ' ' : '') + city].filter(Boolean);
    return parts.join(', ');
  }
  return '';
}

function osmCatLabel(r) {
  const c = osmCat(r);
  return c.replace(/^\S+\s/, '');
}

/* ── OSM Search ── */
let osmDebounce = null;

function openSearch() {
  $('searchOverlay').classList.add('open');
  setTimeout(() => $('osmInp').focus(), 80);
}
function closeSearch() { $('searchOverlay').classList.remove('open'); }

$('osmInp').addEventListener('input', () => {
  clearTimeout(osmDebounce);
  const q = $('osmInp').value.trim();
  if (!q) { $('osmStatus').textContent = 'Suchbegriff eingeben oder 📍 für Aktivitäten in der Nähe'; $('osmResults').innerHTML = ''; return; }
  $('osmStatus').textContent = 'Suche läuft …';
  osmDebounce = setTimeout(() => doNominatimSearch(q), 600);
});

$('osmInp').addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(osmDebounce); doNominatimSearch($('osmInp').value.trim()); }
});

async function doNominatimSearch(q) {
  if (!q) return;
  $('osmStatus').textContent = 'Suche läuft …';
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=20&countrycodes=de,at,ch&q=' + encodeURIComponent(q);
    const res = await fetch(url, { headers: { 'Accept-Language': 'de' } });
    const data = await res.json();
    showNominatimResults(data, q);
  } catch(e) {
    $('osmStatus').textContent = 'Suche fehlgeschlagen – Internetverbindung prüfen.';
  }
}

function showNominatimResults(items, q) {
  if (!items.length) {
    $('osmStatus').textContent = `Keine Ergebnisse für „${q}"`;
    $('osmResults').innerHTML = `<div class="search-empty"><strong>Nichts gefunden</strong>Versuche es mit einem anderen Suchbegriff, z. B. „Kino Siegen" oder „Schwimmbad Hilchenbach".</div>`;
    return;
  }
  $('osmStatus').textContent = `${items.length} Ergebnis${items.length===1?'':'se'} gefunden`;
  $('osmResults').innerHTML = items.map((r,i) => {
    const cat = osmCat(r);
    const icon = cat.split(' ')[0];
    const catLabel = cat.replace(/^\S+\s/, '');
    const name = r.display_name?.split(',')[0] || 'Unbekannt';
    const addr = osmAddress(r);
    return `<div class="sr-item" data-idx="${i}">
      <div class="sr-icon">${icon}</div>
      <div class="sr-body">
        <div class="sr-name">${esc(name)}</div>
        <div class="sr-meta">${esc(catLabel)}</div>
        ${addr ? `<div class="sr-addr">${esc(addr)}</div>` : ''}
      </div>
      <button class="sr-add" data-idx="${i}">＋ Hinzufügen</button>
    </div>`;
  }).join('');
  $('osmResults').querySelectorAll('[data-idx]').forEach(el => {
    el.addEventListener('click', () => prefillFromNominatim(items[+el.dataset.idx]));
  });
}

/* ── Nearby search via Overpass ── */
$('osmGpsBtn').onclick = () => {
  if (!navigator.geolocation) { $('osmStatus').textContent = 'Geolocation nicht verfügbar.'; return; }
  $('osmStatus').textContent = '📍 Standort wird ermittelt …';
  $('osmResults').innerHTML = '';
  navigator.geolocation.getCurrentPosition(
    pos => doOverpassNearby(pos.coords.latitude, pos.coords.longitude),
    ()  => { $('osmStatus').textContent = 'Standortzugriff verweigert.'; },
    { timeout: 8000 }
  );
};

async function doOverpassNearby(lat, lon) {
  $('osmStatus').textContent = '🔍 Suche Freizeitaktivitäten in der Nähe …';
  const r = 15000; // 15 km radius
  const query = `[out:json][timeout:20];(
    node["leisure"~"swimming_pool|miniature_golf|bowling_alley|fitness_centre|ice_rink|theme_park|climbing|climbing_wall|water_park|amusement_park"](around:${r},${lat},${lon});
    node["amenity"~"cinema|theatre|arts_centre"](around:${r},${lat},${lon});
    node["tourism"~"museum|zoo|gallery|theme_park|amusement_park"](around:${r},${lat},${lon});
  );out body;`;
  try {
    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query)
    });
    const data = await res.json();
    showOverpassResults(data.elements || [], lat, lon);
  } catch(e) {
    $('osmStatus').textContent = 'Abruf fehlgeschlagen – Internetverbindung prüfen.';
  }
}

function dist(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function showOverpassResults(elements, userLat, userLon) {
  const named = elements.filter(e => e.tags && e.tags.name);
  named.sort((a,b) => dist(userLat,userLon,a.lat,a.lon) - dist(userLat,userLon,b.lat,b.lon));
  if (!named.length) {
    $('osmStatus').textContent = 'Keine Freizeitaktivitäten im Umkreis von 15 km gefunden.';
    $('osmResults').innerHTML = `<div class="search-empty"><strong>Nichts gefunden</strong>Versuche eine manuelle Suche mit dem Suchfeld.</div>`;
    return;
  }
  $('osmStatus').textContent = `${named.length} Aktivität${named.length===1?'':'en'} in der Nähe`;
  $('osmResults').innerHTML = named.map((e,i) => {
    const cat = osmCat(e);
    const icon = cat.split(' ')[0];
    const catLabel = cat.replace(/^\S+\s/, '');
    const name = e.tags.name;
    const addr = osmAddress(e);
    const km = dist(userLat,userLon,e.lat,e.lon);
    const distStr = km < 1 ? Math.round(km*1000) + ' m' : km.toFixed(1) + ' km';
    return `<div class="sr-item" data-idx="${i}">
      <div class="sr-icon">${icon}</div>
      <div class="sr-body">
        <div class="sr-name">${esc(name)}</div>
        <div class="sr-meta">${esc(catLabel)} · ${distStr}</div>
        ${addr ? `<div class="sr-addr">${esc(addr)}</div>` : ''}
      </div>
      <button class="sr-add" data-idx="${i}">＋ Hinzufügen</button>
    </div>`;
  }).join('');
  $('osmResults').querySelectorAll('[data-idx]').forEach(el => {
    el.addEventListener('click', () => prefillFromOverpass(named[+el.dataset.idx]));
  });
}

function prefillFromNominatim(r) {
  const name = r.display_name?.split(',')[0] || '';
  const addr = osmAddress(r);
  const cat = osmCat(r);
  openAddPrefilled(name, cat, addr, '');
}

function prefillFromOverpass(e) {
  const name = e.tags.name || '';
  const addr = osmAddress(e);
  const cat = osmCat(e);
  const website = e.tags.website || e.tags['contact:website'] || '';
  openAddPrefilled(name, cat, addr, website);
}

function openAddPrefilled(name, cat, addr, url) {
  closeSearch();
  $('modalTitle').textContent = 'Aktivität hinzufügen';
  $('editId').value = '';
  $('fName').value = name;
  $('fCat').value = cat;
  $('fAddr').value = addr;
  $('fUrl').value = url;
  $('fNote').value = '';
  $('fVisit').value = '';
  $('fPrice').value = '';
  pickRating = 0; updateStarPick();
  $('overlay').classList.add('open');
  setTimeout(() => $('fCat').focus(), 60);
}

$('osmCloseBtn').onclick = closeSearch;
$('searchOverlay').onclick = e => { if (e.target === e.currentTarget) closeSearch(); };
$('osmSearchBtn').onclick = openSearch;

/* ── Star picker ── */
let pickRating = 0;
function updateStarPick() {
  document.querySelectorAll('#starPick span').forEach(s => s.classList.toggle('on', +s.dataset.s <= pickRating));
}
document.querySelectorAll('#starPick span').forEach(s => {
  s.onclick = () => { pickRating = +s.dataset.s === pickRating ? 0 : +s.dataset.s; updateStarPick(); };
});

/* ── Category chips ── */
let filterCat = '', filterSearch = '';
function buildCatChips() {
  const used = [...new Set(state.activities.map(a => a.cat).filter(Boolean))].sort();
  const chips = $('catChips');
  chips.innerHTML = '<button class="chip' + (!filterCat?' active':'') + '" data-cat="">Alle</button>' +
    used.map(c => `<button class="chip${filterCat===c?' active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  chips.querySelectorAll('.chip').forEach(b => {
    b.onclick = () => { filterCat = b.dataset.cat; render(); };
  });
}

/* ── Stats ── */
function updateStats() {
  const all = state.activities;
  $('statTotal').textContent = all.length;
  $('statVisited').textContent = all.filter(a => a.lastVisit).length;
  $('statFavs').textContent = all.filter(a => a.fav).length;
  if (!all.length) { $('statCat').textContent = '—'; $('statCatHint').textContent = 'meiste Einträge'; return; }
  const freq = {};
  all.forEach(a => { if (a.cat) freq[a.cat] = (freq[a.cat]||0) + 1; });
  const top = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
  if (top) { $('statCat').textContent = top[0].split(' ')[0]; $('statCatHint').textContent = top[0].replace(/^\S+\s/,''); }
}

/* ── Card HTML ── */
function cardHtml(a) {
  const stars = Array.from({length:5},(_,i)=>`<span class="star-btn${i<a.rating?' on':''}">★</span>`).join('');
  const catIcon = (a.cat||'').split(' ')[0] || '🎯';
  const catLabel = (a.cat||'').replace(/^\S+\s/,'') || a.cat || '';
  const visitStr = a.lastVisit ? 'Besucht ' + new Date(a.lastVisit).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';
  const priceStr = PRICE_LABEL[a.price] || '';
  const mapHref = a.address ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a.address) : '';
  return `<div class="act-card${a.fav?' is-fav':''}" data-id="${esc(a.id)}">
    <div class="act-header">
      <div class="cat-icon">${catIcon}</div>
      <div style="flex:1;min-width:0">
        <div class="act-name">${esc(a.name)}</div>
        <div class="act-cat">${esc(catLabel)}</div>
      </div>
      <button class="fav-btn${a.fav?' active':''}" data-fav="${esc(a.id)}" title="${a.fav?'Aus Favoriten entfernen':'Zu Favoriten'}">♥</button>
    </div>
    ${a.address?`<div class="act-address">📍 <span>${esc(a.address)}</span></div>`:''}
    ${a.note?`<div class="act-note">${esc(a.note)}</div>`:''}
    <div class="act-footer">
      <div class="act-rating">${stars}</div>
      ${visitStr?`<span class="visit-badge">${esc(visitStr)}</span>`:''}
      ${priceStr?`<span class="visit-badge" style="background:var(--bg);color:var(--muted)">${esc(priceStr)}</span>`:''}
    </div>
    <div class="act-actions">
      ${mapHref?`<a class="act-btn route-btn" href="${esc(mapHref)}" target="_blank" rel="noopener">🗺 Maps</a>`:''}
      ${a.url?`<a class="act-btn route-btn" href="${esc(a.url)}" target="_blank" rel="noopener">🔗 Website</a>`:''}
      <button class="act-btn" data-edit="${esc(a.id)}">✏️</button>
      <button class="act-btn danger" data-del="${esc(a.id)}">✕</button>
    </div>
  </div>`;
}

/* ── Render ── */
function render() {
  buildCatChips(); updateStats();
  const q = filterSearch.toLowerCase();
  let list = state.activities.filter(a => {
    if (filterCat && a.cat !== filterCat) return false;
    if (q && !(a.name||'').toLowerCase().includes(q) && !(a.address||'').toLowerCase().includes(q) && !(a.cat||'').toLowerCase().includes(q)) return false;
    return true;
  });
  $('listCount').textContent = list.length;
  $('actGrid').innerHTML = list.length
    ? list.map(cardHtml).join('')
    : `<div class="empty" style="grid-column:1/-1"><strong>Keine Aktivitäten gefunden</strong>${state.activities.length?'Passe die Filter an.':'Nutze „Ort suchen" oder „Manuell" zum Hinzufügen.'}</div>`;
  const favs = state.activities.filter(a => a.fav);
  $('favSection').style.display = favs.length ? '' : 'none';
  $('favCount').textContent = favs.length;
  $('favGrid').innerHTML = favs.map(cardHtml).join('');
  bindCardEvents($('actGrid')); bindCardEvents($('favGrid'));
}

function bindCardEvents(container) {
  container.querySelectorAll('[data-fav]').forEach(b => b.onclick = () => toggleFav(b.dataset.fav));
  container.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEdit(b.dataset.edit));
  container.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteAct(b.dataset.del));
}
function toggleFav(id) { const a = state.activities.find(x=>x.id===id); if(a){a.fav=!a.fav;persist();render();} }
function deleteAct(id) { if(!confirm('Aktivität wirklich löschen?'))return; state.activities=state.activities.filter(x=>x.id!==id); persist();render(); }

/* ── Add / Edit modal ── */
function openAdd() {
  $('modalTitle').textContent='Aktivität hinzufügen'; $('editId').value='';
  $('fName').value=''; $('fCat').value=''; $('fAddr').value='';
  $('fUrl').value=''; $('fNote').value=''; $('fVisit').value=''; $('fPrice').value='';
  pickRating=0; updateStarPick();
  $('overlay').classList.add('open'); setTimeout(()=>$('fName').focus(),60);
}
function openEdit(id) {
  const a=state.activities.find(x=>x.id===id); if(!a)return;
  $('modalTitle').textContent='Aktivität bearbeiten'; $('editId').value=a.id;
  $('fName').value=a.name||''; $('fCat').value=a.cat||''; $('fAddr').value=a.address||'';
  $('fUrl').value=a.url||''; $('fNote').value=a.note||''; $('fVisit').value=a.lastVisit||''; $('fPrice').value=a.price||'';
  pickRating=a.rating||0; updateStarPick();
  $('overlay').classList.add('open'); setTimeout(()=>$('fName').focus(),60);
}
function closeModal() { $('overlay').classList.remove('open'); }
function saveActivity() {
  const name=$('fName').value.trim(), cat=$('fCat').value.trim();
  if(!name||!cat){alert('Name und Kategorie sind Pflichtfelder.');return;}
  const id=$('editId').value;
  if(id){
    const a=state.activities.find(x=>x.id===id);
    if(a){a.name=name;a.cat=cat;a.address=$('fAddr').value.trim();a.url=$('fUrl').value.trim();a.note=$('fNote').value.trim();a.lastVisit=$('fVisit').value;a.price=$('fPrice').value;a.rating=pickRating;}
  } else {
    state.activities.unshift({id:uid(),name,cat,address:$('fAddr').value.trim(),url:$('fUrl').value.trim(),note:$('fNote').value.trim(),lastVisit:$('fVisit').value,price:$('fPrice').value,rating:pickRating,fav:false});
  }
  persist(); closeModal(); render();
}

$('addBtn').onclick=openAdd;
$('cancelBtn').onclick=closeModal;
$('saveBtn').onclick=saveActivity;
$('overlay').onclick=e=>{if(e.target===e.currentTarget)closeModal();};
$('filterInput').oninput=()=>{filterSearch=$('filterInput').value;render();};

/* ── Theme ── */
function applyTheme(){state.theme==='system'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',state.theme);}
$('themeBtn').onclick=()=>{state.theme=themes[(themes.indexOf(state.theme)+1)%3];applyTheme();persist();};

applyTheme();
render();
</script>
