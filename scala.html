<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Škoda Scala Monte Carlo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* ── Tokens ── */
:root {
  --bg:      #edf2f7;
  --card:    #ffffff;
  --ink:     #1a1a2e;
  --muted:   #6b7a99;
  --line:    #dde8f5;
  --mc:      #c8102e;
  --mc2:     rgba(200,16,46,.09);
  --hero:    #0d1b3e;
  --r:       12px;
  --sh:      0 6px 24px rgba(0,0,80,0.07);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0c0f1e; --card:rgba(16,22,52,0.88); --ink:#e8ecf8; --muted:#8a95bb;
  --line:rgba(27,79,216,0.14); --mc:#e8193e; --mc2:rgba(232,25,62,.11);
  --hero:#080c18; --sh:none;
}}
:root[data-theme=dark]{
  --bg:#0c0f1e; --card:rgba(16,22,52,0.88); --ink:#e8ecf8; --muted:#8a95bb;
  --line:rgba(27,79,216,0.14); --mc:#e8193e; --mc2:rgba(232,25,62,.11);
  --hero:#080c18; --sh:none;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 15px/1.65 'Nunito Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

/* ── Circuit background ── */
#page-bg{position:fixed;inset:0;z-index:-1;background:url('images/circuit-bg.jpg') center/cover;will-change:transform}
[data-theme=light] #page-bg{background:linear-gradient(155deg,#b8d4f0 0%,#dce8f5 45%,#e8f2fc 100%)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]) #page-bg{display:none}}

/* ── Nav ── */
.nav{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:6px;padding:0 20px;height:52px;background:var(--bg);border-bottom:1px solid var(--line);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.nav-title{flex:1;font:700 11px/1 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nav-btn{width:36px;height:36px;border-radius:50%;border:none;background:none;color:var(--muted);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;font-family:inherit;transition:background .12s}
.nav-btn:hover{background:var(--card)}

/* ── Hero ── */
.hero{background:var(--hero);position:relative;overflow:hidden}
/* subtle shimmer */
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 90% 70% at 15% 50%,rgba(200,200,220,.04),transparent 65%);pointer-events:none}
/* red rail */
.hero-rail{position:absolute;top:0;left:0;width:4px;height:100%;background:var(--mc)}
.hero-kicker{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(200,16,46,.35);background:rgba(200,16,46,.1);color:var(--mc);border-radius:4px;padding:4px 11px;font:700 10px/1 'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase;margin-bottom:22px}
.hero-name{font:800 clamp(52px,12vw,112px)/1 'Barlow Condensed',sans-serif;text-transform:uppercase;color:#fff;letter-spacing:-.01em;line-height:.95;text-wrap:balance}
.hero-name em{color:var(--mc);font-style:normal;display:block}
.hero-sub{font:400 clamp(14px,2.5vw,20px)/1 'Barlow Condensed',sans-serif;color:rgba(255,255,255,.38);text-transform:uppercase;letter-spacing:.1em;margin-top:16px}
.hero-stats{display:flex;gap:36px;flex-wrap:wrap;margin-top:44px;padding-top:36px;border-top:1px solid rgba(255,255,255,.07)}
.hstat-val{font:700 clamp(28px,4.5vw,40px)/1 'Barlow Condensed',sans-serif;color:#fff;font-variant-numeric:tabular-nums}
.hstat-label{font:600 10px/1 'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.36);margin-top:6px}

/* ── Page ── */
.page{max-width:1080px;margin:auto;padding:0 20px 80px}

/* ── Slider ── */
.slider-wrap{padding:36px 0 0}
.slider-viewport{position:relative;border-radius:18px;overflow:hidden;background:var(--hero);user-select:none}
.slider-track{display:flex;will-change:transform;transition:transform .38s cubic-bezier(.25,.46,.45,.94)}
.slider-track.no-anim{transition:none}
.slide{flex:0 0 100%;position:relative;overflow:hidden}
.slide img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;pointer-events:none}
.slide-cap{position:absolute;inset:auto 0 0;padding:14px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font:700 11px/1 'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase}
.sl-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.13);color:rgba(255,255,255,.85);width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s,opacity .18s;opacity:0;z-index:10}
.slider-viewport:hover .sl-btn{opacity:1}
.sl-btn:hover{background:rgba(0,0,0,.5)}
.sl-prev{left:12px}.sl-next{right:12px}
.sl-dots{display:flex;justify-content:center;gap:7px;padding:11px 0 3px}
.sl-dot{width:6px;height:6px;border-radius:50%;background:var(--line);border:none;cursor:pointer;padding:0;transition:background .2s,transform .2s}
.sl-dot.active{background:var(--mc);transform:scale(1.4)}

/* ── Section ── */
.sec{margin-top:44px}
.sec-hd{display:flex;align-items:baseline;gap:12px;margin-bottom:20px}
.sec-eye{font:700 10px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.16em;color:var(--mc)}
.sec-title{font:700 22px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.spec-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sp-lbl{font:700 10px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.sp-val{font:700 20px/1.2 'Barlow Condensed',sans-serif;color:var(--ink);margin-top:5px}
.sp-note{font-size:12px;color:var(--muted);margin-top:3px}

/* ── Two-col ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ── Verbrauchstabelle ── */
.vtable-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--line)}
.vtable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.vtable th{font:700 10px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
.vtable td{padding:12px 14px;border-bottom:1px solid var(--line)}
.vtable tr:last-child td{border-bottom:none}
.vtable tr:hover td{background:var(--mc2)}
.vval{font-weight:700;color:var(--mc)}

/* ── Monte Carlo feature ── */
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.mc-card-hd{font:700 10px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.14em;color:var(--mc);margin-bottom:12px}
.mc-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.mc-list li{font-size:13px;padding-left:14px;position:relative;line-height:1.5}
.mc-list li::before{content:'–';position:absolute;left:0;color:var(--mc);font-weight:700}

/* ── Pros ── */
.pros{display:flex;flex-direction:column;gap:10px}
.pro{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.55}
.pro-mark{width:18px;height:18px;border-radius:50%;background:var(--mc);color:#fff;font:700 10px/18px sans-serif;text-align:center;flex-shrink:0;margin-top:1px}

/* ── Info highlight ── */
.info-box{background:var(--mc2);border-left:3px solid var(--mc);border-radius:0 8px 8px 0;padding:12px 16px;font-size:14px;line-height:1.6;margin-top:14px}

/* ── Tip list ── */
.tips{list-style:none;display:flex;flex-direction:column;gap:8px}
.tips li{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.6;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 14px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.tips li .ti{font-size:18px;flex-shrink:0;margin-top:1px}

/* ── Assistenten ── */
.assist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.assist-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.assist-icon{font-size:24px;margin-bottom:9px}
.assist-name{font:700 14px/1.2 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.assist-desc{font-size:12px;color:var(--muted);line-height:1.55}

/* ── Chips ── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 15px;font:600 13px/1 'Nunito Sans',sans-serif;display:flex;align-items:center;gap:7px}

/* ── Clever grid ── */
.clever-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.clever-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;box-shadow:var(--sh);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.clever-em{font-size:20px;flex-shrink:0;margin-top:1px}

/* ── Kit ── */
.kit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kit-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.kit-hd{font:700 11px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:12px}
.kit-card.pflicht .kit-hd{color:var(--mc)}
.kit-card.pflicht{border-color:rgba(200,16,46,.25)}
.kit-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.kit-list li{font-size:13px;padding-left:14px;position:relative;line-height:1.5}
.kit-list li::before{content:'–';position:absolute;left:0;color:var(--muted)}

/* ── Checklist ── */
.cl-section-lbl{font:700 10px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:14px 4px 4px}
.cl-item{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-radius:9px;cursor:pointer;transition:background .12s;user-select:none}
.cl-item:hover{background:var(--mc2)}
.cl-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.cl-item.done .cl-box{background:var(--mc);border-color:var(--mc)}
.cl-item.done .cl-box::after{content:'✓';font:700 11px/1 sans-serif;color:#fff}
.cl-item.done .cl-text{text-decoration:line-through;color:var(--muted)}
.cl-text{font:600 14px/1.4 'Nunito Sans',sans-serif}
.cl-sub{font-size:12px;color:var(--muted);margin-top:2px;font-weight:400}

/* ── Footer ── */
.footer{margin-top:60px;padding:24px 0;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--muted);letter-spacing:.04em}

/* ── Hero layout ── */
.hero-inner{max-width:1080px;margin:auto;padding:52px 28px 48px 36px}
.hero-wordmark{display:block;height:28px;width:auto;margin-bottom:20px;filter:invert(1) grayscale(1) brightness(10) contrast(2);mix-blend-mode:screen;image-rendering:crisp-edges}

/* ── Mein Exemplar highlight cards ── */
.exemplar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ex-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.ex-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--mc)}
.ex-lbl{font:700 10px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.ex-val{font:700 20px/1.2 'Barlow Condensed',sans-serif;color:var(--ink);margin-top:5px}
.ex-note{font-size:12px;color:var(--muted);margin-top:3px}

/* ── Responsive ── */
@media(max-width:640px){
  .hero-inner{padding:38px 20px 36px 24px}
  .hero-wordmark{height:22px}
  .hero-stats{gap:22px}
  .two-col,.mc-grid,.kit-grid{grid-template-columns:1fr}
  .gallery-grid{grid-template-columns:1fr 1fr}
  .g-w2{grid-column:span 1}
}
@media(max-width:400px){
  .card-grid,.exemplar-grid{grid-template-columns:1fr}
  .clever-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="page-bg" aria-hidden="true"></div>

<nav class="nav">
  <a href="index.html" class="nav-btn" title="Dashboard">⌂</a>
  <div class="nav-title">Mein Fahrzeug</div>
  <button class="nav-btn" onclick="doQuickBackup()" title="Backup erstellen">💾</button>
  <button class="nav-btn" id="themeBtn">◐</button>
</nav>

<!-- ── HERO ── -->
<div class="hero">
  <div class="hero-rail"></div>
  <div class="hero-inner">
    <img class="hero-wordmark" src="images/scala/skoda-wordmark.jpg" alt="Škoda">
    <div class="hero-kicker">Mein Auto · 2025 · Luna Silber Metallic</div>
    <div class="hero-name">
      Scala
      <em>Monte Carlo</em>
    </div>
  </div>
</div>

<div class="page">

  <!-- Slider -->
  <div class="slider-wrap">
    <div class="slider-viewport" id="sliderViewport">
      <div class="slider-track" id="sliderTrack">
        <div class="slide"><img src="images/scala/01-front.jpg" alt="Frontansicht" loading="eager"><div class="slide-cap">Frontansicht</div></div>
        <div class="slide"><img src="images/scala/02-seite.jpg" alt="Seitenansicht" loading="lazy"><div class="slide-cap">Seite</div></div>
        <div class="slide"><img src="images/scala/03-heck.jpg" alt="Heckansicht" loading="lazy"><div class="slide-cap">Heck</div></div>
        <div class="slide"><img src="images/scala/04-frontgrill.jpg" alt="Frontgrill" loading="lazy"><div class="slide-cap">Frontgrill</div></div>
        <div class="slide"><img src="images/scala/10-badge.jpg" alt="Monte Carlo Badge" loading="lazy"><div class="slide-cap">Monte Carlo Badge</div></div>
        <div class="slide"><img src="images/scala/09-armaturenbrett.jpg" alt="Armaturenbrett" loading="lazy"><div class="slide-cap">Armaturenbrett</div></div>
        <div class="slide"><img src="images/scala/05-fahrersitz.jpg" alt="Fahrersitz" loading="lazy"><div class="slide-cap">Fahrersitz</div></div>
        <div class="slide"><img src="images/scala/13-lenkrad.jpg" alt="Lenkrad" loading="lazy"><div class="slide-cap">Lenkrad · 9.441 km</div></div>
        <div class="slide"><img src="images/scala/11-panoramadach.jpg" alt="Panoramadach" loading="lazy"><div class="slide-cap">Panoramadach</div></div>
        <div class="slide"><img src="images/scala/07-kofferraum.jpg" alt="Kofferraum" loading="lazy"><div class="slide-cap">Kofferraum · 467 L</div></div>
        <div class="slide"><img src="images/scala/12-cockpit.jpg" alt="Cockpit Display" loading="lazy"><div class="slide-cap">Cockpit Display · Columbus Navi</div></div>
        <div class="slide"><img src="images/scala/06-ruecksitze-aussen.jpg" alt="Rücksitze" loading="lazy"><div class="slide-cap">Rücksitze</div></div>
        <div class="slide"><img src="images/scala/08-ruecksitze.jpg" alt="Rücksitze · Türseite" loading="lazy"><div class="slide-cap">Rücksitze · Türseite</div></div>
      </div>
      <button class="sl-btn sl-prev" id="slPrev" aria-label="Zurück">&#8249;</button>
      <button class="sl-btn sl-next" id="slNext" aria-label="Weiter">&#8250;</button>
    </div>
    <div class="sl-dots" id="slDots"></div>
  </div>


  <div class="footer">Škoda Scala Monte Carlo · 2025</div>

</div><!-- /page -->

<script>
/* ── Theme ── */
const TKEY = 'scala_theme';
const themes = ['system','light','dark'];
let theme = localStorage.getItem(TKEY) || 'light';
function applyTheme() {
  theme === 'system'
    ? document.documentElement.removeAttribute('data-theme')
    : document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem(TKEY, theme);
}
document.getElementById('themeBtn').onclick = () => {
  theme = themes[(themes.indexOf(theme) + 1) % 3];
  applyTheme();
};
applyTheme();

/* ── Slider ── */
(function(){
  const track   = document.getElementById('sliderTrack');
  const viewport= document.getElementById('sliderViewport');
  const dotsWrap= document.getElementById('slDots');
  const slides  = Array.from(track.querySelectorAll('.slide'));
  const n       = slides.length;
  let cur = 0, pos = 1, busy = false;

  /* Clone first/last for seamless loop */
  track.appendChild(slides[0].cloneNode(true));
  track.insertBefore(slides[n-1].cloneNode(true), slides[0]);

  /* Dots */
  slides.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'sl-dot' + (i === 0 ? ' active' : '');
    d.setAttribute('aria-label', 'Bild ' + (i+1));
    d.addEventListener('click', () => goTo(i + 1));
    dotsWrap.appendChild(d);
  });
  const dots = Array.from(dotsWrap.querySelectorAll('.sl-dot'));

  function setTranslate(p, animate) {
    if (!animate) track.classList.add('no-anim');
    track.style.transform = 'translateX(-' + (p * 100) + '%)';
    if (!animate) { track.getBoundingClientRect(); track.classList.remove('no-anim'); }
  }

  function updateDots() {
    dots.forEach((d, i) => d.classList.toggle('active', i === cur));
  }

  function goTo(p) {
    if (busy) return;
    busy = true;
    pos = p;
    cur = p === 0 ? n - 1 : p === n + 1 ? 0 : p - 1;
    updateDots();
    setTranslate(pos, true);
    track.addEventListener('transitionend', function h() {
      track.removeEventListener('transitionend', h);
      busy = false;
      if (pos === 0)     { pos = n;     setTranslate(pos, false); }
      else if (pos===n+1){ pos = 1;     setTranslate(pos, false); }
    });
  }

  /* Init */
  setTranslate(1, false);

  document.getElementById('slPrev').addEventListener('click', () => goTo(pos - 1));
  document.getElementById('slNext').addEventListener('click', () => goTo(pos + 1));

  /* Touch swipe */
  let tx0 = 0, ty0 = 0, swiping = false, dx = 0;
  viewport.addEventListener('touchstart', e => {
    tx0 = e.touches[0].clientX;
    ty0 = e.touches[0].clientY;
    swiping = true; dx = 0;
  }, { passive: true });
  viewport.addEventListener('touchmove', e => {
    if (!swiping) return;
    dx = e.touches[0].clientX - tx0;
    if (Math.abs(e.touches[0].clientY - ty0) > Math.abs(dx)) { swiping = false; }
  }, { passive: true });
  viewport.addEventListener('touchend', () => {
    if (!swiping) return;
    swiping = false;
    if (dx < -40) goTo(pos + 1);
    else if (dx > 40) goTo(pos - 1);
  });

  /* Keyboard */
  document.addEventListener('keydown', e => {
    if (document.activeElement && document.activeElement.closest('.slider-wrap')) return;
    if (e.key === 'ArrowLeft')  goTo(pos - 1);
    if (e.key === 'ArrowRight') goTo(pos + 1);
  });
})();

/* ── Checklist ── */
const CK = 'scala_cl';
let checks = {};
try { checks = JSON.parse(localStorage.getItem(CK) || '{}'); } catch(e) {}
function saveChecks() { localStorage.setItem(CK, JSON.stringify(checks)); }

document.querySelectorAll('.cl-item').forEach(item => {
  const k = item.dataset.key;
  if (checks[k]) item.classList.add('done');
  item.addEventListener('click', () => {
    item.classList.toggle('done');
    checks[k] = item.classList.contains('done');
    saveChecks();
  });
});

function doQuickBackup(){
  var d={};
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);try{d[k]=JSON.parse(localStorage.getItem(k));}catch(e){d[k]=localStorage.getItem(k);}}
  d._backup={created:new Date().toISOString()};
  var bl=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(bl);
  a.download="hub-backup-"+new Date().toISOString().slice(0,10)+".json";
  a.click();URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
