<!DOCTYPE html>

<head>

</head>
<body>

<a class="back" href="rezeptbuch.html" id="backLink">← Zum Rezeptbuch</a>

// Converts raw ingredient {name,emoji,qty,unitRaw} to the schema rezeptbuch.html uses
function ingToSchema(name, emoji, qty, unitRaw) {
  const u = (unitRaw||'').trim();
  const ul = u.toLowerCase();
  let unit = u, amountG = 0;
  if (ul === 'g')                       { unit = qty + ' g';      amountG = qty; }
  else if (ul === 'kg')                 { unit = qty + ' kg';     amountG = qty * 1000; }
  else if (ul === 'ml')                 { unit = qty + ' ml';     amountG = qty; }
  else if (ul === 'cl')                 { unit = qty + ' cl';     amountG = qty * 10; }
  else if (ul === 'dl')                 { unit = qty + ' dl';     amountG = qty * 100; }
  else if (ul === 'l')                  { unit = qty + ' L';      amountG = qty * 1000; }
  else if (ul==='stück'||ul==='stk'||ul==='stk.') { unit = qty + ' Stück'; }
  else if (u !== '')                    { unit = u; }  // TL, EL, Becher, Scheibe etc. — keep as-is
  return {
    name: name || '', emoji: emoji || '', unit, amountG, qty: qty || 0, custom: false,
    kcalPer100: 0, proteinPer100: 0, carbsPer100: 0, fatPer100: 0, unitPrice: 0, unitG: 0
  };
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

const cardsEl=document.getElementById('cards');
RECIPES.forEach((r,i)=>{
  const d=document.createElement('div');
  d.className='card'; d.id='card-'+i;
  d.innerHTML=`<div class="card-icon">${esc(r.emoji)}</div><div class="card-info"><div class="card-name">${esc(r.name)}</div><div class="card-meta">${esc(r.category)} · ${r.servings} Portionen · ${r.ingredients.filter(x=>x.name).length} Zutaten · ${r.steps.length} Schritte</div><div class="card-status" id="st-${i}"></div></div>`;
  cardsEl.appendChild(d);
});

function loadRecipes(){try{return JSON.parse(localStorage.getItem('rezepte_v2')||'{}');}catch{return {};}}
function saveRecipes(r){localStorage.setItem('rezepte_v2',JSON.stringify(r));}

(function checkExisting(){
  const existing=loadRecipes();
  RECIPES.forEach((r,i)=>{
    if(existing[r.id]){
      document.getElementById('card-'+i).classList.add('done');
      document.getElementById('st-'+i).textContent='Bereits vorhanden';
    }
  });
})();

async function importAll(){
  const btn=document.getElementById('btn');
  btn.disabled=true; btn.textContent='Importiere…';
  const existing=loadRecipes();
  let count=0;
  for(let i=0;i<RECIPES.length;i++){
    const r=RECIPES[i];
    existing[r.id]={
      id:r.id, createdAt:Date.now(),
      name:r.name, emoji:r.emoji,
      category:r.category, servings:r.servings,
      description:r.description||'',
      steps:r.steps,
      ingredients:r.ingredients
    };
    count++;
    document.getElementById('card-'+i).classList.add('done');
    document.getElementById('st-'+i).textContent='✓ Importiert';
    saveRecipes(existing);
    await new Promise(res=>setTimeout(res,60));
  }
  btn.textContent='✓ '+count+' Rezepte importiert';
  const bl=document.getElementById('backLink');
  bl.textContent='→ Jetzt zum Rezeptbuch';
  bl.style.fontWeight='700'; bl.style.fontSize='15px';
}
</script>
</body>
</html>
