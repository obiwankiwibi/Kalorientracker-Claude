<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kalorien</title>
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Kalorientracker%22,%22display%22:%22standalone%22}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
  :root{
    --bg:#10121A;
    --bg-elev:#1A1D28;
    --bg-elev2:#232734;
    --text:#F2F4F8;
    --text-soft:#9198AA;
    --text-faint:#5C6273;
    --line: rgba(255,255,255,0.07);
    --mint:#4EE1A0;
    --mint-deep:#1FB584;
    --coral:#FF7A66;
    --amber:#FFC15E;
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, rgba(78,225,160,0.14), transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(255,122,102,0.10), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:118px;
  }
  .wrap{max-width:480px;margin:0 auto;padding:22px 18px 0;}

  /* segmented switch */
  .segwrap{display:flex;justify-content:center;margin-bottom:18px;}
  .seg{
    display:flex;gap:4px;background:var(--bg-elev);border:1px solid var(--line);
    border-radius:999px;padding:4px;
  }
  .seg button{
    border:none;background:transparent;color:var(--text-faint);
    font-size:13.5px;font-weight:700;padding:9px 20px;border-radius:999px;cursor:pointer;
  }
  .seg button.active{
    background:linear-gradient(135deg, var(--mint), var(--mint-deep));color:#0A1A14;
  }

  /* date nav */
  .datebar{
    display:flex;align-items:center;justify-content:space-between;
    padding:2px 2px 20px;
  }
  .datebar button{
    background:var(--bg-elev);border:1px solid var(--line);color:var(--text);
    width:36px;height:36px;border-radius:12px;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .datebar .day{text-align:center;}
  .datebar .day .main{display:block;font-weight:700;font-size:15px;letter-spacing:-0.01em;}
  .datebar .day .sub{display:block;font-size:11.5px;color:var(--text-faint);margin-top:2px;letter-spacing:0.04em;}

  /* hero ring card */
  .hero{
    background:linear-gradient(165deg, var(--bg-elev2), var(--bg-elev));
    border:1px solid var(--line);
    border-radius:28px;
    padding:26px 20px 22px;
    box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;
    position:relative;overflow:hidden;
  }
  .hero::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 50% -20%, rgba(78,225,160,0.10), transparent 60%);
    pointer-events:none;
  }
  .ring-wrap{position:relative;width:196px;height:196px;margin-bottom:6px;}
  .ring-wrap svg{transform:rotate(-90deg);width:100%;height:100%;}
  .ring-bg{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:14;}
  .ring-fg{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1), stroke .3s;}
  .ring-center{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .ring-num{font-size:44px;font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1;}
  .ring-label{font-size:11.5px;color:var(--text-soft);letter-spacing:0.08em;text-transform:uppercase;margin-top:6px;}
  .ring-goal{font-size:12px;color:var(--text-faint);margin-top:2px;}

  .goal-edit{
    display:flex;align-items:center;gap:6px;margin-top:14px;font-size:12.5px;color:var(--text-soft);
  }
  .goal-edit input{
    width:70px;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    color:var(--text);padding:6px 8px;font-size:13px;text-align:center;
  }

  /* entries */
  .section-label{
    font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--text-faint);margin:24px 4px 10px;
  }
  .entries{display:flex;flex-direction:column;gap:8px;}
  .entry-card{
    background:var(--bg-elev);border:1px solid var(--line);border-radius:18px;
    padding:13px 14px;display:flex;align-items:center;gap:12px;
  }
  .entry-dot{
    width:8px;height:8px;border-radius:50%;background:var(--mint);flex:none;
  }
  .entry-info{flex:1;min-width:0;}
  .entry-name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry-meta{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
  .entry-kcal{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap;}
  .entry-del{
    background:none;border:none;color:var(--text-faint);font-size:15px;padding:4px 2px 4px 8px;cursor:pointer;
  }
  .empty-state{
    padding:34px 8px;text-align:center;color:var(--text-faint);font-size:13.5px;line-height:1.6;
  }

  /* week view */
  .week-summary{
    display:flex;gap:8px;margin-bottom:6px;
  }
  .stat-card{
    flex:1;background:linear-gradient(165deg, var(--bg-elev2), var(--bg-elev));
    border:1px solid var(--line);border-radius:20px;padding:14px 10px;
    box-shadow:var(--shadow);text-align:center;
  }
  .stat-card .stat-label{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.04em;}
  .stat-card .stat-num{font-size:21px;font-weight:800;letter-spacing:-0.02em;margin-top:6px;font-variant-numeric:tabular-nums;}
  .stat-card .stat-num.coral{color:var(--coral);}
  .stat-card .stat-num.mint{color:var(--mint);}

  .week-hint{
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--text-soft);
    margin:14px 6px 18px;
    display:none;
  }
  .week-hint.show{display:flex;}
  .week-hint .dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--text-faint);}
  .week-hint.under .dot{background:var(--amber);}
  .week-hint.over .dot{background:var(--coral);}

  .chart-card{
    background:linear-gradient(165deg, var(--bg-elev2), var(--bg-elev));
    border:1px solid var(--line);border-radius:24px;
    padding:20px 16px 14px;box-shadow:var(--shadow);position:relative;
  }
  .chart-area{
    position:relative;height:160px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;
    padding-top:22px;
  }
  .goal-line{
    position:absolute;left:0;right:0;height:1px;background:repeating-linear-gradient(90deg, var(--text-faint) 0 5px, transparent 5px 10px);
  }
  .goal-line .glabel{
    position:absolute;right:0;top:-16px;font-size:10px;color:var(--text-faint);letter-spacing:0.03em;
  }
  .bar-col{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
    position:relative;height:100%;justify-content:flex-end;
  }
  .bar-val{font-size:10.5px;color:var(--text-soft);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .bar{
    width:100%;max-width:26px;border-radius:8px 8px 4px 4px;
    background:linear-gradient(180deg, var(--mint), var(--mint-deep));
    transition:height .4s cubic-bezier(.4,0,.2,1);
    min-height:4px;
  }
  .bar.over{background:linear-gradient(180deg, var(--coral), #E15848);}
  .bar.today{box-shadow:0 0 0 2px var(--bg-elev), 0 0 0 3.5px rgba(78,225,160,0.6);}
  .bar-day{font-size:11px;color:var(--text-faint);font-weight:600;margin-top:2px;}
  .bar-day.today-label{color:var(--mint);}

  /* top foods */
  .food-list{display:flex;flex-direction:column;gap:8px;}
  .food-row{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-elev);border:1px solid var(--line);border-radius:16px;
    padding:11px 14px;
  }
  .food-rank{
    width:24px;height:24px;border-radius:50%;background:var(--bg-elev2);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:var(--text-soft);flex:none;
  }
  .food-info{flex:1;min-width:0;}
  .food-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .food-meta{font-size:11px;color:var(--text-faint);margin-top:1px;}
  .food-count{font-size:13px;font-weight:700;color:var(--mint);white-space:nowrap;}

  /* floating pill nav */
  .fab-row{
    position:fixed;left:0;right:0;bottom:18px;
    display:flex;justify-content:center;padding:0 18px;
    z-index:40;
  }
  .fab-pill{
    display:flex;gap:6px;background:rgba(26,29,40,0.85);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:999px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,0.5);
  }
  .fab{
    border:none;border-radius:999px;padding:13px 20px;
    font-size:14px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .fab.manual{background:var(--bg-elev2);color:var(--text);}
  .fab.scan{background:linear-gradient(135deg, var(--mint), var(--mint-deep));color:#0A1A14;}

  /* modal */
  .modal-bg{
    position:fixed;inset:0;background:rgba(6,7,10,0.6);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--bg-elev);width:100%;max-width:480px;
    border-radius:26px 26px 0 0;
    border:1px solid var(--line);border-bottom:none;
    padding:20px 20px 30px;
    animation:up .2s cubic-bezier(.3,0,.2,1);
  }
  @keyframes up{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 16px;}
  .modal h3{margin:0 0 16px;font-size:17px;letter-spacing:-0.01em;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-faint);margin-bottom:6px;}
  .field input{
    width:100%;padding:13px 14px;border:1px solid var(--line);background:var(--bg);border-radius:14px;
    font-size:15px;color:var(--text);
  }
  .field input:focus{outline:none;border-color:var(--mint);}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .btn{
    flex:1;padding:14px;border:none;border-radius:14px;
    background:linear-gradient(135deg, var(--mint), var(--mint-deep));color:#0A1A14;
    font-weight:700;font-size:14.5px;cursor:pointer;
  }
  .btn.ghost{background:var(--bg-elev2);color:var(--text-soft);}

  /* scanner */
  #scanner-view{width:100%;position:relative;background:#000;overflow:hidden;margin-bottom:12px;height:280px;border-radius:18px;}
  #scanner-view video, #scanner-view canvas{
    position:absolute!important;top:0!important;left:0!important;
    width:100%!important;height:100%!important;
    object-fit:cover!important;display:block;
  }
  .reticle{
    position:absolute;top:50%;left:10%;right:10%;height:2px;background:var(--coral);
    box-shadow:0 0 10px var(--coral);z-index:5;border-radius:2px;
  }
  .scan-status{font-size:12.5px;color:var(--text-soft);text-align:center;margin-bottom:12px;min-height:16px;}
  .product-card{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;background:var(--bg);}
  .product-card .pname{font-weight:700;font-size:14.5px;}
  .product-card .pkcal{font-size:12.5px;color:var(--mint);margin-top:3px;font-weight:600;}
</style>
</head>
<body>

<div class="wrap">
  <div class="segwrap">
    <div class="seg">
      <button id="segDay" class="active" onclick="switchView('day')">Tag</button>
      <button id="segWeek" onclick="switchView('week')">Woche</button>
    </div>
  </div>

  <!-- DAY VIEW -->
  <div id="dayView">
    <div class="datebar">
      <button onclick="shiftDay(-1)">‹</button>
      <div class="day"><span class="main" id="dayLabel">Heute</span><span class="sub" id="dayDate">–</span></div>
      <button onclick="shiftDay(1)">›</button>
    </div>

    <div class="hero">
      <div class="ring-wrap">
        <svg viewBox="0 0 196 196">
          <circle class="ring-bg" cx="98" cy="98" r="82"/>
          <circle class="ring-fg" id="ringFg" cx="98" cy="98" r="82" stroke="url(#grad)"/>
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4EE1A0"/>
              <stop offset="100%" stop-color="#1FB584"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="ring-center">
          <div class="ring-num" id="totalNum">0</div>
          <div class="ring-label">kcal heute</div>
          <div class="ring-goal" id="goalText"></div>
        </div>
      </div>
      <div class="goal-edit">
        <span>Ziel</span>
        <input type="number" id="goalInput" placeholder="2000" oninput="saveGoal()">
        <span>kcal</span>
      </div>
    </div>

    <div class="section-label">Einträge</div>
    <div class="entries" id="entries"></div>
  </div>

  <!-- WEEK VIEW -->
  <div id="weekView" style="display:none;">
    <div class="datebar">
      <button onclick="shiftWeek(-1)">‹</button>
      <div class="day"><span class="main" id="weekLabel">KW –</span><span class="sub" id="weekRange">–</span></div>
      <button onclick="shiftWeek(1)">›</button>
    </div>

    <div class="week-summary">
      <div class="stat-card">
        <div class="stat-label">Ø / Tag</div>
        <div class="stat-num mint" id="weekAvg">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Gesamt</div>
        <div class="stat-num" id="weekTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Wochenziel</div>
        <div class="stat-num" id="weekGoal">0</div>
      </div>
    </div>

    <div class="week-hint" id="weekHint">
      <span class="dot"></span>
      <span id="weekHintText"></span>
    </div>

    <div class="chart-card">
      <div class="chart-area" id="chartArea"></div>
    </div>

    <div class="section-label" id="foodsLabel" style="display:none;">Häufig diese Woche</div>
    <div class="food-list" id="foodList"></div>
  </div>
</div>

<div class="fab-row" id="fabRow">
  <div class="fab-pill">
    <button class="fab manual" onclick="openManual()">＋ Manuell</button>
    <button class="fab scan" onclick="openScan()">📷 Scannen</button>
  </div>
</div>

<!-- Manual entry modal -->
<div class="modal-bg" id="manualBg">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Lebensmittel hinzufügen</h3>
    <div class="field"><label>Bezeichnung</label><input id="manName" placeholder="z. B. Apfel"></div>
    <div class="field"><label>Kalorien (kcal)</label><input id="manKcal" type="number" inputmode="decimal" placeholder="z. B. 95"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('manualBg')">Abbrechen</button>
      <button class="btn" onclick="submitManual()">Speichern</button>
    </div>
  </div>
</div>

<!-- Scan modal -->
<div class="modal-bg" id="scanBg">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Barcode scannen</h3>
    <div id="scanner-view"><div class="reticle" id="reticle"></div></div>
    <div class="scan-status" id="scanStatus">Kamera wird gestartet …</div>

    <div class="field" style="display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;">
      <div style="flex:1;">
        <label style="display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-faint);margin-bottom:6px;">Oder Barcode-Nummer eintippen</label>
        <input id="manualCode" type="text" inputmode="numeric" placeholder="z. B. 4000417025005" style="width:100%;padding:12px 13px;border:1px solid var(--line);background:var(--bg);border-radius:14px;font-size:14px;color:var(--text);">
      </div>
      <button class="btn ghost" style="flex:none;padding:12px 16px;" onclick="lookupProduct(document.getElementById('manualCode').value.trim())">Suchen</button>
    </div>

    <div id="productResult" style="display:none;">
      <div class="product-card">
        <div class="pname" id="pName">–</div>
        <div class="pkcal" id="pKcal">–</div>
      </div>
      <div class="field"><label>Menge (Gramm)</label><input id="pGrams" type="number" inputmode="decimal" placeholder="z. B. 100"></div>
    </div>

    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('scanBg')">Abbrechen</button>
      <button class="btn" id="scanConfirmBtn" style="display:none;" onclick="submitScan()">Hinzufügen</button>
    </div>
  </div>
</div>

<script>
/* ---------- Konstanten ---------- */
const DEFAULT_GOAL = 2000;

/* ---------- Datumslogik ---------- */
let currentDate = new Date();
let currentView = 'day';

function fmtKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDisplay(d){
  return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});
}
function isToday(d){ return fmtKey(d)===fmtKey(new Date()); }

function shiftDay(delta){
  currentDate.setDate(currentDate.getDate()+delta);
  render();
}

function switchView(view){
  currentView = view;
  document.getElementById('segDay').classList.toggle('active', view==='day');
  document.getElementById('segWeek').classList.toggle('active', view==='week');
  document.getElementById('dayView').style.display = view==='day' ? 'block' : 'none';
  document.getElementById('weekView').style.display = view==='week' ? 'block' : 'none';
  document.getElementById('fabRow').style.display = view==='day' ? 'flex' : 'none';
  render();
}

/* Montag-basierte Woche */
function getMonday(d){
  const nd = new Date(d);
  const day = nd.getDay(); // 0=So,1=Mo,...
  const diff = (day===0 ? -6 : 1-day);
  nd.setDate(nd.getDate()+diff);
  nd.setHours(0,0,0,0);
  return nd;
}
function getWeekDates(anchor){
  const monday = getMonday(anchor);
  const arr = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    arr.push(d);
  }
  return arr;
}
function shiftWeek(delta){
  currentDate.setDate(currentDate.getDate()+delta*7);
  render();
}
/* ISO-8601 Kalenderwoche */
function getISOWeek(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay()+6)%7;
  date.setUTCDate(date.getUTCDate()-dayNum+3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const firstDayNum = (firstThursday.getUTCDay()+6)%7;
  firstThursday.setUTCDate(firstThursday.getUTCDate()-firstDayNum+3);
  return 1 + Math.round((date-firstThursday)/(7*24*3600*1000));
}

/* ---------- Speicher ---------- */
const STORE_KEY = 'kalorientracker_v1';
function loadStore(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveStore(store){
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}
function getDay(key){
  const store = loadStore();
  return store[key] || {entries:[]};
}
function setDay(key, dayData){
  const store = loadStore();
  store[key] = dayData;
  saveStore(store);
}
function dayTotal(key){
  return getDay(key).entries.reduce((s,e)=>s+e.kcal,0);
}
function saveGoal(){
  localStorage.setItem('kalorientracker_goal', document.getElementById('goalInput').value || '');
  render();
}
function getGoalRaw(){
  return localStorage.getItem('kalorientracker_goal') || '';
}
function getGoal(){
  const raw = parseFloat(getGoalRaw());
  return (raw && raw>0) ? raw : DEFAULT_GOAL;
}

/* ---------- Konstanten für Ring/Chart ---------- */
const RING_R = 82;
const RING_C = 2 * Math.PI * RING_R;

/* ---------- Rendern ---------- */
function render(){
  if(currentView === 'day') renderDay(); else renderWeek();
}

function renderDay(){
  const key = fmtKey(currentDate);
  document.getElementById('dayLabel').textContent = isToday(currentDate) ? 'Heute' : fmtDisplay(currentDate);
  document.getElementById('dayDate').textContent = key;

  const day = getDay(key);
  const entriesEl = document.getElementById('entries');
  entriesEl.innerHTML = '';

  let total = 0;
  if(day.entries.length === 0){
    entriesEl.innerHTML = '<div class="empty-state">Noch nichts erfasst.<br>Über die Buttons unten Lebensmittel hinzufügen.</div>';
  } else {
    day.entries.forEach(e=>{
      total += e.kcal;
      const row = document.createElement('div');
      row.className='entry-card';
      row.innerHTML = `
        <span class="entry-dot"></span>
        <span class="entry-info">
          <span class="entry-name">${escapeHtml(e.name)}</span>
          <span class="entry-meta">${e.meta?escapeHtml(e.meta):''}</span>
        </span>
        <span class="entry-kcal">${Math.round(e.kcal)}</span>
        <button class="entry-del" onclick="deleteEntry('${key}','${e.id}')">✕</button>
      `;
      entriesEl.appendChild(row);
    });
  }

  document.getElementById('totalNum').textContent = Math.round(total);
  document.getElementById('goalInput').value = getGoalRaw();

  const goal = getGoal();
  const ring = document.getElementById('ringFg');
  ring.style.strokeDasharray = RING_C;
  const pct = Math.min(1, total/goal);
  ring.style.strokeDashoffset = RING_C * (1-pct);
  ring.style.stroke = total > goal ? 'var(--coral)' : 'url(#grad)';
  document.getElementById('goalText').textContent = 'von ' + Math.round(goal);
}

function renderWeek(){
  const weekDates = getWeekDates(currentDate);
  const first = weekDates[0], last = weekDates[6];
  const dailyGoal = getGoal();
  const weeklyGoal = dailyGoal*7;

  document.getElementById('weekLabel').textContent = 'KW ' + getISOWeek(first);
  document.getElementById('weekRange').textContent = first.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}) + '–' + last.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});

  const dayNames = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  const totals = weekDates.map(d=>dayTotal(fmtKey(d)));
  const sum = totals.reduce((a,b)=>a+b,0);
  const daysWithData = totals.filter(t=>t>0).length;
  const avg = daysWithData ? sum/7 : 0;

  document.getElementById('weekAvg').textContent = Math.round(avg);
  document.getElementById('weekTotal').textContent = Math.round(sum);
  document.getElementById('weekGoal').textContent = Math.round(weeklyGoal);
  document.getElementById('weekTotal').className = 'stat-num' + (sum>weeklyGoal ? ' coral' : '');

  /* dezenter Hinweis */
  const hintEl = document.getElementById('weekHint');
  const hintText = document.getElementById('weekHintText');
  hintEl.classList.remove('show','under','over');
  if(daysWithData >= 2){
    const avgLogged = sum/daysWithData;
    const ratio = avgLogged/dailyGoal;
    if(ratio < 0.85){
      hintEl.classList.add('show','under');
      hintText.textContent = 'Diese Woche im Schnitt ' + Math.round(dailyGoal-avgLogged) + ' kcal/Tag unter deinem Ziel.';
    } else if(ratio > 1.15){
      hintEl.classList.add('show','over');
      hintText.textContent = 'Diese Woche im Schnitt ' + Math.round(avgLogged-dailyGoal) + ' kcal/Tag über deinem Ziel.';
    }
  }

  /* Balkendiagramm */
  const chartMax = Math.max(dailyGoal, ...totals, 1) * 1.15;
  const goalPctBottom = Math.min(100, (dailyGoal/chartMax)*100);

  const chartArea = document.getElementById('chartArea');
  chartArea.innerHTML = '';

  const gline = document.createElement('div');
  gline.className = 'goal-line';
  gline.style.bottom = goalPctBottom + '%';
  gline.innerHTML = '<span class="glabel">Ziel ' + Math.round(dailyGoal) + '</span>';
  chartArea.appendChild(gline);

  weekDates.forEach((d,i)=>{
    const key = fmtKey(d);
    const total = totals[i];
    const heightPct = Math.max((total/chartMax)*100, total>0 ? 3 : 0);
    const over = total>dailyGoal;
    const today = isToday(d);

    const col = document.createElement('div');
    col.className = 'bar-col';
    col.onclick = ()=>{ currentDate = new Date(d); switchView('day'); };
    col.innerHTML = `
      <span class="bar-val">${total>0?Math.round(total):''}</span>
      <div class="bar ${over?'over':''} ${today?'today':''}" style="height:${heightPct}%"></div>
      <span class="bar-day ${today?'today-label':''}">${dayNames[i]}</span>
    `;
    chartArea.appendChild(col);
  });

  /* Häufigste Lebensmittel */
  const counts = {};
  weekDates.forEach(d=>{
    getDay(fmtKey(d)).entries.forEach(e=>{
      const norm = e.name.trim().toLowerCase();
      if(!norm) return;
      if(!counts[norm]) counts[norm] = {name: e.name.trim(), count:0, kcal:0};
      counts[norm].count += 1;
      counts[norm].kcal += e.kcal;
    });
  });
  const topFoods = Object.values(counts).sort((a,b)=> b.count-a.count || b.kcal-a.kcal).slice(0,4);

  const foodsLabel = document.getElementById('foodsLabel');
  const foodList = document.getElementById('foodList');
  foodList.innerHTML = '';
  if(topFoods.length === 0){
    foodsLabel.style.display = 'none';
  } else {
    foodsLabel.style.display = 'block';
    topFoods.forEach((f,i)=>{
      const row = document.createElement('div');
      row.className = 'food-row';
      row.innerHTML = `
        <span class="food-rank">${i+1}</span>
        <span class="food-info">
          <span class="food-name">${escapeHtml(f.name)}</span>
          <span class="food-meta">Ø ${Math.round(f.kcal/f.count)} kcal</span>
        </span>
        <span class="food-count">×${f.count}</span>
      `;
      foodList.appendChild(row);
    });
  }
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function deleteEntry(key, id){
  const day = getDay(key);
  day.entries = day.entries.filter(e=>e.id!==id);
  setDay(key, day);
  render();
}

function addEntry(name, kcal, meta){
  const key = fmtKey(currentDate);
  const day = getDay(key);
  day.entries.push({id: Date.now()+'-'+Math.random().toString(36).slice(2,7), name, kcal, meta: meta||'', time: new Date().toISOString()});
  setDay(key, day);
  render();
}

/* ---------- Modals ---------- */
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){
  document.getElementById(id).classList.remove('open');
  if(id==='scanBg') stopScanner();
}

function openManual(){
  document.getElementById('manName').value='';
  document.getElementById('manKcal').value='';
  openModal('manualBg');
}
function submitManual(){
  const name = document.getElementById('manName').value.trim();
  const kcal = parseFloat(document.getElementById('manKcal').value);
  if(!name || isNaN(kcal)){ alert('Bitte Bezeichnung und Kalorien eingeben.'); return; }
  addEntry(name, kcal, 'manuell');
  closeModal('manualBg');
}

/* ---------- Barcode-Scan (Quagga + Open Food Facts) ---------- */
let scannerRunning = false;
let lastScannedProduct = null;

function openScan(){
  document.getElementById('productResult').style.display='none';
  document.getElementById('scanConfirmBtn').style.display='none';
  document.getElementById('scanStatus').textContent = 'Kamera wird gestartet …';
  openModal('scanBg');
  startScanner();
}

function startScanner(){
  if(typeof Quagga === 'undefined'){
    document.getElementById('scanStatus').textContent = 'Scanner konnte nicht geladen werden. Bitte Internetverbindung prüfen.';
    return;
  }
  Quagga.init({
    inputStream: {
      name: "Live",
      type: "LiveStream",
      target: document.querySelector("#scanner-view"),
      constraints: { facingMode: "environment", width: {ideal: 640}, height: {ideal: 480} }
    },
    decoder: { readers: ["ean_reader","upc_reader","ean_8_reader"] },
    locate: true
  }, function(err){
    if(err){
      document.getElementById('scanStatus').textContent = 'Kein Kamerazugriff. Bitte Berechtigung erlauben (funktioniert nur über https).';
      return;
    }
    Quagga.start();
    scannerRunning = true;
    document.getElementById('scanStatus').textContent = 'Barcode ins Bild halten …';
  });

  Quagga.onDetected(onBarcodeDetected);
}

function stopScanner(){
  if(scannerRunning){
    Quagga.offDetected(onBarcodeDetected);
    Quagga.stop();
    scannerRunning = false;
  }
}

let lastCode = null;
function onBarcodeDetected(result){
  const code = result.codeResult.code;
  if(code === lastCode) return;
  lastCode = code;
  document.getElementById('scanStatus').textContent = 'Gefunden: ' + code + ' — suche Produkt …';
  lookupProduct(code);
}

async function lookupProduct(code){
  try{
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json`);
    const data = await res.json();
    if(data.status !== 1){
      document.getElementById('scanStatus').textContent = 'Produkt nicht gefunden. Manuell eingeben oder erneut scannen.';
      lastCode = null;
      return;
    }
    const p = data.product;
    const kcal100 = p.nutriments && (p.nutriments['energy-kcal_100g'] || p.nutriments['energy-kcal']);
    if(!kcal100){
      document.getElementById('scanStatus').textContent = 'Keine Kalorienangabe für dieses Produkt vorhanden.';
      lastCode = null;
      return;
    }
    lastScannedProduct = { name: p.product_name || 'Unbekanntes Produkt', kcal100: kcal100 };
    document.getElementById('pName').textContent = lastScannedProduct.name;
    document.getElementById('pKcal').textContent = Math.round(kcal100) + ' kcal / 100 g';
    document.getElementById('pGrams').value = 100;
    document.getElementById('productResult').style.display = 'block';
    document.getElementById('scanConfirmBtn').style.display = 'block';
    document.getElementById('scanStatus').textContent = 'Menge prüfen und hinzufügen.';
    stopScanner();
  } catch(e){
    document.getElementById('scanStatus').textContent = 'Fehler bei der Abfrage. Internetverbindung prüfen.';
    lastCode = null;
  }
}

function submitScan(){
  if(!lastScannedProduct) return;
  const grams = parseFloat(document.getElementById('pGrams').value) || 100;
  const kcal = lastScannedProduct.kcal100 * (grams/100);
  addEntry(lastScannedProduct.name, kcal, grams+'g');
  lastScannedProduct = null;
  lastCode = null;
  closeModal('scanBg');
}

/* ---------- Start ---------- */
render();
