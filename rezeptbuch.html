function renderListView(q) {
  const listEl=document.getElementById('bookListView');
  if(!listEl) return;
  if(q!==undefined) listViewSearch=q;
  const filter=listViewSearch.trim().toLowerCase();

  // Collect all categories present in recipes (for chips)
  const allCats=new Set();
  Object.values(recipes).forEach(r=>allCats.add(r.category||'Sonstiges'));
  const sortedAllCats=[...allCats].sort();

  // Filter recipes
  let visible=Object.values(recipes).filter(r=>{
    if(listViewBookmarksOnly && !bookmarks.has(r.id)) return false;
    if(listViewCatFilter && (r.category||'Sonstiges')!==listViewCatFilter) return false;
    if(!filter) return true;
    return r.name.toLowerCase().includes(filter)
      ||(r.description||'').toLowerCase().includes(filter)
      ||(r.category||'').toLowerCase().includes(filter)
      ||(r.ingredients||[]).some(i=>i.name.toLowerCase().includes(filter));
  });

  // Sort
  if(listViewSort==='name-desc')  visible.sort((a,b)=>b.name.localeCompare(a.name));
  else if(listViewSort==='newest') visible.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  else                             visible.sort((a,b)=>a.name.localeCompare(b.name));

  // Group by category (skip header when single-cat filter active or newest sort)
  const flatMode = listViewSort==='newest' || !!listViewCatFilter;
  let body;
  const total=Object.values(recipes).length;
  if(!total){
    body='<div style="padding-top:40px;text-align:center;color:#8B6A3A;font-style:italic;font-size:14px;">Noch keine Rezepte vorhanden.</div>';
  } else if(!visible.length){
    body='<div style="padding-top:20px;text-align:center;color:#8B6A3A;font-style:italic;font-size:14px;">Keine Ergebnisse.</div>';
  } else if(flatMode){
    body=visible.map(r=>_blvRow(r)).join('');
  } else {
    const grouped={}, cats=[];
    visible.forEach(r=>{
      const cat=r.category||'Sonstiges';
      if(!grouped[cat]){grouped[cat]=[];cats.push(cat);}
      grouped[cat].push(r);
    });
    cats.sort();
    body=cats.map(cat=>`<div class="blv-chapter">${esc(cat)}</div>${grouped[cat].map(r=>_blvRow(r)).join('')}`).join('');
  }

  const sortLabels={'name-asc':'A – Z','name-desc':'Z – A','newest':'Neueste'};
  const sortLabel=sortLabels[listViewSort]||'A – Z';
  const isSorted=listViewSort!=='name-asc';
  const favChip=`<button class="blv-cat-chip${listViewBookmarksOnly?' active':''}" onclick="toggleListBookmarks()"><svg width="11" height="14" viewBox="0 0 15 19" fill="${listViewBookmarksOnly?'currentColor':'none'}" xmlns="http://www.w3.org/2000/svg" style="vertical-align:middle;margin-right:3px"><path d="M2.5 2h10a1 1 0 0 1 1 1v14l-6-4-6 4V3a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>Favoriten</button>`;
  const chips=favChip+sortedAllCats.map(cat=>`<button class="blv-cat-chip${listViewCatFilter===cat?' active':''}" onclick="setListCatFilter('${esc(cat)}')">${esc(cat)}</button>`).join('');

  const searchVal=esc(listViewSearch);

  // If the structure already exists and we're not toggling share mode, update
  // only the dynamic parts so the <input> is never replaced (prevents keyboard
  // dismiss on Android on every keystroke).
  const existingInner = listEl.querySelector('.blv-inner');
  const existingInput = listEl.querySelector('.blv-search');
  if (!shareMode && existingInner && existingInput) {
    const catsEl = existingInner.querySelector('.blv-cats-scroll');
    const sortEl = existingInner.querySelector('.blv-sort-btn');
    const countEl = existingInner.querySelector('.blv-count');
    const bodyEl = existingInner.querySelector('.blv-body');
    if (catsEl) catsEl.innerHTML = chips;
    if (sortEl) { sortEl.className = `blv-sort-btn${isSorted?' sorted':''}`; sortEl.textContent = sortLabel; }
    if (countEl) countEl.textContent = `${visible.length} von ${total} Rezept${total!==1?'en':''}`;
    if (bodyEl) bodyEl.innerHTML = body;
    return;
  }

  listEl.innerHTML=`<div class="blv-inner">
    ${shareMode
      ?`<div style="font-family:Georgia,serif;font-size:13px;color:#8B5C14;font-weight:700;padding:10px 0 14px;text-align:center;letter-spacing:.04em;">REZEPTE AUSWÄHLEN</div>`
      :`<input class="blv-search" type="search" placeholder="Rezept suchen …" value="${searchVal}"
          oninput="renderListView(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
        <div class="blv-toolbar">
          <div class="blv-cats-scroll">${chips}</div>
          <button class="blv-sort-btn${isSorted?' sorted':''}" onclick="cycleListSort()">${esc(sortLabel)}</button>
        </div>
        <div class="blv-count">${visible.length} von ${total} Rezept${total!==1?'en':''}</div>`
    }
    <div class="blv-body">${body}</div>
  </div>`;
}

function _blvRow(r) {
  if(shareMode){
    const sel=shareSelected.has(r.id);
    return `<label class="blv-row sm-row${sel?' sm-sel':''}" data-rid="${esc(r.id)}">
      <input type="checkbox" class="blv-check"${sel?' checked':''} onchange="toggleRecipeSelect('${esc(r.id)}',this.checked)">
      <div class="blv-emoji">${esc(r.emoji)||'🍽️'}</div>
      <div class="blv-name">${esc(r.name)}</div>

function bookGoToIndex() { openedFromList=false; bookJumpToPage(0); }
function bookGoToFirstInCat(cat) { const idx=bookPages.findIndex(pg=>pg.type==='recipe'&&pg.cat===cat); if(idx>=0) bookJumpToPage(idx); }
function bookGoToRecipe(id)      { const idx=bookPages.findIndex(pg=>pg.type==='recipe'&&pg.id===id);  if(idx>=0) bookJumpToPage(idx); }

function bookJumpToPage(targetIdx) {
  if(targetIdx===bookCurrentPage) return;
  const curEl=document.getElementById('bp-'+bookCurrentPage), nextEl=document.getElementById('bp-'+targetIdx);
  if(curEl){curEl.classList.add('bp-no-t');curEl.classList.remove('bp-on','bp-left');void curEl.offsetWidth;curEl.classList.remove('bp-no-t');}
  if(nextEl){nextEl.classList.add('bp-no-t');nextEl.classList.remove('bp-left');nextEl.classList.add('bp-on');void nextEl.offsetWidth;nextEl.classList.remove('bp-no-t');nextEl.scrollTop=0;}
  bookCurrentPage=targetIdx; updateBookNav();
  if(targetIdx>0 && bookPages[targetIdx]?.type==='recipe') _addToRecent(bookPages[targetIdx].id);
  try { localStorage.setItem('rezeptbuch_page', String(bookPages[targetIdx]?.id || targetIdx)); } catch {}
}

function bookOnSearch(val) {
  bookSearch=val.trim().toLowerCase();
  const coverContent=document.getElementById('bookCoverContent'); if(!coverContent) return;
  if(!bookSearch) {
    const pg=bookPages[0]; if(!pg) return;
    const {grouped,usedCats}=pg;
    const catRows=usedCats.map(cat=>{
      const emoji=esc(grouped[cat][0]?.emoji||'🍽️');
      return `<div class="bc-cat-row" onclick="bookGoToFirstInCat('${esc(cat)}')">
        <div class="bc-cat-left"><span style="font-size:20px">${emoji}</span><span class="bc-cat-name">${esc(cat)}</span></div>
        <div style="display:flex;align-items:center;gap:8px;"><span class="bc-cat-count">${grouped[cat].length} Rezept${grouped[cat].length!==1?'e':''}</span><span class="bc-cat-arrow">›</span></div>
      </div>`;
    }).join('');
    coverContent.innerHTML=`<div class="bc-cats-label">Kategorien</div>${catRows}`;
    return;
  }
  const matches=bookPages.filter(pg=>pg.type==='recipe').filter(pg=>{
    const r=pg.r;
    if(r.name.toLowerCase().includes(bookSearch)) return true;
    if(r.description&&r.description.toLowerCase().includes(bookSearch)) return true;
    return (r.ingredients||[]).some(i=>i.name.toLowerCase().includes(bookSearch));
  });
  if(!matches.length){coverContent.innerHTML='<div style="font-family:Georgia,serif;color:#8B6A3A;text-align:center;padding:24px 0;font-size:14px;font-style:italic;">Keine Rezepte gefunden.</div>';return;}
  const rows=matches.map(pg=>`<div class="bc-result-row" onclick="bookGoToRecipe('${esc(pg.r.id)}')"><span class="bc-result-emoji">${esc(pg.r.emoji)||'🍽️'}</span><div><div class="bc-result-name">${esc(pg.r.name)}</div><div class="bc-result-meta">${esc(pg.cat)} · ${pg.r.servings} Portionen</div></div></div>`).join('');
  coverContent.innerHTML=`<div class="bc-cats-label">${matches.length} Ergebnis${matches.length!==1?'se':''}</div><div>${rows}</div>`;
}

      ?{text:s,tm5On:false,tm5Temp:'',tm5Speed:'',tm5Time:''}
      :{text:s.text||'',tm5On:!!s.tm5,tm5Temp:s.tm5?.temp||'',tm5Speed:s.tm5?.speed||'',tm5Time:s.tm5?.time||''});

function parseIngForBuilder(ing) {
  const unitFull=(ing.unit||'').trim();
  let qty=ing.qty||0, unitRaw=unitFull;
  const gm=unitFull.match(/^([\d.,]+)\s*(g|kg|ml|cl|dl|[lL])$/i);
  if(gm){qty=parseFloat(gm[1].replace(',','.'));unitRaw=gm[2];return{...ing,qty,unitRaw};}
  const pc=unitFull.match(/^([\d.,]+)\s*(stück|stk\.?)$/i);
  if(pc){qty=parseFloat(pc[1].replace(',','.'));unitRaw='Stück';return{...ing,qty,unitRaw};}
  // Handle all other named piece units: "3 EL", "2 Zehe", "1 Bund", "0.5 TL", etc.
  const any=unitFull.match(/^([\d.,]+)\s+(.+)$/);
  if(any){qty=parseFloat(any[1].replace(',','.'));unitRaw=any[2].trim();return{...ing,qty,unitRaw};}
  return{...ing,qty,unitRaw};
}

function ingForRecipe(bIng) {
  const qty=parseFloat(bIng.qty)||0, uRaw=(bIng.unitRaw||'').trim(), u=uRaw.toLowerCase();
  let unit=uRaw, amountG=0;
  if(u==='g')          {unit=`${qty} g`;    amountG=qty;}
  else if(u==='kg')    {unit=`${qty} kg`;   amountG=qty*1000;}
  else if(u==='ml')    {unit=`${qty} ml`;   amountG=qty;}
  else if(u==='cl')    {unit=`${qty} cl`;   amountG=qty*10;}
  else if(u==='dl')    {unit=`${qty} dl`;   amountG=qty*100;}
  else if(u==='l')     {unit=`${qty} L`;    amountG=qty*1000;}
  else if(u==='stück'||u==='stk'||u==='stk.'){unit=`${qty} Stück`;}
  return{name:(bIng.name||'').trim(),emoji:bIng.emoji||'',unit,amountG,qty,custom:false,
    kcalPer100:bIng.kcalPer100||0,proteinPer100:bIng.proteinPer100||0,
    carbsPer100:bIng.carbsPer100||0,fatPer100:bIng.fatPer100||0,
    unitPrice:bIng.unitPrice||0,unitG:bIng.unitG||0};
}

async function saveRecipe() {
  const name=document.getElementById('bldName').value.trim();
  if(!name){showToast('Bitte einen Rezeptnamen eingeben');return;}
  const id=builderEditId||Date.now().toString();
  const existing=builderEditId?recipes[builderEditId]:null;
  recipes[id]={
    id, createdAt:existing?(existing.createdAt||Date.now()):Date.now(),
    name, emoji:document.getElementById('bldEmoji').value.trim()||'🍽️',
    category:document.getElementById('bldCategory').value||'Sonstiges',
    servings:parseInt(document.getElementById('bldServings').value)||4,
    description:document.getElementById('bldDesc').value.trim(),
    steps:builderSteps.filter(s=>(s.text||'').trim()).map(s=>{
      if(!s.tm5Temp&&!s.tm5Speed&&!s.tm5Time) return s.text;
      const tm5={};
      if(s.tm5Temp) tm5.temp=s.tm5Temp;
      if(s.tm5Speed) tm5.speed=s.tm5Speed;
      if(s.tm5Time) tm5.time=s.tm5Time;
      return {text:s.text, tm5};
    }),
    ingredients:builderIngredients.filter(i=>i.name.trim()).map(ingForRecipe),
  };
  saveRecipes();
  for(const delId of builderDeletedIds) await deleteRecipeImage(delId, builderEditId||id);
  for(const img of builderPendingImgs) await addRecipeImage(id, img.dataUrl);
  closeBuilder();
  buildBookPages(); bookCurrentPage=0; renderBookAllPages(); updateBookNav();
  const targetIdx=bookPages.findIndex(pg=>pg.type==='recipe'&&pg.id===id);
  if(targetIdx>=0) bookJumpToPage(targetIdx);
  showToast(builderEditId?'Rezept gespeichert':'Rezept hinzugefügt');
}

async function deleteRecipeConfirm(id) {
  const r=recipes[id]; if(!r) return;
  if(!confirm(`„${r.name}" wirklich löschen?`)) return;
  await deleteAllImagesForRecipe(id);
  delete recipes[id]; delete bookPortions[id]; saveRecipes();
  buildBookPages(); bookCurrentPage=0; renderBookAllPages(); updateBookNav();
  showToast('Rezept gelöscht');
}

function ingAcFilter(i, val) {
  const ac = document.getElementById('bld-ac-' + i); if (!ac) return;
  const q = val.trim().toLowerCase();
  if (q.length < 2) { ac.innerHTML = ''; return; }
  const matches = [];
  for (let j = 0; j < SUGGESTIONS.length && matches.length < 6; j++) {
    if (SUGGESTIONS[j].name.toLowerCase().includes(q)) matches.push({s: SUGGESTIONS[j], j});
  }
  if (!matches.length) { ac.innerHTML = ''; return; }
  ac.innerHTML = matches.map(m =>
    `<div class="bld-ing-ac-item" onmousedown="ingAcSelect(${i},${m.j})">${m.s.emoji} <span>${esc(m.s.name)}</span></div>`
  ).join('');
}
function ingAcSelect(i, si) {
  const s = SUGGESTIONS[si]; if (!s) return;
  const unitG = _parseUnitG(s.unit);
  builderIngredients[i] = {
    ...builderIngredients[i],
    name: s.name, emoji: s.emoji,
    kcalPer100: s.kcal, proteinPer100: s.protein,
    carbsPer100: s.carbs, fatPer100: s.fat,
    unitPrice: s.price, unitG, catalogUnit: s.unit
  };
  renderBuilderIngredients();
  const qtyInputs = document.querySelectorAll('.bld-ing-qty');
  if (qtyInputs[i]) qtyInputs[i].focus();
}
function ingAcHide(i) {

}

// ── Add recipe to shopping list ──
function addRecipeToList(recipeId, pageIdx) {
  const r = recipes[recipeId]; if (!r) return;
  const portions = bookPortions[recipeId] || r.servings || 4;
  const scale = portions / (r.servings || 4);
  const ingredients = (r.ingredients || []).filter(i => !i.custom);
  if (!ingredients.length) { showToast('Keine Zutaten vorhanden'); return; }
  let pending = [];
  try { pending = JSON.parse(localStorage.getItem('pending_einkauf_items') || '[]'); } catch {}
  let added = 0;
  for (const ing of ingredients) {
    pending.push({ name: ing.name, emoji: ing.emoji || '🛒', amount: cookFmtAmt(ing, scale), store: '', checked: false, addedAt: Date.now() });
    added++;
  }
  try { localStorage.setItem('pending_einkauf_items', JSON.stringify(pending)); } catch(e) {}
  showToast(`${added} Zutat${added !== 1 ? 'en' : ''} zur Einkaufsliste`, {label: 'Öffnen →', url: './einkaufsliste.html'});
}

function autoResize(el) { el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }

// ── Ins Tagebuch ──
let _tbshRecipeId=null, _tbshPct=100, _tbshBaseKcal=0, _tbshNutrBase=null;

function addRecipeToKalorien(recipeId) {
  const r=recipes[recipeId]; if(!r) return;
  const portions=bookPortions[recipeId]||r.servings||4;
  const scale=portions/(r.servings||4);
  const ings=(r.ingredients||[]).filter(i=>!i.custom);
  const nutr=calcNutrition(ings,scale);
  if(!nutr){showToast('Keine Nährwerte vorhanden');return;}
  _tbshRecipeId=recipeId;
  _tbshBaseKcal=nutr.kcal;
  _tbshNutrBase=nutr;
  _tbshPct=100;
  document.getElementById('tbshTitle').textContent=(r.emoji||'🍽️')+' '+r.name;
  document.getElementById('tbshSub').textContent=portions+' Portion'+(portions!==1?'en':'');
  document.getElementById('tbshCustomIn').value='';
  document.querySelectorAll('.tbsh-pct-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tbsh-pct-btn')[3].classList.add('active');
  _tbshUpdatePreview();
  document.getElementById('tagebuchSheet').hidden=false;
}
function _tbshSetPct(pct) {
  _tbshPct=pct;
  document.querySelectorAll('.tbsh-pct-btn').forEach(b=>b.classList.remove('active'));
  const idx={25:0,50:1,75:2,100:3}[pct];
  if(idx!=null) document.querySelectorAll('.tbsh-pct-btn')[idx].classList.add('active');
  document.getElementById('tbshCustomIn').value='';
  _tbshUpdatePreview();
}
function _tbshCustomInput(val) {
  const v=parseFloat(val);
  if(!isNaN(v)&&v>0){
    _tbshPct=v;
    document.querySelectorAll('.tbsh-pct-btn').forEach(b=>b.classList.remove('active'));
    _tbshUpdatePreview();
  }
}
function _tbshUpdatePreview() {
  const kcal=Math.round(_tbshBaseKcal*_tbshPct/100);
  const el=document.getElementById('tbshPreview');
  el.innerHTML='<strong>'+kcal+' kcal</strong> ('+((_tbshPct===Math.floor(_tbshPct)?_tbshPct:_tbshPct.toFixed(1)))+'%)';
}
function _tbshConfirm() {
  document.getElementById('tagebuchSheet').hidden=true;
  const r=recipes[_tbshRecipeId]; if(!r) return;
  const f=_tbshPct/100;
  const kcal=Math.round(_tbshBaseKcal*f);
  const nutr=_tbshNutrBase;
  const now=new Date();
  const key=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  let store={};
  try{store=JSON.parse(localStorage.getItem('kalorientracker_v1')||'{}');}catch{}
  if(!store[key]) store[key]={entries:[],water:0};
  const portions=bookPortions[_tbshRecipeId]||r.servings||4;
  store[key].entries.push({
    id:Date.now()+'-'+Math.random().toString(36).slice(2,7),
    name:(r.emoji||'🍽️')+' '+r.name+(_tbshPct!==100?' ('+(_tbshPct===Math.floor(_tbshPct)?_tbshPct:_tbshPct.toFixed(0))+'%)':''),
    kcal,
    meta:'',
    nutrients:{protein:parseFloat((nutr.protein*f).toFixed(1)),carbs:parseFloat((nutr.carbs*f).toFixed(1)),fat:parseFloat((nutr.fat*f).toFixed(1))},
    kcalPer100:null,
    unit:'Portion',
    amount:portions*f,
    meal:null,
    time:now.toISOString()
  });
  try{localStorage.setItem('kalorientracker_v1',JSON.stringify(store));}catch(e){}
  showToast((r.emoji||'🍽️')+' '+kcal+' kcal ins Tagebuch eingetragen');
}

// ── Step Timer ──
const _CIRC=2*Math.PI*44;
let _timerSecs=0,_timerTotal=0,_timerRunning=false,_timerIv=null;

function _parseTm5Time(s){
  if(!s) return 0;
  const p=String(s).trim().split(':').map(n=>parseInt(n)||0);
  if(p.length===3) return p[0]*3600+p[1]*60+p[2];
  if(p.length===2) return p[0]*60+p[1];
  return p[0]*60;
}

function _markTimers(html){
  return html.replace(/(?:ca\.\s*)?(\d+)(?:\s*[-–]\s*\d+)?\s*(Stunden?|Std\.?|Minuten?|Min\.?)/gi,(m,n,u)=>{
    const isH=/stund|std/i.test(u), secs=(parseInt(n)||1)*(isH?3600:60);
    if(secs<60||secs>10800) return m;
    return `<button class="step-time-btn" onclick="startTimer(${secs})" title="Timer starten">⏱ ${m}</button>`;
  });
}

function startTimer(secs){
  _timerSecs=_timerTotal=Math.max(1,secs);
  _timerRunning=true;
  clearInterval(_timerIv);
  _timerIv=setInterval(_timerTick,1000);
  _updateTimerUI(false);
  document.getElementById('timerOverlay').hidden=false;
  document.getElementById('timerPauseBtn').textContent='⏸';
}
function _timerTick(){
  if(!_timerRunning) return;
  _timerSecs--;
  _updateTimerUI(false);
  if(_timerSecs<=0){clearInterval(_timerIv);_timerIv=null;_timerRunning=false;_timerDone();}
}
function _updateTimerUI(done){
  const d=document.getElementById('timerDisplay'), fg=document.getElementById('timerRingFg');
  if(!d||!fg) return;
  if(done){d.className='timer-display done';d.textContent='Fertig! 🎉';fg.classList.add('done');return;}
  const s=Math.max(0,_timerSecs),m=Math.floor(s/60),ss=s%60;
  d.className='timer-display';
  d.textContent=(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
  fg.classList.remove('done');
  fg.style.strokeDashoffset=_CIRC*(1-(_timerTotal>0?s/_timerTotal:0));
}
function timerToggle(){
  _timerRunning=!_timerRunning;
  document.getElementById('timerPauseBtn').textContent=_timerRunning?'⏸':'▶';
  if(_timerRunning){_timerIv=setInterval(_timerTick,1000);}
  else{clearInterval(_timerIv);_timerIv=null;}
}
function timerClose(){
  clearInterval(_timerIv);_timerIv=null;_timerRunning=false;
  document.getElementById('timerOverlay').hidden=true;
}
function _timerDone(){
  _updateTimerUI(true);
  try{navigator.vibrate([300,100,300,100,600]);}catch{}
  const o=document.getElementById('timerOverlay');
  o.classList.add('timer-flash');
  setTimeout(()=>o.classList.remove('timer-flash'),800);
}

// ── Cook Mode ──
const COOKTIMES_STORE = 'rezeptbuch_cooktimes';

function _ckLoadTimes() {
  try { return JSON.parse(localStorage.getItem(COOKTIMES_STORE) || '{}'); } catch { return {}; }
}
function _ckSaveTime(recipeId, secs) {
  const all = _ckLoadTimes();
  if (!all[recipeId]) all[recipeId] = [];
  all[recipeId].push(secs);
  if (all[recipeId].length > 20) all[recipeId] = all[recipeId].slice(-20);
  try { localStorage.setItem(COOKTIMES_STORE, JSON.stringify(all)); } catch {}
}
function _ckGetAvgTime(recipeId) {
  const all = _ckLoadTimes();
  const arr = all[recipeId];
  if (!arr || !arr.length) return null;
  return Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
}
function _fmtSecs(s) {
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  if (h) return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function _ckExtractSecs(step) {
  const text = typeof step === 'string' ? step : (step.text || '');
  const tm5 = typeof step === 'object' ? step.tm5 : null;
  if (tm5 && tm5.time) { const s=_parseTm5Time(tm5.time); if(s>=60) return s; }
  const m = text.match(/(?:ca\.\s*)?(\d+)(?:\s*[-–]\s*(\d+))?\s*(Stunden?|Std\.?|Minuten?|Min\.?)/i);
  if (m) {
    const isH = /stund|std/i.test(m[3]);
    const n = m[2] ? Math.round((parseInt(m[1])+parseInt(m[2]))/2) : parseInt(m[1]);
    const s = n * (isH ? 3600 : 60);
    if (s >= 60 && s <= 10800) return s;
  }
  return 0;
}
function _ckStepIngredients(r, stepIdx) {
  const ings = (r.ingredients || []).filter(i => !i.custom && i.qty > 0);
  if (!ings.length) return [];
  const steps = (r.steps || []).filter(s => (typeof s === 'string' ? s : (s.text || '')).trim());
  if (steps.length <= 1) return ings;
  const text = (typeof steps[stepIdx] === 'string' ? steps[stepIdx] : (steps[stepIdx]?.text || '')).toLowerCase();
  const matched = ings.filter(ing => {
    const words = ing.name.toLowerCase().split(/\s+/);
    return words.some(w => w.length >= 3 && text.includes(w));
  });
  return matched.length ? matched : (stepIdx === 0 ? ings : []);
}

let _ckRecipeId = null, _ckStepIdx = 0, _ckSteps = [];
let _ckSwSecs = 0, _ckSwIv = null;
let _ckCdSecs = 0, _ckCdTotal = 0, _ckCdRunning = false, _ckCdIv = null;
let _ckPageIdx = 0;

function openCookMode(recipeId, pageIdx) {
  const r = recipes[recipeId]; if (!r) return;
  const steps = (r.steps || []).filter(s => (typeof s === 'string' ? s : (s.text || '')).trim());
  if (!steps.length) { showToast('Keine Zubereitungsschritte vorhanden'); return; }
  _ckRecipeId = recipeId; _ckPageIdx = pageIdx; _ckSteps = steps; _ckStepIdx = 0;
  _ckSwSecs = 0; clearInterval(_ckSwIv);
  _ckSwIv = setInterval(_ckSwTick, 1000);
  clearInterval(_ckCdIv); _ckCdIv = null; _ckCdRunning = false; _ckCdSecs = _ckCdTotal = 0;
  document.getElementById('ckHeaderName').textContent = r.name;
  document.getElementById('ckStopwatch').textContent = '00:00';
  const ckNavRow = document.querySelector('.ck-nav-row');
  if (ckNavRow) ckNavRow.style.display = '';
  _ckRenderProgress();
  _ckRenderStep();
  const cv = document.getElementById('cookView');
  cv.classList.remove('hidden');
  cv.scrollTop = 0;
  _pushBackGuard();
  try { navigator.vibrate && navigator.vibrate(30); } catch {}
}
function closeCookMode() {
  clearInterval(_ckSwIv); _ckSwIv = null;
  clearInterval(_ckCdIv); _ckCdIv = null;
  document.getElementById('cookView').classList.add('hidden');
}
function _ckSwTick() {
  _ckSwSecs++;
  document.getElementById('ckStopwatch').textContent = _fmtSecs(_ckSwSecs);
}
function _ckRenderProgress() {
  const row = document.getElementById('ckProgressRow');
  row.innerHTML = _ckSteps.map((_,i) =>
    `<div class="ck-progress-dot${i<_ckStepIdx?' done':i===_ckStepIdx?' active':''}"></div>`
  ).join('');
}
function _ckRenderStep() {
  const r = recipes[_ckRecipeId]; if (!r) return;
  const step = _ckSteps[_ckStepIdx];
  const text = typeof step === 'string' ? step : (step.text || '');
  const isLast = _ckStepIdx === _ckSteps.length - 1;
  const portions = bookPortions[_ckRecipeId] || r.servings || 4;
  const scale = portions / (r.servings || 4);
  const ings = _ckStepIngredients(r, _ckStepIdx);
  const ingChips = ings.map(i =>
    `<div class="ck-ing-chip"><span>${esc(i.emoji||'')}</span><span>${esc(i.name)}</span><span class="ck-ing-chip-amt">${esc(cookFmtAmt(i, scale))}</span></div>`
  ).join('');
  const secs = _ckExtractSecs(step);
  let timerHTML = '';
  if (secs) {
    _ckCdTotal = _ckCdSecs = secs;
    timerHTML = `<div class="ck-step-timer-wrap">
      <div class="ck-step-timer-label">Countdown</div>
      <div class="ck-countdown-display" id="ckCdDisplay">${_fmtSecs(secs)}</div>
      <div class="ck-countdown-btns">
        <button class="ck-cd-btn ck-cd-start" id="ckCdToggleBtn" onclick="ckCdToggle()">▶ Start</button>
        <button class="ck-cd-btn ck-cd-reset" onclick="ckCdReset()">↺ Reset</button>
      </div>
    </div>`;
  } else {
    _ckCdSecs = _ckCdTotal = 0; _ckCdRunning = false;
    clearInterval(_ckCdIv); _ckCdIv = null;
  }
  const doneBtn = document.getElementById('ckDoneBtn');
  if (doneBtn) {
    doneBtn.textContent = isLast ? '🏁 Fertig!' : '✓ Erledigt';
    doneBtn.classList.toggle('last-step', isLast);
  }
  const backBtn = document.getElementById('ckBackBtn');
  if (backBtn) backBtn.disabled = _ckStepIdx === 0;
  document.getElementById('ckBody').innerHTML = `<div class="ck-body-inner">
    <div class="ck-step-label">Schritt ${_ckStepIdx + 1} von ${_ckSteps.length}</div>
    <div class="ck-step-card"><div class="ck-step-text">${_markTimers(esc(text))}</div></div>
    ${timerHTML}
    ${ings.length ? `<div class="ck-ings-wrap"><div class="ck-ings-label">Zutaten für diesen Schritt</div><div class="ck-ings-chips">${ingChips}</div></div>` : ''}
  </div>`;
  document.getElementById('ckBody').scrollTop = 0;
  _ckRenderProgress();
}
function cookNextStep() {
  if (_ckStepIdx < _ckSteps.length - 1) {
    clearInterval(_ckCdIv); _ckCdIv = null; _ckCdRunning = false;
    _ckStepIdx++;
    _ckRenderStep();
    try { navigator.vibrate && navigator.vibrate([20,10,20]); } catch {}
  } else {
    _ckShowSummary();
  }
}
function cookPrevStep() {
  if (_ckStepIdx > 0) {
    clearInterval(_ckCdIv); _ckCdIv = null; _ckCdRunning = false;
    _ckStepIdx--;
    _ckRenderStep();
  }
}
function _ckShowSummary() {
  clearInterval(_ckSwIv); _ckSwIv = null;
  clearInterval(_ckCdIv); _ckCdIv = null;
  const secs = _ckSwSecs;
  const avgSecs = _ckGetAvgTime(_ckRecipeId);
  const avgLine = avgSecs ? `<div class="ck-summary-avg">Dein Durchschnitt: ${Math.round(avgSecs/60)} Min.</div>` : '';
  document.getElementById('ckBody').innerHTML = `<div class="ck-summary-wrap">
    <div class="ck-summary-trophy">🏆</div>
    <div class="ck-summary-title">Geschafft!</div>
    <div class="ck-summary-subtitle">Das Essen ist fertig. Guten Appetit!</div>
    <div class="ck-summary-time-box">
      <div class="ck-summary-time-val">${_fmtSecs(secs)}</div>
      <div class="ck-summary-time-lbl">Gesamte Kochzeit</div>
    </div>
    ${avgLine}
    <button class="ck-summary-save-btn" id="ckSaveBtn" onclick="cookSaveTime(${secs})">⏱ Zeit speichern</button>
    <button class="ck-summary-close-btn" onclick="closeCookMode()">Schließen</button>
  </div>`;
  document.getElementById('ckProgressRow').innerHTML = _ckSteps.map(() =>
    `<div class="ck-progress-dot done"></div>`).join('');
  const nav = document.querySelector('.ck-nav-row');
  if (nav) nav.style.display = 'none';
  try { navigator.vibrate && navigator.vibrate([100,50,100,50,300]); } catch {}
}
function cookSaveTime(secs) {
  _ckSaveTime(_ckRecipeId, secs);
  const btn = document.getElementById('ckSaveBtn');
  if (btn) { btn.textContent = '✓ Gespeichert'; btn.disabled = true; }
  const avgSecs = _ckGetAvgTime(_ckRecipeId);
  if (avgSecs !== null && _ckPageIdx !== null) {
    const el = document.getElementById('brp-cook-avg-' + _ckPageIdx);
    if (el) el.textContent = '⏱ Ø ' + Math.round(avgSecs / 60) + ' Min.';
  }
  showToast('Kochzeit gespeichert');
}
function ckCdToggle() {
  if (_ckCdSecs <= 0) { ckCdReset(); return; }
  _ckCdRunning = !_ckCdRunning;
  const btn = document.getElementById('ckCdToggleBtn');
  if (_ckCdRunning) {
    if (btn) btn.textContent = '⏸ Pause';
    clearInterval(_ckCdIv);
    _ckCdIv = setInterval(_ckCdTick, 1000);
  } else {
    if (btn) btn.textContent = '▶ Weiter';
    clearInterval(_ckCdIv); _ckCdIv = null;
  }
}
function ckCdReset() {
  clearInterval(_ckCdIv); _ckCdIv = null; _ckCdRunning = false;
  _ckCdSecs = _ckCdTotal;
  const disp = document.getElementById('ckCdDisplay');
  if (disp) { disp.textContent = _fmtSecs(_ckCdSecs); disp.classList.remove('done'); }
  const btn = document.getElementById('ckCdToggleBtn');
  if (btn) btn.textContent = '▶ Start';
}
function _ckCdTick() {
  if (_ckCdSecs <= 0) {
    clearInterval(_ckCdIv); _ckCdIv = null; _ckCdRunning = false;
    const disp = document.getElementById('ckCdDisplay');
    if (disp) { disp.textContent = '00:00'; disp.classList.add('done'); }
    const btn = document.getElementById('ckCdToggleBtn');
    if (btn) btn.textContent = '▶ Neu';
    try { navigator.vibrate && navigator.vibrate([300,100,300]); } catch {}
    showToast('⏱ Zeit abgelaufen!');
    return;
  }
  _ckCdSecs--;
  const disp = document.getElementById('ckCdDisplay');
  if (disp) disp.textContent = _fmtSecs(_ckCdSecs);
}

// ── Toast ──
let _toastTimer=null;
function showToast(msg, action) {
  const t=document.getElementById('toast');
  document.getElementById('toastMsg').textContent=msg;
  const a=document.getElementById('toastAction');
  if(action){
    a.textContent=action.label;
    a.href=action.url;
    a.hidden=false;
  } else {
    a.hidden=true;
  }
  t.classList.add('show');
  clearTimeout(_toastTimer);
  const dur = action ? 4000 : 2200;
  _toastTimer=setTimeout(()=>t.classList.remove('show'), dur);
}

// ── Refresh ──
async function refreshBook(silent=false) {
  loadRecipes();
  await loadAllRecipeImages();
  const cur = bookCurrentPage;
  buildBookPages();
  renderBookAllPages();
  if(bookViewMode==='list') { renderListView(); }
  else { bookJumpToPage(Math.min(cur, bookPages.length - 1)); }
  updateBookNav();
  if(!silent) showToast('Aktualisiert');
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refreshBook(true);
});

// ── Hardware-Back (Android / Gesten-Navigation) ──
// Push a guard entry so the hardware back button fires popstate instead of closing the app.
function _pushBackGuard() {
  history.pushState({rb: true}, '');
}

window.addEventListener('popstate', function(e) {
  // Only intercept our own entries
  if (!e.state || !e.state.rb) return;

  const cookView = document.getElementById('cookView');
  if (cookView && !cookView.classList.contains('hidden')) {
    closeCookMode();
    _pushBackGuard();
    return;
  }

  if (shareMode) {
    toggleShareMode();
    _pushBackGuard();
    return;
  }
  if (bookViewMode === 'book' && bookCurrentPage > 0) {
    if (openedFromList) { _backToList(); _pushBackGuard(); return; }
    bookGoToIndex();
    _pushBackGuard();
    return;
  }
  if (bookViewMode === 'list') {
    // Switch to book view instead of closing
    toggleBookView();
    _pushBackGuard();
    return;
  }
  // On cover page → don't re-push: next back closes the app (standard behaviour)
});

// ── Init ──
(async()=>{
  loadRecipes();
  loadBookmarks();
  loadRecent();
  await loadAllRecipeImages();
  buildBookPages();
  renderBookAllPages();
  updateBookNav();
  if(bookViewMode==='list'){
    renderListView();
    const listEl=document.getElementById('bookListView');
    if(listEl) listEl.classList.add('visible');
  } else {
    try {
      const saved = localStorage.getItem('rezeptbuch_page');
      if(saved) {
        const idx = bookPages.findIndex(pg => pg.id === saved || String(pg.id) === saved);
        if(idx > 0) bookJumpToPage(idx);
      }
    } catch {}
  }
  // Push guard after initial render so back button is intercepted
  history.replaceState({rb: false}, ''); // base entry (leaving here closes app)
  _pushBackGuard();                       // guard entry (intercepted by popstate)
})();

if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
