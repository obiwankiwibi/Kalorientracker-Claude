<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rezeptbuch</title>
  <link rel="manifest" href="manifest-rezeptbuch.json">
  <meta name="theme-color" content="#2C1808">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rezeptbuch">
  <link rel="apple-touch-icon" href="icon-rezeptbuch.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #2C1808;
      font-family: Georgia, serif;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    #app {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      overflow: hidden; background: #2C1808;
    }

    /* ── Header ── */
    .book-header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px 10px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: #2C1808; flex-shrink: 0;
    }
    .book-back {
      background: none; border: none; color: #D4A96A;
      font-size: 15px; font-weight: 600; cursor: pointer;
      padding: 6px 4px; font-family: Georgia, serif; min-width: 60px;
    }
    .book-header-title {
      flex: 1; font-family: Georgia, serif; font-size: 13px; font-weight: 700;
      color: #E8D0A0; text-align: center; letter-spacing: .1em; text-transform: uppercase;
    }
    .book-header-spacer { min-width: 60px; }
    .book-header-right { display: flex; align-items: center; gap: 0; min-width: 60px; justify-content: flex-end; }
    .book-add-btn { background: none; border: none; color: #D4A96A; font-size: 26px; font-weight: 700; cursor: pointer; padding: 4px 6px; line-height: 1; }
    .book-add-btn.hidden { visibility: hidden; }
    .book-view-toggle { background: none; border: none; color: #D4A96A; font-size: 17px; cursor: pointer; padding: 6px 4px; line-height: 1; }
    .book-bookmark-btn { background: none; border: none; color: #C4A46A; cursor: pointer; padding: 6px 5px; line-height: 1; display: none; align-items: center; }
    .book-bookmark-btn.visible { display: inline-flex; }
    .book-bookmark-btn.bm-active { color: #8B5C14; }
    .blv-bookmark { flex-shrink: 0; color: #C4A46A; display: flex; align-items: center; padding: 6px 4px; margin-right: -4px; -webkit-tap-highlight-color: rgba(139,92,20,.12); }
    .blv-bookmark.bm-active { color: #8B5C14; }

    /* ── List view ── */
    #bookListView {
      position: absolute; inset: 0; background: #FDF8EE;
      overflow-y: auto; overflow-x: hidden; display: none; z-index: 2;
    }
    #bookListView.visible { display: block; }
    .blv-inner { padding: 12px 20px 100px; max-width: 440px; margin: 0 auto; }
    .blv-search { width: 100%; padding: 11px 16px; border-radius: 24px; border: 1.5px solid #C4A46A; background: #F5EDD8; color: #4A2E0A; font-size: 15px; font-family: Georgia,serif; outline: none; margin-bottom: 4px; }
    .blv-search::placeholder { color: #A8875A; }
    .blv-search:focus { border-color: #8B5C14; }
    .blv-chapter { font-family: Georgia,serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .10em; color: #FDF8EE; background: #6B3F0E; margin: 18px -20px 0; padding: 8px 20px 7px; }
    .blv-chapter:first-child { margin-top: 2px; }
    .blv-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid #EDD9C0; cursor: pointer; -webkit-tap-highlight-color: rgba(139,92,20,.08); }
    .blv-row:last-child { border-bottom: none; }
    .blv-row:active { opacity: .7; }
    .blv-emoji { font-size: 26px; flex-shrink: 0; width: 34px; text-align: center; }
    .blv-name { font-family: Georgia,serif; font-size: 16px; font-weight: 700; color: #4A2E0A; flex: 1; }
    .blv-arrow { color: #C4A46A; font-size: 16px; flex-shrink: 0; }

    /* ── Pull-to-refresh hint ── */
    #ptrHint {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: #2C1808; color: #D4A96A;
      font-family: Georgia,serif; font-size: 13px;
      padding: 10px 0; z-index: 200;
      transform: translateY(-100%);
      transition: transform .25s cubic-bezier(.4,0,.2,1);
      pointer-events: none;
    }
    #ptrHint.visible { transform: translateY(0); }

    /* ── Pages ── */
    .book-pages { flex: 1; position: relative; overflow: hidden; }
    .book-page {
      position: absolute; inset: 0; background: #FDF8EE;
      overflow-y: auto; overflow-x: hidden;
      transform: translateX(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      will-change: transform;
    }
    .book-page.bp-on   { transform: translateX(0); }
    .book-page.bp-left { transform: translateX(-100%); }
    .book-page.bp-no-t { transition: none !important; }

    /* ── Cover ── */
    .bc-inner { padding: 36px 24px 100px; max-width: 440px; margin: 0 auto; }
    .bc-ornament { text-align: center; font-size: 20px; color: #C4A46A; letter-spacing: .4em; margin-bottom: 16px; }
    .bc-title { font-family: Georgia,serif; font-size: 30px; font-weight: 700; color: #4A2E0A; text-align: center; margin-bottom: 4px; line-height: 1.2; }
    .bc-subtitle { font-family: Georgia,serif; font-size: 13px; color: #8B6A3A; text-align: center; margin-bottom: 24px; font-style: italic; }
    .bc-search { width: 100%; padding: 13px 18px; border-radius: 28px; border: 1.5px solid #C4A46A; background: #F5EDD8; color: #4A2E0A; font-size: 15px; font-family: Georgia,serif; outline: none; }
    .bc-search::placeholder { color: #A8875A; }
    .bc-search:focus { border-color: #8B5C14; box-shadow: 0 0 0 3px rgba(139,92,20,.1); }
    .bc-divider { border: none; border-top: 1px solid #D4B896; margin: 20px 0; }
    .bc-cats-label { font-family: Georgia,serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: #8B6A3A; margin-bottom: 10px; }
    .bc-cat-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid #EDD9C0; cursor: pointer; }
    .bc-cat-row:last-child { border-bottom: none; }
    .bc-cat-left { display: flex; align-items: center; gap: 12px; }
    .bc-cat-name { font-family: Georgia,serif; font-size: 17px; font-weight: 700; color: #4A2E0A; }
    .bc-cat-count { font-family: Georgia,serif; font-size: 13px; color: #8B6A3A; font-style: italic; }
    .bc-cat-arrow { color: #C4A46A; font-size: 16px; }
    .bc-result-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #EDD9C0; cursor: pointer; }
    .bc-result-row:last-child { border-bottom: none; }
    .bc-result-emoji { font-size: 24px; flex-shrink: 0; }
    .bc-result-name { font-family: Georgia,serif; font-size: 16px; font-weight: 700; color: #4A2E0A; }
    .bc-result-meta { font-family: Georgia,serif; font-size: 12px; color: #8B6A3A; }

    /* ── Recipe page ── */
    .brp-inner { padding: 0 0 100px; max-width: 440px; margin: 0 auto; }
    .brp-content { padding: 28px 22px 0; }
    .brp-cat { font-family: Georgia,serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: #8B5C14; text-align: center; margin-bottom: 10px; }
    .brp-emoji { font-size: 54px; text-align: center; margin-bottom: 10px; line-height: 1; }
    .brp-name { font-family: Georgia,serif; font-size: 26px; font-weight: 700; color: #4A2E0A; text-align: center; margin-bottom: 18px; line-height: 1.25; }
    .brp-portions-row { display: flex; align-items: center; justify-content: center; gap: 12px; background: #EDD9B0; border-radius: 16px; padding: 10px 16px; margin-bottom: 24px; }
    .brp-portions-label { font-family: Georgia,serif; font-size: 13px; color: #5C3317; font-weight: 600; }
    .brp-portions-btn { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #C4A46A; background: #FDF8EE; color: #8B5C14; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .brp-portions-val { font-family: Georgia,serif; font-size: 18px; font-weight: 700; color: #4A2E0A; min-width: 32px; text-align: center; }
    .brp-nutr-row { display: flex; justify-content: center; gap: 16px; background: #F5EFE0; border-radius: 12px; padding: 9px 14px; margin: -10px 0 20px; flex-wrap: wrap; }
    .brp-nutr-item { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .brp-nutr-val { font-family: Georgia,serif; font-weight: 700; font-size: 14px; color: #4A2E0A; font-variant-numeric: tabular-nums; }
    .brp-nutr-lbl { font-family: Georgia,serif; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #8B5C14; }
    .brp-section { margin-bottom: 24px; }
    .brp-section-title { font-family: Georgia,serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #8B5C14; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #D4B896; }
    .brp-ingr-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #EDD9C0; font-family: Georgia,serif; }
    .brp-ingr-item:last-child { border-bottom: none; }
    .brp-ingr-left { display: flex; align-items: center; gap: 8px; color: #4A2E0A; font-size: 14px; }
    .brp-ingr-amt { font-weight: 700; color: #8B5C14; font-size: 14px; font-variant-numeric: tabular-nums; }
    .brp-step { display: flex; gap: 14px; margin-bottom: 18px; }
    .brp-step-num { width: 28px; height: 28px; background: #EDD9B0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: Georgia,serif; font-size: 13px; font-weight: 700; color: #8B5C14; flex-shrink: 0; margin-top: 2px; }
    .brp-step-text { font-family: Georgia,serif; font-size: 15px; color: #4A2E0A; line-height: 1.65; flex: 1; }
    .brp-desc { font-family: Georgia,serif; font-size: 15px; color: #4A2E0A; line-height: 1.65; white-space: pre-wrap; }
    .brp-actions { display: flex; gap: 10px; padding: 4px 22px; }
    .brp-list-btn { width: 100%; padding: 12px; border: 1.5px solid #8B5C14; background: #EDD9B0; color: #4A2E0A; font-family: Georgia,serif; font-size: 15px; font-weight: 700; border-radius: 10px; cursor: pointer; }
    .brp-list-btn:active { background: #D4B896; }
    .brp-edit-btn { flex: 1; padding: 11px; border: 1.5px solid #C4A46A; background: #FDF8EE; color: #8B5C14; font-family: Georgia,serif; font-size: 14px; border-radius: 10px; cursor: pointer; }
    .brp-del-btn  { flex: 1; padding: 11px; border: 1.5px solid #D4B896; background: #FDF8EE; color: #A06060; font-family: Georgia,serif; font-size: 14px; border-radius: 10px; cursor: pointer; }

    /* ── Photo gallery (recipe view) ── */
    .brp-photo-gallery {
      display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }
    .brp-photo-gallery::-webkit-scrollbar { display: none; }
    .brp-photo-gallery img {
      width: 110px; height: 110px; object-fit: cover;
      flex-shrink: 0; cursor: pointer; border-radius: 10px;
      border: 1.5px solid #D4B896;
    }

    /* ── Lightbox ── */
    .lightbox-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.95);
      z-index: 600; display: flex; align-items: center; justify-content: center;
    }
    .lightbox-img { max-width: 96vw; max-height: 88vh; border-radius: 8px; object-fit: contain; }
    .lightbox-close { position: absolute; top: 18px; right: 18px; background: none; border: none; color: #fff; font-size: 30px; cursor: pointer; padding: 4px 10px; line-height: 1; }
    .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.15); border: none; color: #fff; font-size: 28px; cursor: pointer; padding: 12px 14px; border-radius: 50%; line-height: 1; }
    .lightbox-prev { left: 12px; }
    .lightbox-next { right: 12px; }

    /* ── Bottom nav ── */
    .book-nav {
      flex-shrink: 0; background: #2C1808; border-top: 1px solid #4A2E0A;
      display: flex; align-items: stretch; height: 62px;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .book-nav-btn { flex: 0 0 72px; border: none; background: none; color: #D4A96A; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color .15s; }
    .book-nav-btn:disabled { color: #3A1A08; cursor: default; }
    .book-nav-btn:not(:disabled):active { color: #FDF8EE; }
    .book-nav-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
    .book-nav-pg { font-family: Georgia,serif; font-size: 13px; font-weight: 700; color: #D4A96A; }
    .book-nav-name { font-family: Georgia,serif; font-size: 10px; color: #7A5A3A; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }


    /* ── Builder overlay ── */
    #builderView {
      position: fixed; inset: 0; z-index: 400;
      background: #FDF8EE;
      display: flex; flex-direction: column; overflow: hidden;
    }
    #builderView.hidden { display: none; }

    .bld-header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px 10px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: #2C1808; flex-shrink: 0;
    }
    .bld-cancel-btn { background: none; border: none; color: #D4A96A; font-family: Georgia,serif; font-size: 14px; font-weight: 600; cursor: pointer; padding: 6px 4px; min-width: 80px; }
    .bld-header-title { flex: 1; font-family: Georgia,serif; font-size: 13px; font-weight: 700; color: #E8D0A0; text-align: center; letter-spacing: .1em; text-transform: uppercase; }
    .bld-save-btn { background: #8B5C14; border: none; color: #FDF8EE; font-family: Georgia,serif; font-size: 14px; font-weight: 700; cursor: pointer; padding: 7px 14px; border-radius: 20px; min-width: 80px; }

    .bld-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 0 env(safe-area-inset-bottom); }
    .bld-section { padding: 18px 20px 0; border-bottom: 1px solid #EDD9C0; }
    .bld-section:last-child { border-bottom: none; padding-bottom: 40px; }
    .bld-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .bld-section-title { font-family: Georgia,serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #8B5C14; }
    .bld-add-btn { background: none; border: 1.5px solid #C4A46A; color: #8B5C14; font-family: Georgia,serif; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 20px; cursor: pointer; }

    .bld-top-row { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; }
    .bld-emoji-in { width: 52px; height: 52px; border: 1.5px solid #C4A46A; border-radius: 12px; background: #F5EDD8; color: #4A2E0A; font-size: 24px; text-align: center; font-family: Georgia,serif; outline: none; flex-shrink: 0; padding: 0; }
    .bld-name-in { flex: 1; height: 52px; border: 1.5px solid #C4A46A; border-radius: 12px; background: #F5EDD8; color: #4A2E0A; font-size: 17px; font-family: Georgia,serif; padding: 0 14px; outline: none; }
    .bld-name-in::placeholder, .bld-emoji-in::placeholder { color: #A8875A; }
    .bld-name-in:focus, .bld-emoji-in:focus { border-color: #8B5C14; }

    .bld-cat-row { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; }
    .bld-cat-sel { flex: 1; height: 44px; border: 1.5px solid #C4A46A; border-radius: 10px; background: #F5EDD8; color: #4A2E0A; font-size: 15px; font-family: Georgia,serif; padding: 0 10px; outline: none; appearance: none; -webkit-appearance: none; }
    .bld-srv-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .bld-srv-in { width: 52px; height: 44px; border: 1.5px solid #C4A46A; border-radius: 10px; background: #F5EDD8; color: #4A2E0A; font-size: 16px; font-family: Georgia,serif; text-align: center; outline: none; }
    .bld-srv-label { font-family: Georgia,serif; font-size: 13px; color: #8B6A3A; }

    .bld-desc-in { width: 100%; border: 1.5px solid #C4A46A; border-radius: 10px; background: #F5EDD8; color: #4A2E0A; font-size: 14px; font-family: Georgia,serif; padding: 10px 14px; outline: none; resize: none; margin-bottom: 18px; line-height: 1.5; }
    .bld-desc-in::placeholder { color: #A8875A; }
    .bld-desc-in:focus { border-color: #8B5C14; }

    /* Photo section in builder */
    .bld-photo-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .bld-photo-thumb { position: relative; display: inline-block; }
    .bld-photo-thumb img { width: 80px; height: 64px; object-fit: cover; border-radius: 8px; display: block; }
    .bld-photo-del { position: absolute; top: -7px; right: -7px; background: #8B2020; color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 14px; cursor: pointer; padding: 0; line-height: 1; display: flex; align-items: center; justify-content: center; }
    .bld-upload-btn { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px dashed #C4A46A; background: #F5EDD8; color: #8B6A3A; font-size: 14px; font-weight: 600; cursor: pointer; font-family: Georgia,serif; margin-bottom: 18px; }
    .bld-upload-btn:active { background: #EDD9B0; }

    /* Ingredient rows */
    .bld-ing-row { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
    .bld-ing-emoji { width: 40px; height: 40px; border: 1px solid #C4A46A; border-radius: 8px; background: #F5EDD8; text-align: center; font-size: 18px; color: #4A2E0A; font-family: Georgia,serif; outline: none; flex-shrink: 0; padding: 0; }
    .bld-ing-name-wrap { flex: 1; position: relative; min-width: 0; }
    .bld-ing-name { width: 100%; height: 40px; border: 1px solid #C4A46A; border-radius: 8px; background: #F5EDD8; color: #4A2E0A; font-size: 14px; font-family: Georgia,serif; padding: 0 10px; outline: none; }
    .bld-ing-ac { position: absolute; top: 100%; left: 0; right: 0; background: #FDF8EE; border: 1.5px solid #C4A46A; border-top: none; border-radius: 0 0 10px 10px; z-index: 50; max-height: 220px; overflow-y: auto; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    .bld-ing-ac-item { display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-family: Georgia,serif; font-size: 14px; color: #4A2E0A; cursor: pointer; border-bottom: 1px solid #EDD9C0; }
    .bld-ing-ac-item:last-child { border-bottom: none; }
    .bld-ing-ac-item:active { background: #EDD9B0; }
    .bld-ing-qty { width: 54px; height: 40px; border: 1px solid #C4A46A; border-radius: 8px; background: #F5EDD8; color: #4A2E0A; font-size: 14px; font-family: Georgia,serif; text-align: center; outline: none; flex-shrink: 0; }
    .bld-ing-unit { width: 52px; height: 40px; border: 1px solid #C4A46A; border-radius: 8px; background: #F5EDD8; color: #4A2E0A; font-size: 13px; font-family: Georgia,serif; text-align: center; outline: none; flex-shrink: 0; padding: 0 4px; }
    .bld-ing-del { width: 32px; height: 32px; border: none; background: none; color: #B08060; font-size: 20px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .bld-ing-row input::placeholder { color: #A8875A; }
    .bld-ing-row input:focus { border-color: #8B5C14; }
    .bld-ing-hint { font-family: Georgia,serif; font-size: 11px; color: #A8875A; margin-bottom: 12px; }
    #bldIngList { padding-bottom: 6px; }

    /* Step rows */
    .bld-step-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
    .bld-step-num { width: 26px; height: 26px; background: #EDD9B0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: Georgia,serif; font-size: 12px; font-weight: 700; color: #8B5C14; flex-shrink: 0; margin-top: 7px; }
    .bld-step-body { flex: 1; min-width: 0; }
    .bld-step-ta { width: 100%; border: 1px solid #C4A46A; border-radius: 8px; background: #F5EDD8; color: #4A2E0A; font-size: 14px; font-family: Georgia,serif; padding: 8px 10px; outline: none; resize: none; line-height: 1.5; min-height: 40px; }
    .bld-step-ta::placeholder { color: #A8875A; }
    .bld-step-ta:focus { border-color: #8B5C14; }
    .bld-step-del { width: 32px; height: 32px; border: none; background: none; color: #B08060; font-size: 20px; cursor: pointer; flex-shrink: 0; margin-top: 4px; }
    #bldStepList { padding-bottom: 6px; }
    .bld-tm5-label-row { margin-top: 8px; font-family: Georgia,serif; font-size: 12px; font-weight: 700; color: #8B5C14; text-transform: uppercase; letter-spacing: .06em; }
    .bld-tm5-fields { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .bld-tm5-field { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .bld-tm5-in { width: 70px; height: 36px; border: 1px solid #C4A46A; border-radius: 8px; background: #F5EDD8; color: #4A2E0A; font-size: 14px; font-family: Georgia,serif; text-align: center; padding: 0 6px; outline: none; }
    .bld-tm5-in:focus { border-color: #8B5C14; }
    .bld-tm5-lbl { font-family: Georgia,serif; font-size: 10px; color: #8B6A3A; text-transform: uppercase; letter-spacing: .06em; }

    /* Thermomix chips in recipe view */
    .brp-step-tm5 { margin-top: 8px; }
    .brp-step-tm5-title { font-family: Georgia,serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #8B5C14; margin-bottom: 5px; }
    .brp-step-tm5-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .brp-step-tm5-chip { background: #EDD9B0; border-radius: 20px; padding: 3px 10px; font-family: Georgia,serif; font-size: 12px; color: #5C3317; font-weight: 600; }

    .bld-empty-hint { font-family: Georgia,serif; font-size: 13px; color: #A8875A; font-style: italic; padding: 4px 0 14px; }

    /* ── Toast ── */
    #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #2C1808; color: #E8D0A0; font-family: Georgia,serif; font-size: 14px; padding: 10px 20px; border-radius: 20px; z-index: 500; opacity: 0; pointer-events: none; transition: opacity .25s; white-space: nowrap; display: flex; align-items: center; gap: 10px; }
    #toast.show { opacity: 1; pointer-events: auto; }
    #toast a.toast-action { color: #F5C97A; font-weight: bold; text-decoration: none; border-left: 1px solid #6B4226; padding-left: 10px; white-space: nowrap; }

    /* ── Step timer button ── */
    .step-time-btn {
      display: inline-flex; align-items: center; gap: 3px;
      background: #EDD9B0; border: 1px solid #C4A46A; border-radius: 10px;
      padding: 1px 7px; font-family: Georgia,serif; font-size: 12.5px;
      color: #5C3317; cursor: pointer; margin: 1px 0; vertical-align: middle; line-height: 1.6;
    }
    .step-time-btn:active { background: #D4B896; }
    .brp-step-tm5-chip.tm5-time-btn { cursor: pointer; border: none; }
    .brp-step-tm5-chip.tm5-time-btn:active { background: #D4B896; }

    /* Ensure [hidden] attribute always wins over display:flex/grid rules */
    [hidden] { display: none !important; }

    /* ── Tagebuch sheet ── */
    #tagebuchSheet {
      position: fixed; inset: 0; z-index: 900;
      background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .tbsh-card {
      width: 100%; max-width: 480px;
      background: #FDF8EE; border-radius: 24px 24px 0 0;
      padding: 22px 20px 32px;
      padding-bottom: max(32px, env(safe-area-inset-bottom));
    }
    .tbsh-handle {
      width: 40px; height: 4px; border-radius: 2px;
      background: #C4A46A; margin: 0 auto 18px;
    }
    .tbsh-title {
      font-family: Georgia,serif; font-size: 17px; font-weight: 700;
      color: #4A2E0A; text-align: center; margin-bottom: 4px;
    }
    .tbsh-sub {
      font-family: Georgia,serif; font-size: 13px; color: #8B6A3A;
      text-align: center; margin-bottom: 18px;
    }
    .tbsh-pct-row {
      display: flex; gap: 8px; margin-bottom: 14px;
    }
    .tbsh-pct-btn {
      flex: 1; padding: 11px 4px; border-radius: 12px;
      border: 1.5px solid #D4B896; background: #F5EDD8;
      color: #4A2E0A; font-family: Georgia,serif; font-size: 15px;
      font-weight: 700; cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    .tbsh-pct-btn.active {
      background: #8B5C14; border-color: #8B5C14; color: #FDF8EE;
    }
    .tbsh-pct-btn:active { opacity: .75; }
    .tbsh-custom-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
    }
    .tbsh-custom-label {
      font-family: Georgia,serif; font-size: 13px; color: #8B6A3A; white-space: nowrap;
    }
    .tbsh-custom-in {
      flex: 1; padding: 10px 14px; border-radius: 12px;
      border: 1.5px solid #D4B896; background: #F5EDD8;
      color: #4A2E0A; font-family: Georgia,serif; font-size: 15px; outline: none;
    }
    .tbsh-custom-in:focus { border-color: #8B5C14; }
    .tbsh-kcal-preview {
      text-align: center; font-family: Georgia,serif; font-size: 14px;
      color: #8B6A3A; margin-bottom: 14px; min-height: 20px;
    }
    .tbsh-kcal-preview strong { color: #4A2E0A; }
    .tbsh-confirm {
      width: 100%; padding: 14px; border-radius: 14px;
      background: #6B3F0E; border: none; color: #FDF8EE;
      font-family: Georgia,serif; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .tbsh-confirm:active { background: #4A2E0A; }
    .tbsh-close {
      position: absolute; top: 14px; right: 16px;
      background: none; border: none; color: #A8875A;
      font-size: 22px; cursor: pointer; padding: 4px 6px; line-height: 1;
    }

    /* ── Timer overlay ── */
    #timerOverlay {
      position: fixed; inset: 0; z-index: 800;
      background: rgba(0,0,0,.72); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
    }
    .timer-card {
      background: #FDF8EE; border-radius: 24px;
      padding: 32px 32px 28px;
      width: min(280px,88vw);
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    .timer-ring-wrap { position: relative; width: 164px; height: 164px; flex-shrink: 0; }
    .timer-ring { width: 100%; height: 100%; transform: rotate(-90deg); }
    .timer-ring-bg { fill: none; stroke: #E8D5B0; stroke-width: 6; }
    .timer-ring-fg { fill: none; stroke: #8B5C14; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .9s linear; }
    .timer-ring-fg.done { stroke: #2D6A4F; }
    .timer-display {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: Georgia,serif; font-size: 44px; font-weight: 700;
      color: #2C1808; letter-spacing: 2px; font-variant-numeric: tabular-nums;
    }
    .timer-display.done { color: #2D6A4F; font-size: 30px; }
    .timer-btns { display: flex; gap: 10px; justify-content: center; }
    .timer-btn { border: none; border-radius: 50%; width: 52px; height: 52px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
    .timer-btn-pause { background: #EDD9B0; color: #5C3317; }
    .timer-btn-close { background: #F5EDD8; color: #8B6A3A; }
    .timer-btn:active { opacity: .7; }
    #timerOverlay.timer-flash { animation: timerFlash .5s ease; }
    @keyframes timerFlash { 0%,100%{background:rgba(0,0,0,.72)} 50%{background:rgba(45,106,79,.55)} }

    /* ── Recently viewed (cover) ── */
    .bc-recent-label { font-family: Georgia,serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #A8875A; padding-bottom: 8px; }
    .bc-recent-row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid #E8D5B0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .bc-recent-row:last-of-type { border-bottom: none; }
    .bc-recent-row:active { background: #F5EDD8; margin: 0 -4px; padding: 9px 8px; }
    .bc-recent-emoji { font-size: 18px; flex-shrink: 0; width: 24px; text-align: center; }
    .bc-recent-name { font-family: Georgia,serif; font-size: 14px; color: #4A2E0A; flex: 1; }
    .bc-recent-arrow { color: #C4A46A; font-size: 18px; }

    /* ── Empty state ── */
    .empty-state { padding: 80px 32px; text-align: center; font-family: Georgia,serif; }
    .empty-ornament { font-size: 48px; margin-bottom: 20px; }
    .empty-title { font-size: 22px; font-weight: 700; color: #4A2E0A; margin-bottom: 12px; }
    .empty-text { font-size: 15px; color: #8B6A3A; line-height: 1.6; font-style: italic; }

    /* ── List filter / sort toolbar ── */
    .blv-toolbar { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; }
    .blv-cats-scroll {
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
      -webkit-overflow-scrolling: touch; flex: 1;
    }
    .blv-cats-scroll::-webkit-scrollbar { display: none; }
    .blv-cat-chip {
      flex-shrink: 0; border: 1.5px solid #C4A46A; background: #F5EDD8;
      color: #8B6A3A; font-family: Georgia,serif; font-size: 12px; font-weight: 600;
      padding: 6px 12px; border-radius: 20px; cursor: pointer; white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .blv-cat-chip.active { background: #8B5C14; color: #FDF8EE; border-color: #8B5C14; }
    .blv-sort-btn {
      flex-shrink: 0; border: 1.5px solid #C4A46A; background: #F5EDD8;
      color: #8B6A3A; font-family: Georgia,serif; font-size: 12px; font-weight: 700;
      padding: 6px 12px; border-radius: 20px; cursor: pointer; white-space: nowrap;
    }
    .blv-sort-btn.sorted { background: #EDD9B0; border-color: #8B5C14; color: #8B5C14; }
    .blv-count { font-family: Georgia,serif; font-size: 11px; color: #A8875A; padding: 2px 0 10px; }

    /* ── Share / PDF export ── */
    .book-share-btn { background: none; border: none; color: #D4A96A; font-size: 20px; cursor: pointer; padding: 6px 4px; line-height: 1; }
    .blv-row.sm-row { cursor: default; -webkit-tap-highlight-color: transparent; }
    .blv-row.sm-row.sm-sel { background: #F5EDD8; }
    .blv-check { width: 22px; height: 22px; flex-shrink: 0; accent-color: #8B5C14; cursor: pointer; margin-right: 2px; }
    #shareBar {
      position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%);
      background: #8B5C14; color: #FDF8EE;
      border: none; border-radius: 24px; padding: 13px 28px;
      font-family: Georgia,serif; font-size: 15px; font-weight: 700;
      cursor: pointer; box-shadow: 0 4px 18px rgba(44,24,8,.4);
      z-index: 150; white-space: nowrap; display: none;
    }
    #shareBar:disabled { opacity: .45; cursor: default; }
    #shareBar:not(:disabled):active { background: #6B4210; }

    /* ── Cook mode overlay ── */
    #cookView {
      position: fixed; inset: 0; z-index: 600;
      background: #100803;
      display: flex; flex-direction: column; overflow: hidden;
    }
    #cookView.hidden { display: none; }

    .ck-header {
      display: flex; align-items: center;
      padding: 10px 14px 10px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: #2C1808; flex-shrink: 0;
      border-bottom: 1px solid #3A2010;
    }
    .ck-close-btn {
      background: none; border: none; color: #C4A46A;
      font-size: 14px; font-weight: 600; font-family: Georgia,serif;
      cursor: pointer; padding: 6px 4px; min-width: 70px;
      -webkit-tap-highlight-color: transparent;
    }
    .ck-header-center { flex: 1; text-align: center; padding: 0 6px; min-width: 0; }
    .ck-header-name {
      font-family: Georgia,serif; font-size: 12px; font-weight: 700;
      color: #E8D0A0; text-transform: uppercase; letter-spacing: .1em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ck-stopwatch {
      font-family: Georgia,serif; font-size: 12px; color: #4A2E10;
      font-variant-numeric: tabular-nums; margin-top: 2px; letter-spacing: .05em;
      transition: color .4s;
    }
    .ck-stopwatch.running { color: #A87840; }

    .ck-progress-row {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      padding: 12px 20px 2px; flex-shrink: 0; min-height: 30px;
    }
    .ck-progress-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #221008; border: 1.5px solid #3A2010;
      transition: background .3s, transform .3s, border-color .3s;
      flex-shrink: 0;
    }
    .ck-progress-dot.done { background: #3D6A50; border-color: #3D6A50; }
    .ck-progress-dot.current { background: #D4A96A; border-color: #D4A96A; transform: scale(1.55); }

    .ck-body { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    .ck-body-inner {
      padding: 20px 18px 36px; max-width: 480px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 14px;
    }

    .ck-step-label {
      font-family: Georgia,serif; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .12em; color: #5A3A1A;
    }
    .ck-step-card {
      background: #1C0E06; border: 1px solid #2A1808; border-radius: 20px;
      padding: 24px 20px;
    }
    .ck-step-text {
      font-family: Georgia,serif; font-size: 19px; color: #F0E4CC;
      line-height: 1.8;
    }
    /* Hide inline timer buttons inside cook mode — the countdown handles timing */
    #cookView .step-time-btn {
      background: none; border: none; color: #8B6A3A; font-family: Georgia,serif;
      font-size: 19px; cursor: default; padding: 0; text-decoration: underline dotted #3A2010;
    }

    .ck-step-timer-wrap {
      background: #0C0500; border: 1px solid #241206; border-radius: 20px;
      padding: 20px 20px 22px; text-align: center;
    }
    .ck-step-timer-label {
      font-family: Georgia,serif; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .14em; color: #4A2E10;
      margin-bottom: 10px;
    }
    .ck-countdown-display {
      font-family: Georgia,serif; font-size: 62px; font-weight: 700;
      color: #C4A46A; font-variant-numeric: tabular-nums;
      margin-bottom: 18px; letter-spacing: 4px; line-height: 1.05;
      transition: color .3s;
    }
    .ck-countdown-display.running { color: #E8D0A0; }
    .ck-countdown-display.done { color: #3D6A50; font-size: 30px; letter-spacing: 0; margin-bottom: 10px; }
    .ck-countdown-btns { display: flex; gap: 10px; justify-content: center; }
    .ck-cd-btn {
      border: none; border-radius: 28px; padding: 13px 28px;
      font-family: Georgia,serif; font-size: 15px; font-weight: 700;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .ck-cd-btn:active { opacity: .75; }
    .ck-cd-start { background: #8B5C14; color: #FDF8EE; }
    .ck-cd-reset { background: #1C0E06; color: #6A4A28; border: 1.5px solid #2A1808; }

    .ck-ings-wrap {
      background: #0C0500; border: 1px solid #1E0E04; border-radius: 20px;
      padding: 16px 18px 18px;
    }
    .ck-ings-label {
      font-family: Georgia,serif; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .14em; color: #4A2E10;
      margin-bottom: 12px;
    }
    .ck-ings-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .ck-ing-chip {
      display: flex; align-items: center; gap: 6px;
      background: #1C0E06; border: 1px solid #2A1808; border-radius: 22px;
      padding: 8px 14px; font-family: Georgia,serif; font-size: 14px; color: #C4A46A;
    }
    .ck-ing-chip-amt { color: #5A3A1A; font-size: 13px; margin-left: 2px; }

    .ck-nav-row {
      background: #100803; padding: 12px 18px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex; gap: 10px; flex-shrink: 0; border-top: 1px solid #1E1008;
    }
    .ck-nav-back {
      flex: 0 0 auto; padding: 15px 18px;
      border: 1.5px solid #2A1808; background: none; color: #5A3A1A;
      font-family: Georgia,serif; font-size: 15px; font-weight: 600;
      border-radius: 14px; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .ck-nav-back:not(:disabled):active { color: #C4A46A; border-color: #5A3A1A; }
    .ck-nav-back:disabled { opacity: .25; cursor: default; }
    .ck-nav-done {
      flex: 1; padding: 15px;
      background: #7A4E10; border: none; color: #FDF8EE;
      font-family: Georgia,serif; font-size: 16px; font-weight: 700;
      border-radius: 14px; cursor: pointer; transition: background .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .ck-nav-done.last-step { background: #2D6A4F; }
    .ck-nav-done:active { opacity: .85; }

    /* Summary */
    .ck-summary-wrap { padding: 40px 20px 40px; max-width: 440px; margin: 0 auto; text-align: center; }
    .ck-summary-trophy { font-size: 64px; margin-bottom: 16px; line-height: 1; }
    .ck-summary-title { font-family: Georgia,serif; font-size: 28px; font-weight: 700; color: #E8D0A0; margin-bottom: 6px; }
    .ck-summary-subtitle { font-family: Georgia,serif; font-size: 15px; color: #5A3A1A; margin-bottom: 28px; font-style: italic; }
    .ck-summary-time-box { background: #1C0E06; border: 1px solid #2A1808; border-radius: 18px; padding: 24px; margin-bottom: 16px; }
    .ck-summary-time-val { font-family: Georgia,serif; font-size: 48px; font-weight: 700; color: #D4A96A; font-variant-numeric: tabular-nums; letter-spacing: 2px; }
    .ck-summary-time-lbl { font-family: Georgia,serif; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: #5A3A1A; margin-top: 6px; }
    .ck-summary-avg { font-family: Georgia,serif; font-size: 13px; color: #5A3A1A; font-style: italic; margin-bottom: 32px; }
    .ck-summary-save-btn {
      width: 100%; padding: 16px; background: #8B5C14; border: none; color: #FDF8EE;
      font-family: Georgia,serif; font-size: 16px; font-weight: 700; border-radius: 14px;
      cursor: pointer; margin-bottom: 10px; -webkit-tap-highlight-color: transparent;
    }
    .ck-summary-save-btn:disabled { opacity: .5; cursor: default; }
    .ck-summary-save-btn:not(:disabled):active { opacity: .85; }
    .ck-summary-close-btn {
      width: 100%; padding: 14px; background: none; border: 1.5px solid #2A1808; color: #5A3A1A;
      font-family: Georgia,serif; font-size: 14px; font-weight: 600; border-radius: 14px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .ck-summary-close-btn:active { color: #C4A46A; border-color: #5A3A1A; }

    /* Avg time badge on recipe page */
    .brp-cook-avg { text-align: center; font-family: Georgia,serif; font-size: 12px; color: #8B5C14; padding: 0 0 14px; font-weight: 600; }

    /* Kochen button */
    .brp-cook-btn {
      width: 100%; padding: 13px;
      background: #2C1808; border: 1.5px solid #3A2010; color: #D4A96A;
      font-family: Georgia,serif; font-size: 16px; font-weight: 700;
      border-radius: 10px; cursor: pointer; letter-spacing: .02em;
    }
    .brp-cook-btn:active { background: #1A0C04; }
  </style>
</head>
<body>
<div id="app">
  <div class="book-header">
    <button class="book-back" id="bookBackBtn" onclick="bookBackAction()">← Zurück</button>
    <div class="book-header-title">Rezeptbuch</div>
    <div class="book-header-right">
      <button class="book-bookmark-btn" id="bookBookmarkBtn" onclick="toggleBookmark()" title="Lesezeichen"></button>
      <button class="book-share-btn" id="bookShareBtn" onclick="toggleShareMode()" title="Rezepte teilen">📤</button>
      <button class="book-add-btn" id="bookAddBtn" onclick="openBuilder(null)" title="Rezept hinzufügen">+</button>
      <button class="book-view-toggle" id="bookViewToggle" onclick="toggleBookView()" title="Ansicht wechseln">☰</button>
    </div>
  </div>
  <div class="book-pages" id="bookPages">
    <div id="bookListView"></div>
  </div>
  <div class="book-nav">
    <button class="book-nav-btn" id="bookPrevBtn" onclick="bookFlip(-1)">‹</button>
    <div class="book-nav-center" onclick="bookGoToIndex()">
      <div class="book-nav-pg" id="bookNavPg">Inhalt</div>
      <div class="book-nav-name" id="bookNavName"></div>
    </div>
    <button class="book-nav-btn" id="bookNextBtn" onclick="bookFlip(1)">›</button>
  </div>
</div>

<div id="ptrHint">↓ Loslassen zum Aktualisieren</div>

<!-- Builder overlay -->
<div id="builderView" class="hidden">
  <div class="bld-header">
    <button class="bld-cancel-btn" onclick="closeBuilder()">← Abbrechen</button>
    <div class="bld-header-title" id="bldTitle">Neues Rezept</div>
    <button class="bld-save-btn" onclick="saveRecipe()">✓ Speichern</button>
  </div>
  <div class="bld-body" id="builderBody">
    <div class="bld-section">
      <div class="bld-top-row">
        <input class="bld-emoji-in" id="bldEmoji" type="text" placeholder="🍽️" maxlength="4" autocomplete="off">
        <input class="bld-name-in" id="bldName" type="text" placeholder="Rezeptname *" autocomplete="off">
      </div>
      <div class="bld-cat-row">
        <select class="bld-cat-sel" id="bldCategory"></select>
        <div class="bld-srv-wrap">
          <input class="bld-srv-in" id="bldServings" type="number" min="1" max="99" value="4">
          <span class="bld-srv-label">Port.</span>
        </div>
      </div>
    </div>
    <div class="bld-section">
      <div class="bld-section-head"><div class="bld-section-title">Beschreibung</div></div>
      <textarea class="bld-desc-in" id="bldDesc" placeholder="Kurze Beschreibung (optional) …" rows="3"></textarea>
    </div>
    <div class="bld-section">

<script>
'use strict';

const RECIPE_STORE = 'rezepte_v2';
const RECENT_STORE = 'rezeptbuch_recent';
const RECIPE_CATEGORIES = ['Hauptgericht','Beilage','Nudelgericht','Suppe','Auflauf','Snack','Dessert','Aufstrich','Frühstück','Salat','Sonstiges'];

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

const _NUM = '([\\d.,]+)';
function _n(s) { return parseFloat((s||'0').replace(',','.')); }
function parseGrams(s) {
  if (!s) return null;
  const m = s.trim().match(new RegExp('^'+_NUM+'\\s*(g|kg)$','i'));
  if (!m) return null;
  return m[2].toLowerCase()==='kg' ? _n(m[1])*1000 : _n(m[1]);
}
function parseLiters(s) {
  if (!s) return null;
  const m = s.trim().match(new RegExp('^'+_NUM+'\\s*(ml|cl|dl|[Ll])$','i'));
  if (!m) return null;
  const v=_n(m[1]),u=m[2].toLowerCase();
  if(u==='ml') return v/1000; if(u==='cl') return v/100; if(u==='dl') return v/10; return v;
}
function parsePieces(s) {
  if (!s) return null;
  const m = s.trim().match(new RegExp('^'+_NUM+'\\s*(st\\.?|stk\\.?|stück)$','i'));
  if (!m) return null;
  return _n(m[1]);
}

function cookFmtAmt(ing, scale) {
  const unitStr = (ing.unit||'').trim();
  const isG = parseGrams(unitStr)!==null, isL = parseLiters(unitStr)!==null;
  if (isG||isL) {
    const scaledG = Math.round((ing.amountG||0)*scale);
    if (isL) {
      if (scaledG>=1000) return `${parseFloat((scaledG/1000).toFixed(scaledG%100===0?1:2))} L`;
      if (scaledG>=100)  return `${parseFloat((scaledG/100).toFixed(1))} dl`;
      return `${scaledG} ml`;
    }
    if (scaledG>=1000) return `${parseFloat((scaledG/1000).toFixed(scaledG%100===0?1:2))} kg`;
    return `${scaledG} g`;
  }
  if (parsePieces(unitStr)!==null) {
    const raw=(ing.qty||1)*scale;
    return `${raw===Math.floor(raw)?raw:parseFloat(raw.toFixed(1))} Stück`;
  }
  const raw=(ing.qty||1)*scale, q=raw===Math.floor(raw)?raw:parseFloat(raw.toFixed(1));
  return unitStr ? `${q} ${unitStr}` : `${q}`;
}

// ── IndexedDB image store (shared with einkaufsliste) ──
const IMG_DB_NAME = 'kt_recipe_imgs', IMG_STORE_NM = 'images';
let _imgDB = null;
let recipeImageCache = {};

function _openImgDB() {
  if (_imgDB) return Promise.resolve(_imgDB);
  return new Promise((res,rej) => {
    const req = indexedDB.open(IMG_DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IMG_STORE_NM)) {
        const s = db.createObjectStore(IMG_STORE_NM, {keyPath:'id', autoIncrement:true});
        s.createIndex('recipeId','recipeId',{unique:false});
      }
    };
    req.onsuccess = e => { _imgDB=e.target.result; res(_imgDB); };
    req.onerror   = e => rej(e.target.error);
  });
}

async function loadAllRecipeImages() {
  const db = await _openImgDB();
  return new Promise(res => {
    const tx  = db.transaction(IMG_STORE_NM,'readonly');
    const req = tx.objectStore(IMG_STORE_NM).getAll();
    req.onsuccess = () => {
      recipeImageCache = {};
      (req.result||[]).forEach(row => {
        if (!recipeImageCache[row.recipeId]) recipeImageCache[row.recipeId]=[];
        recipeImageCache[row.recipeId].push({id:row.id, dataUrl:row.dataUrl});
      });
      res();
    };
    req.onerror = () => res();
  });
}

async function addRecipeImage(recipeId, dataUrl) {
  const db = await _openImgDB();
  return new Promise(res => {
    const tx  = db.transaction(IMG_STORE_NM,'readwrite');
    const req = tx.objectStore(IMG_STORE_NM).add({recipeId, dataUrl});
    req.onsuccess = () => {
      if (!recipeImageCache[recipeId]) recipeImageCache[recipeId]=[];
      recipeImageCache[recipeId].push({id:req.result, dataUrl});
      res(req.result);
    };
    req.onerror = () => res(null);
  });
}

async function deleteRecipeImage(imgId, recipeId) {
  const db = await _openImgDB();
  return new Promise(res => {
    const tx = db.transaction(IMG_STORE_NM,'readwrite');
    tx.objectStore(IMG_STORE_NM).delete(imgId);
    tx.oncomplete = () => {
      if (recipeImageCache[recipeId])
        recipeImageCache[recipeId]=recipeImageCache[recipeId].filter(i=>i.id!==imgId);
      res();
    };
    tx.onerror = () => res();
  });
}

async function deleteAllImagesForRecipe(recipeId) {
  const imgs = recipeImageCache[recipeId]||[];
  if (!imgs.length) return;
  const db = await _openImgDB();
  return new Promise(res => {
    const tx=db.transaction(IMG_STORE_NM,'readwrite'), store=tx.objectStore(IMG_STORE_NM);
    imgs.forEach(i=>store.delete(i.id));
    tx.oncomplete = () => { delete recipeImageCache[recipeId]; res(); };
    tx.onerror = () => res();
  });
}

function compressImage(file, maxPx=1400, quality=0.8) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w=img.width, h=img.height;
        if (w>maxPx||h>maxPx) {
          if (w>h) { h=Math.round(h*maxPx/w); w=maxPx; }
          else     { w=Math.round(w*maxPx/h); h=maxPx; }
        }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

  if(ul==='g'){unit=qty+' g';amountG=qty;}
  else if(ul==='kg'){unit=qty+' kg';amountG=qty*1000;}
  else if(ul==='ml'){unit=qty+' ml';amountG=qty;}
  else if(ul==='cl'){unit=qty+' cl';amountG=qty*10;}
  else if(ul==='dl'){unit=qty+' dl';amountG=qty*100;}
  else if(ul==='l'){unit=qty+' L';amountG=qty*1000;}
  else if(ul==='stück'||ul==='stk'){unit=qty+' Stück';}
  return{name,emoji:emoji||'',unit,amountG,qty:qty||0,custom:false,
    kcalPer100:0,proteinPer100:0,carbsPer100:0,fatPer100:0,unitPrice:0,unitG:0};
}

       steps:['Zwiebel oder Schalotte schälen und fein würfeln. Kohlrabis schälen, waschen und in Würfel oder Stifte schneiden. Zwei bis drei der ganz kleinen feinen Kohlrabiblättchen waschen, klein hacken und zur Seite stellen.','Die Zwiebel in 1 EL Butter glasig anschwitzen, ganz leicht Farbe annehmen lassen. Von der Platte nehmen und die Kohlrabiwürfel zugeben. Etwas Salz, Pfeffer, Muskat, etwa 100 ml Wasser und 100 ml Sahne zugeben. Wieder auf die Herdplatte stellen und aufkochen lassen. Dann bei kleiner bis mittlerer Hitze im geschlossenen Topf ca. 15 bis 20 Min. kochen.','Kurz vor Ende der Garzeit die zarten Kohlrabiblättchen zugeben. Evtl. die Soße etwas abbinden mit 1 TL Mehl in wenig Wasser aufgelöst.']},
      {id:'ck_fladenbrot_elsaesser',name:'Fladenbrot Elsässer Art',emoji:'🫓',category:'Snack',servings:4,description:'',
       ingredients:[_ing('Fladenbrot, türkisch','🫓',1,'Stück'),_ing('Schmand (ca. 200 ml)','🥛',1,'Becher'),_ing('Zwiebel, groß','🧅',1,'Stück'),_ing('Bauchspeck, geräuchert','🥓',150,'g'),_ing('Salz und Pfeffer','🧂',0,''),_ing('Käse, gerieben (optional)','🧀',0,'')],
       steps:['Den Backofen auf 180 °C Ober-/Unterhitze vorheizen.','Das Fladenbrot halbieren und die Hälften gleichmäßig mit dem Schmand bestreichen. Die Zwiebel halbieren und in dünne Halbringe schneiden. Den Bauchspeck in dünne Scheiben schneiden.','Die Brothälften mit Zwiebel und Speck belegen und mit Pfeffer und Salz würzen. Nach Belieben noch etwas geriebenen Käse darübergeben.','Das Fladenbrot im vorgeheizten Backofen ca. 10 Minuten überbacken.']},
      {id:'ck_fladenbrotpizza_serrano',name:'Fladenbrotpizza mit Serranoschinken',emoji:'🍕',category:'Hauptgericht',servings:2,description:'',
       ingredients:[_ing('Knoblauchzehe, gepresst','🧄',1,'Zehe'),_ing('Oregano, getrocknet','🌿',1.5,'TL'),_ing('Olivenöl','🫙',5,'EL'),_ing('Tomaten','🍅',400,'g'),_ing('Mozzarella (125 g)','🧀',1,'Kugel'),_ing('Fladenbrot, klein rund','🫓',1,'Stück'),_ing('Rucola (40 g)','🥬',1,'Bund'),_ing('Hartkäse, italienisch','🧀',50,'g'),_ing('Serranoschinken','🥩',6,'Scheibe'),_ing('Salz und Pfeffer','🧂',0,'')],
       steps:['1 durchgepresste Knoblauchzehe mit 1½ TL getrocknetem Oregano und 5 EL Olivenöl verrühren. Von 400 g Tomaten den Stielansatz entfernen und in Scheiben schneiden. 1 Kugel Mozzarella halbieren und in dünne Scheiben schneiden.','1 kleines rundes Fladenbrot waagerecht halbieren. Die Hälften mit der Schnittfläche nach oben auf ein mit Backpapier ausgelegtes Blech legen.','Die Brote mit der Hälfte des Würzöls beträufeln. Mit Tomatenscheiben und Mozzarella belegen und mit dem restlichen Öl beträufeln. Im heißen Ofen bei 220 °C Ober-/Unterhitze (Umluft: 200 °C) in der Ofenmitte 10–15 Min. backen.','Inzwischen Rucola putzen, waschen und trocken schleudern. 50 g Hartkäse mit dem Sparschäler in feine Scheiben hobeln.','Die Fladenbrotpizza mit Salz und Pfeffer würzen. Mit Rucola, Serranoschinken und Käse bestreut servieren.']},
      {id:'ck_cheeseburger_suppe',name:'Cheeseburger Suppe',emoji:'🍔',category:'Suppe',servings:4,description:'',
       ingredients:[_ing('Rinderhackfleisch','🥩',500,'g'),_ing('Zwiebeln','🧅',2,'Stück'),_ing('Gewürzgurken','🥒',150,'g'),_ing('Knoblauch','🧄',2,'Zehe'),_ing('Fleischtomaten','🍅',2,'Stück'),_ing('Öl','🫙',2,'EL'),_ing('Tomatenmark','🫙',70,'g'),_ing('Zucker','🍬',0.5,'TL'),_ing('Gemüsebrühe','🍜',1,'l'),_ing('Salz','🧂',0.5,'TL'),_ing('Pfeffer','🧂',0.5,'TL'),_ing('Paprikapulver, edelsüßes','🫙',1,'TL'),_ing('Paprikapulver, geräuchertes','🫙',1,'TL'),_ing('Schmelzkäse','🧀',200,'g'),_ing('Cheddarkäse, geriebener','🧀',150,'g'),_ing('Burgerbrötchen mit Sesam','🥐',4,'Stück')],
       steps:['Zwiebeln und Knoblauch schälen, die Zwiebeln fein würfeln und den Knoblauch klein hacken. Gewürzgurken gut abtropfen lassen und in Scheiben schneiden. Tomaten waschen, trocken tupfen, den Strunk herausschneiden und in löffelgerechte Würfel schneiden.','In einem großen Topf das Öl erhitzen. Das Rinderhack anbraten, dann kommen die Zwiebeln und zum Schluss der Knoblauch hinzu, damit der Knoblauch nicht anbrennt. Tomatenmark und Zucker unterrühren, anrösten und mit der Gemüsebrühe ablöschen. Die Gurkenscheiben hinzufügen und die Suppe bei geringer Hitze mit Deckel etwa 10 Minuten leicht köcheln lassen.','Dann den Schmelzkäse sowie etwa zwei Drittel des geriebenen Cheddars in die Suppe geben, unter Rühren schmelzen lassen und einmal aufkochen. Den Herd ausschalten, die Tomatenwürfel einrühren und alles mit Salz, edelsüßem und geräuchertem Paprikapulver sowie frisch gemahlenem Pfeffer abschmecken.','Die Burgerbrötchen in einer Pfanne oder im Ofen kurz rösten, bis sie leicht knusprig sind. Die Suppe auf Schalen verteilen, mit dem restlichen Cheddar bestreuen und mit den Burgerbrötchen servieren.']},
      {id:'ck_lasagnesuppe',name:'Lasagnesuppe',emoji:'🍲',category:'Suppe',servings:6,description:'',
       ingredients:[_ing('Olivenöl','🫙',2,'EL'),_ing('Hackfleisch, gemischtes','🥩',500,'g'),_ing('Zwiebel','🧅',1,'Stück'),_ing('Knoblauch','🧄',3,'Zehe'),_ing('Rinderbrühe','🍜',1,'l'),_ing('Tomaten, stückige (Dose)','🍅',800,'g'),_ing('Tomatenmark','🫙',3,'EL'),_ing('Oregano, getrocknet','🌿',1,'TL'),_ing('Thymian, getrocknet','🌿',1,'TL'),_ing('Lasagneplatten','🍝',250,'g'),_ing('Crème fraîche','🥛',150,'g'),_ing('Salz und Pfeffer','🧂',0,''),_ing('Parmesan (nach Belieben)','🧀',0,'')],
       steps:['1 EL Olivenöl in einem großen Topf bei mittlerer bis hoher Hitze erhitzen. Das Hackfleisch hineinkrümeln, mit Salz und Pfeffer würzen und knusprig braten. Zwiebel würfeln und Knoblauch hacken.','Das restliche Olivenöl in den Topf geben und die Zwiebel darin unter gelegentlichem Rühren circa zwei Minuten glasig anschwitzen. Den Knoblauch hinzugeben und weitere 30 Sekunden dünsten.','Die Lasagneplatten in mundgerechte Stücke brechen. Rinderbrühe, gehackte Tomaten, Tomatenmark, Lasagneplatten, Oregano, Thymian, Salz und Pfeffer hinzufügen und bei kleiner Hitze so lange köcheln lassen, bis die Lasagneplatten gegart sind.','Noch einmal abschmecken und mit einem Klacks Crème fraîche und etwas geriebenem Parmesan servieren.']},
      {id:'ck_kuerbissuppe_aepfel',name:'Cremige Kürbissuppe mit Äpfeln, Karotten und Kartoffeln',emoji:'🎃',category:'Suppe',servings:8,description:'',
       ingredients:[_ing('Hokkaidokürbis','🎃',1000,'g'),_ing('Zwiebeln','🧅',2,'Stück'),_ing('Karotten','🥕',4,'Stück'),_ing('Äpfel','🍎',2,'Stück'),_ing('Öl','🫙',0,''),_ing('Kartoffeln','🥔',4,'Stück'),_ing('Gemüsebrühe','🍜',1.5,'l'),_ing('Sahne (oder Schmand)','🥛',1,'Becher'),_ing('Salz und Pfeffer','🧂',0,''),_ing('Muskat','🌰',0,''),_ing('Petersilie, gehackte','🌿',0,'')],
       steps:['Den Kürbis halbieren, das weiche Innere mitsamt den Kernen entfernen und das Fruchtfleisch in Stücke schneiden. Die Zwiebeln schälen und achteln. Die Karotten schälen und in Stücke schneiden. Die Äpfel entkernen und in Spalten schneiden. Die Kartoffeln schälen und ebenfalls in Stücke schneiden.','Kürbis-, Zwiebel-, Apfel- und Karottenstücke in einem großen Topf mit etwas Öl anbraten. Unter Rühren bei mittlerer Hitze weiterbraten, bis der Kürbis weich, aber noch bissfest ist. Jetzt die Kartoffelstücke zugeben und mit heißer Gemüsebrühe auffüllen. Auf kleiner Flamme so lange kochen, bis alles weich ist (ca. 20 Minuten).','Die Sahne (oder den Schmand) zugeben und alles pürieren (am besten mit dem Pürierstab). Mit Salz, Pfeffer, Muskat und Petersilie abschmecken. Nach Belieben pro Portion noch einige kleine Hackbällchen oder Wiener Würstchen in Scheiben in die Suppe geben und/oder Croûtons dazu servieren.']},
      {id:'ck_kartoffelsuppe_einfach',name:'Einfache Kartoffelsuppe',emoji:'🥔',category:'Suppe',servings:4,description:'',
       ingredients:[_ing('Kartoffeln','🥔',1000,'g'),_ing('Suppengemüse','🥕',1,'Bund'),_ing('Brühe','🍜',1,'l'),_ing('Salz und Pfeffer','🧂',0,''),_ing('Kochwürste','🌭',2,'Stück'),_ing('Würstchen','🌭',2,'Stück'),_ing('süße Sahne','🥛',100,'g'),_ing('Muskat','🌰',0,'')],
       steps:['Kartoffeln schälen und in kleine Stücke schneiden. Suppengemüse putzen und ebenfalls in kleine Stücke schneiden.','Alles mit der Brühe in einen Topf geben und ca. 30 Minuten kochen. 5 Minuten vor Ende der Kochzeit die in kleine Stücke geschnittenen Würste und die Sahne dazugeben. Alles mit Salz, Pfeffer und Muskat abschmecken.']},
      {id:'ck_kaese_lauch_suppe',name:'Käse-Lauch-Suppe mit Hackfleisch',emoji:'🧀',category:'Suppe',servings:4,description:'',
       ingredients:[_ing('Baguette (zum Aufbacken)','🥖',2,'Stück'),_ing('Öl','🫙',3,'EL'),_ing('Hackfleisch, gemischtes','🥩',500,'g'),_ing('Salz und Pfeffer','🧂',0,''),_ing('Lauch','🌱',750,'g'),_ing('Wasser','💧',700,'ml'),_ing('Gemüsebrühwürfel','🫙',3,'Stück'),_ing('Schmelzkäse','🧀',250,'g'),_ing('Crème fraîche (ca. 150 g)','🥛',1,'Becher'),_ing('Muskat','🌰',0,''),_ing('Knoblauchpulver','🧄',0,''),_ing('Zwiebelpulver','🧅',0,'')],
       steps:['Den Ofen auf 175 °C Ober-/Unterhitze vorheizen. Die Baguettes im vorgeheizten Ofen ca. 10 Minuten backen.','In der Zwischenzeit Öl in einem großen Topf erhitzen. Hackfleisch darin von allen Seiten scharf anbraten, bis es krümelig ist und mit Salz und Pfeffer würzen. Lauch putzen, in Ringe schneiden und zum Hackfleisch geben. Ca. 5 Minuten mit anbraten. Wasser zugießen, Brühwürfel hineingeben und alles ca. 10 Minuten auf kleiner Flamme kochen.','Hitze deutlich reduzieren oder den Topf kurz vom Herd ziehen, bevor Schmelzkäse und Crème fraîche eingerührt werden. Auf keinen Fall sprudelnd kochen lassen, damit die Suppe cremig bleibt.','Suppe mit Salz, Pfeffer, Muskat, Knoblauch- und Zwiebelpulver kräftig abschmecken. Baguettes in Scheiben schneiden und zur Suppe reichen.']},
      {id:'ck_linseneintopf',name:'Klassischer Linseneintopf',emoji:'🫘',category:'Suppe',servings:4,description:'',
       ingredients:[_ing('Tellerlinsen, braune','🫘',250,'g'),_ing('Räucherbauch, durchwachsen','🥩',300,'g'),_ing('Zwiebel, klein gewürfelt','🧅',1,'Stück'),_ing('Suppengrün, klein gewürfelt','🥕',1,'Bund'),_ing('Möhre, klein gewürfelt','🥕',1,'Stück'),_ing('Kartoffeln, klein gewürfelt','🥔',400,'g'),_ing('Salz und Pfeffer','🧂',0,''),_ing('Lorbeerblätter','🌿',2,'Stück'),_ing('Thymian','🌿',0,''),_ing('Majoran','🌿',0,''),_ing('Frankfurter Würstchen','🌭',2,'Paar'),_ing('Essig','🫙',0,'')],
       steps:['Tellerlinsen mit 1½ l Wasser über Nacht einweichen.','Mit ¾ l Einweichwasser die Linsen und den Bauchspeck sowie die Gewürze zum Kochen bringen, bei geringerer Hitze ca. 40 Min. köcheln lassen, dann das Gemüse (noch ohne die Kartoffeln) beifügen und weitere 20 Minuten köcheln lassen.','Die gewürfelten Kartoffeln dazugeben und weitere 20 Min. köcheln lassen.','Ca. 10 Minuten vor Ende der Garzeit die Würstchen in Scheiben schneiden und beifügen. Mit Salz, Pfeffer und Essig abschmecken. Den Essig am Tisch dazu reichen, damit jeder nach Belieben nachwürzen kann.']},
      {id:'ck_pizzasuppe_oma',name:'Omas Pizzasuppe',emoji:'🍕',category:'Suppe',servings:6,description:'',
       ingredients:[_ing('Zwiebeln','🧅',2,'Stück'),_ing('Hackfleisch','🥩',500,'g'),_ing('Olivenöl','🫙',1,'EL'),_ing('Paprikaschote, rote','🫑',1,'Stück'),_ing('Paprikaschote, gelbe','🫑',1,'Stück'),_ing('Champignons (Dose)','🍄',1,'Dose'),_ing('Mais (Dose)','🌽',1,'Dose'),_ing('Gemüsebrühe','🍜',750,'ml'),_ing('Sahne','🥛',1,'Becher'),_ing('Tomaten, stückige (2 Pkt.)','🍅',2,'Stück'),_ing('Sahneschmelzkäse','🧀',200,'g'),_ing('Salz und Pfeffer','🧂',0,''),_ing('Oregano','🌿',0,''),_ing('Parmesan, geriebener (optional)','🧀',0,'')],
       steps:['Die Zwiebeln würfeln und mit dem Hackfleisch in Olivenöl anbraten. Die Paprikaschoten ebenfalls würfeln und mit den Champignons sowie dem Mais zum Hackfleisch geben. Alles kurz anbraten.','Mit der Gemüsebrühe ablöschen. Die Sahne, die Tomatensauce und den Sahneschmelzkäse hinzugeben und ca. 10 Minuten köcheln lassen. Zum Schluss mit Salz, Pfeffer und Oregano abschmecken.','Beim Servieren nach Belieben etwas geriebenen Parmesan auf die Suppe streuen. Dazu passt am besten Baguette.']},
      {id:'ck_parmesan_spaghetti',name:'Parmesan und Petersilie Spaghetti',emoji:'🍝',category:'Nudelgericht',servings:4,description:'',
       ingredients:[_ing('Spaghetti','🍝',450,'g'),_ing('Butter','🧈',175,'g'),_ing('Petersilie, glatt gehackt','🌿',4,'EL'),_ing('Parmesan, frisch gerieben','🧀',225,'g'),_ing('Salz','🧂',0,'')],
       steps:['Die Spaghetti in einem Topf mit gesalzenem Wasser 8–10 Minuten, bzw. nach Packungsanleitung, kochen, bis sie al dente sind. Dann abgießen, abtropfen lassen und in eine Schüssel geben.','Butter, Petersilie und die Hälfte des Parmesans über die Spaghetti geben und mit zwei Gabeln vorsichtig unterheben, bis Butter und Käse geschmolzen sind und die Petersilie gut verteilt ist.','Die Spaghetti in vorgewärmten Schalen anrichten und mit dem restlichen Parmesan bestreuen. Sofort mit frischem, knusprigen Brot servieren.']},
      {id:'ck_spaghetti_aglio_olio',name:'Spaghetti aglio, olio e peperoncino',emoji:'🌶️',category:'Nudelgericht',servings:4,description:'',
       ingredients:[_ing('Spaghetti','🍝',500,'g'),_ing('Hartkäse (z. B. Grana Padano)','🧀',40,'g'),_ing('Tomate','🍅',1,'Stück'),_ing('Knoblauchzehen','🧄',5,'Zehe'),_ing('Salz','🧂',0.5,'TL'),_ing('Peperoni','🌶️',2,'Stück'),_ing('Petersilie, gehackte','🌿',5,'EL'),_ing('Basilikum, gerebelt','🌿',1,'TL'),_ing('Oregano, gerebelt','🌿',1,'TL'),_ing('Gemüsebrühepulver','🫙',2,'TL'),_ing('Olivenöl, nativ','🫙',100,'ml')],
       steps:['Die Spaghetti nach Packungsanleitung kochen. Kurz vor Ende der Garzeit 2 Kellen vom Kochwasser auffangen.','Den Hartkäse fein reiben. Die Tomate in kleine Würfel schneiden. Den Knoblauch klein schneiden, leicht salzen und zerdrücken. Peperoni entkernen und in feine Ringe schneiden. Peperoni, Petersilie, Basilikum, Oregano und das Gemüsebrühepulver mit dem Knoblauch und der Tomate vermischen.','Die 2 Kellen Kochwasser hinzugeben, alles gut verrühren und 2 Minuten ziehen lassen.','Die Nudeln gut abtropfen lassen und in einer heißen Pfanne maximal 1 Minute schwenken. Die Würzmischung hinzugeben, gut durchschwenken, dann den geriebenen Hartkäse hinzugeben und vermengen.','Vor dem Servieren das kalte Olivenöl darüber geben und vermischen. Bei Bedarf noch etwas Hartkäse über die Pasta streuen.']},
      {id:'ck_sauce_bolognese',name:'Die echte Sauce Bolognese',emoji:'🍝',category:'Nudelgericht',servings:6,description:'',
       ingredients:[_ing('Butter (Soffritto)','🧈',125,'g'),_ing('Olivenöl','🫙',2,'EL'),_ing('Zwiebeln (ca. 300–350 g)','🧅',2,'Stück'),_ing('Möhren (ca. 250–300 g)','🥕',3,'Stück'),_ing('Staudensellerie (ca. 150–200 g)','🥬',3,'Stück'),_ing('Rinderhackfleisch','🥩',1000,'g'),_ing('Weißwein','🍷',0,''),_ing('Milch','🥛',500,'ml'),_ing('Tomaten, geschälte (Dose)','🍅',600,'ml'),_ing('Knoblauchzehen','🧄',3,'Zehe'),_ing('Peperoncini','🌶️',3,'Stück'),_ing('Meersalz und Pfeffer','🧂',0,''),_ing('Spaghetti','🍝',600,'g')],
       steps:['Das Soffritto vorbereiten: Butter und Olivenöl in eine Pfanne geben. Zwiebeln, Möhren und Staudensellerie ganz fein hacken und auf möglichst niedriger Flamme langsam (mind. 30 Minuten) darin garen, bis das Gemüse glasig und weich ist. Das Gemüse soll nicht braten, sondern nur dünsten.','Derweil das Rinderhackfleisch in einer weiteren Pfanne scharf braten, bis es kräftig Farbe annimmt. Mit einem Schuss Weißwein ablöschen. Dann die Milch hinzugeben.','Sobald das Fleisch mit Weißwein und Milch aufkocht, die Dosentomaten hinzugeben. Wenn alles wieder aufgekocht ist, das Soffritto hinzugeben. Den in Scheiben geschnittenen Knoblauch und die zerstampften Peperoncini hinzufügen. Mit Meersalz und Pfeffer abschmecken.','Die Bolognese mindestens 2 Stunden (ideal 5 Stunden) bei kleiner Hitze köcheln lassen. Bei Bedarf immer etwas Wasser nachgießen. In der Zwischenzeit die Spaghetti nach Packungsanweisung bissfest kochen. Die Spaghetti auf Tellern anrichten und die Bolognese darüber verteilen.']},
      {id:'ck_lasagne',name:'Lasagne',emoji:'🫕',category:'Auflauf',servings:4,description:'',
       ingredients:[_ing('Zwiebel','🧅',1,'Stück'),_ing('Knoblauchzehen','🧄',2,'Zehe'),_ing('Petersilie','🌿',1,'Bund'),_ing('Olivenöl','🫙',2,'EL'),_ing('Hackfleisch, gemischtes','🥩',500,'g'),_ing('Tomatenmark','🫙',1,'EL'),_ing('Tomaten, geschälte (Dose, 800 g)','🍅',1,'Dose'),_ing('Rotwein (ca. 50–100 ml)','🍷',0,''),_ing('Salz und Pfeffer','🧂',0,''),_ing('Butter (Béchamel)','🧈',30,'g'),_ing('Mehl','🌾',40,'g'),_ing('Milch','🥛',500,'ml'),_ing('Zitronensaft','🍋',2,'TL'),_ing('Muskatnuss','🌰',0,''),_ing('Lasagneplatten','🍝',300,'g'),_ing('Käse, geriebener','🧀',200,'g'),_ing('Butterflöckchen','🧈',20,'g')],
       steps:['Für die Bolognesesauce Zwiebel schälen und fein würfeln, Knoblauch fein hacken, Petersilie fein hacken. Olivenöl stark erhitzen, Hackfleisch 5–7 Min. krümelig anbraten. Zwiebelwürfel hinzugeben und 2–3 Min. mitbraten. Knoblauch und Petersilie dazugeben. Tomatenmark einrühren und 1 Min. mitrösten.','Geschälte Tomaten hinzugeben und grob zerdrücken. Optional Rotwein einrühren. Mit Salz und Pfeffer würzen. Sauce ohne Deckel 30–40 Min. leise köcheln lassen.','Für die Béchamelsauce Butter schmelzen, Mehl einrühren und 1–2 Min. hell anschwitzen. Milch in 3–4 Portionen einrühren, bis die Sauce glatt ist. 8–12 Min. sanft köcheln. Mit Salz, Pfeffer, Zitronensaft und Muskat abschmecken.','Backofen auf 180 °C vorheizen. Auflaufform einfetten. Bolognese, Lasagneplatten und Béchamel abwechselnd einschichten – letzte Schicht ist Béchamel. Geriebenen Käse und Butterflöckchen auf der Oberfläche verteilen.','Im heißen Backofen 35–45 Min. bei 180 °C backen, bis die Oberfläche goldbraun ist. Vor dem Anschneiden 10–15 Minuten ruhen lassen.']},
      {id:'ck_thunfisch_tomaten_nudeln',name:'Nudeln in Thunfisch-Tomaten-Käse Sauce',emoji:'🐟',category:'Nudelgericht',servings:2,description:'',
       ingredients:[_ing('Nudeln','🍝',200,'g'),_ing('Zwiebel','🧅',1,'Stück'),_ing('Öl','🫙',1,'TL'),_ing('Tomatenmark','🫙',1,'EL'),_ing('Zucker','🍬',0,''),_ing('Knoblauchzehe','🧄',1,'Zehe'),_ing('Tomaten, stückige (ca. 4 EL bis 1 Dose)','🍅',0,''),_ing('Gemüsebrühe','🍜',0,''),_ing('Thunfisch im eigenen Saft (Dose)','🐟',1,'Dose'),_ing('Schmelzkäse light','🧀',4,'EL'),_ing('saure Sahne','🥛',2,'EL'),_ing('Basilikum','🌿',0,''),_ing('Salz und Pfeffer','🧂',0,'')],
       steps:['Die Nudeln nach Packungsanweisung bissfest kochen.','Die gewürfelten Zwiebeln in Öl glasig anbraten, Tomatenmark dazugeben und kurz mitrösten, etwas Zucker dazugeben, dann Knoblauch pressen und die stückigen Tomaten dazugeben. Etwas Gemüsebrühe angießen, einen Deckel auflegen und die Sauce kurz köcheln lassen. Den Thunfisch (gerne mit Saft) in der Sauce erhitzen. Schmelzkäse, saure Sahne und Basilikum in die Sauce rühren, mit schwarzem Pfeffer abschmecken. Die Nudeln mit der Sauce vermengen.']},
      {id:'ck_gnocchi_kaese_schinken',name:'Gnocchi mit Käse-Knoblauch-Schinkensauce',emoji:'🥟',category:'Nudelgericht',servings:2,description:'',
       ingredients:[_ing('Gnocchi','🥟',500,'g'),_ing('Knoblauchzehe','🧄',1,'Zehe'),_ing('Kochschinken','🥓',4,'Scheibe'),_ing('Sahne','🥛',150,'ml'),_ing('Schmelzkäse','🧀',50,'g'),_ing('Parmesan','🧀',2,'EL'),_ing('Olivenöl','🫙',1,'EL'),_ing('Salz und Pfeffer','🧂',0,'')],

function loadBookmarks() {

  try { localStorage.setItem(BOOKMARK_STORE, JSON.stringify([...bookmarks])); } catch {}
}
function toggleBookmark(id) {
  const pg = bookPages[bookCurrentPage];
  const rid = id || pg?.r?.id;
  if (!rid) return;
  if (bookmarks.has(rid)) bookmarks.delete(rid); else bookmarks.add(rid);
  saveBookmarks();
  updateBookmarkBtn();
  // Update list row if visible without full re-render
  const listBm = document.querySelector(`.blv-bookmark[data-rid="${CSS.escape(rid)}"]`);
  if (listBm) {
    const active = bookmarks.has(rid);
    listBm.innerHTML = active ? BM_SVG_FILL : BM_SVG_OUT;
    listBm.classList.toggle('bm-active', active);
  }
}
function updateBookmarkBtn() {
  const btn = document.getElementById('bookBookmarkBtn');
  if (!btn) return;
  const pg = bookPages[bookCurrentPage];
  const isRecipePage = bookViewMode === 'book' && pg?.type === 'recipe';
  btn.classList.toggle('visible', isRecipePage);
  if (isRecipePage) {
    const active = bookmarks.has(pg.r.id);
    btn.innerHTML = active ? BM_SVG_FILL : BM_SVG_OUT;
    btn.classList.toggle('bm-active', active);
    btn.title = active ? 'Lesezeichen entfernen' : 'Lesezeichen setzen';
  }
}

const UNIT_G = {
  'el':15,'essl':15,'esslöffel':15,'esslöffel':15,

  'zehe':5,'zehen':5,

function _unitToG(unitStr, qty) {
  const suffix = (unitStr||'').replace(/^[\d.,\s]+/,'').trim().toLowerCase();
  const g = UNIT_G[suffix];
  return g ? qty * g : 0;
}
// Convert catalog unit string to grams (e.g. '1kg'→1000, '500g'→500, 'Stück'→80)
function _parseUnitG(unitStr) {
  if (!unitStr) return 100;
  const s = unitStr.trim();
  const sl = s.toLowerCase().replace(/,/g, '.');
  // NxY.Yunit — multi-pack (e.g. '6x1.5L', '3×15g', '12x0.7L')
  const mMulti = sl.match(/^(\d+)[x×](\d+\.?\d*)\s*(g|kg|ml|cl|dl|l)$/);
  if (mMulti) {
    const base = _scaleUnit(parseFloat(mMulti[2]), mMulti[3]);
    return parseInt(mMulti[1]) * base;
  }
  // N unit — multiple pieces (e.g. '4 Stück', '10 St.', '3er Pack', '6er Pack', '12 Bl.')
  const mNPiece = sl.match(/^(\d+)\s*(stück|st\.?|er\s*pack\.?|bl\.?|btl\.?|rollen?)$/);
  if (mNPiece) {
    const count = parseInt(mNPiece[1]);
    const u = mNPiece[2].replace(/\.$/, '');
    if (u === 'bl') return count * 2;
    if (u === 'btl') return count * 2;
    const ug = UNIT_G[u] || UNIT_G['stück'] || 80;
    return count * ug;
  }
  // Standard weight/volume: '500g', '1kg', '1.5L', '250ml'
  const mWeight = sl.match(/^(\d+\.?\d*)\s*(g|kg|ml|cl|dl|l)$/);
  if (mWeight) return _scaleUnit(parseFloat(mWeight[1]), mWeight[2]);
  // 'kg' alone
  if (sl === 'kg') return 1000;
  // Non-weight piece units via UNIT_G
  const clean = sl.replace(/\.$/, ''); // strip trailing dot (Pack. → pack)
  return UNIT_G[clean] || 100;
}
function _scaleUnit(val, u) {
  const ul = u.toLowerCase();
  if (ul === 'kg') return val * 1000;
  if (ul === 'l') return val * 1000;
  if (ul === 'dl') return val * 100;
  if (ul === 'cl') return val * 10;
  return val; // g or ml
}

let _catalogMap = null, _catalogFWMap = null;
function getCatalogMap() {
  if (!_catalogMap) {
    _catalogMap = new Map();
    _catalogFWMap = new Map();
    (typeof SUGGESTIONS !== 'undefined' ? SUGGESTIONS : []).forEach(s => {
      const key = s.name.toLowerCase().trim();
      _catalogMap.set(key, s);
      const fw = key.split(/[\s,()\/\-]+/)[0];
      if (!_catalogFWMap.has(fw)) _catalogFWMap.set(fw, []);
      _catalogFWMap.get(fw).push({key, s});

  }

}
function _tryMatch(n) {
  if (!n) return null;
  getCatalogMap();
  if (_catalogMap.has(n)) return _catalogMap.get(n);
  const fw = n.split(/[\s,()\/\-]+/)[0];
  const candidates = _catalogFWMap.get(fw) || [];
  let best = null, bestScore = 0;
  for (const {key, s} of candidates) {
    let score = 0;
    if (n.startsWith(key)) score = key.length + 100;
    else if (key.startsWith(n)) score = n.length + 50;
    else score = fw.length;

function _normalizeName(n) {
  if (FOOD_ALIASES[n]) return FOOD_ALIASES[n];
  // Extract color words from the ENTIRE name (including after comma)
  const allWords = n.replace(/[(),]/g,' ').split(/\s+/);
  const colorHints = allWords.map(w => COLOR_NORM[w]).filter(Boolean);
  // Strip after comma, remove parens
  let s = n.split(',')[0].trim().replace(/\s*\([^)]*\)/g,'').trim();

  let words = s.split(/\s+/).map(w => COLOR_NORM[w]||w).filter(w => !SKIP_WORDS.has(w));

  const existingColors = new Set(words.filter(w => Object.values(COLOR_NORM).includes(w)));
  colorHints.forEach(c => { if (!existingColors.has(c)) words.push(c); });

  const normParts = norm.split(/\s+/);

    const rest = normParts.slice(1).join(' ');
    if (rest) { r = _tryMatch(aliasBase + ' ' + rest); if (r) return r; }

  for (const [key, entry] of _catalogMap) {

  }
  if (!hasData) return null;
  return {kcal:Math.round(kcal), protein:Math.round(protein), carbs:Math.round(carbs), fat:Math.round(fat),
    price: hasPrice ? price : null};
}

// ── Book state ──
let bookCurrentPage=0, bookPages=[], bookPortions={}, bookSearch='', bookTX=0, bookTY=0;
let bookViewMode = (()=>{ try { return localStorage.getItem('rezeptbuch_view')||'list'; } catch { return 'list'; } })();

function buildBookPages() {
  const now=Date.now(), thr=7*24*60*60*1000;
  const allRecs=Object.values(recipes);
  const catOrder=[...RECIPE_CATEGORIES];
  allRecs.forEach(r => { const c=r.category||'Sonstiges'; if(!catOrder.includes(c)) catOrder.push(c); });
  const grouped={};
  allRecs.forEach(r => { const c=r.category||'Sonstiges'; if(!grouped[c]) grouped[c]=[]; grouped[c].push(r); });
  const usedCats=catOrder.filter(c=>grouped[c]);
  usedCats.forEach(cat=>grouped[cat].sort((a,b)=>{
    const na=a.createdAt&&(now-a.createdAt)<thr?1:0, nb=b.createdAt&&(now-b.createdAt)<thr?1:0;
    return nb!==na?nb-na:a.name.localeCompare(b.name);
  }));
  bookPages=[{type:'cover',grouped,usedCats}];
  usedCats.forEach(cat=>grouped[cat].forEach(r=>{
    bookPages.push({type:'recipe',id:r.id,r,cat});
    if(!bookPortions[r.id]) bookPortions[r.id]=r.servings||4;
  }));
}

function renderBookAllPages() {
  const container=document.getElementById('bookPages');
  const listEl=document.getElementById('bookListView'); // save before clearing
  container.innerHTML='';
  if(listEl) container.appendChild(listEl); // restore list view element
  if (bookPages.length===1&&Object.keys(recipes).length===0) {
    const el=document.createElement('div');
    el.className='book-page bp-no-t bp-on'; el.id='bp-0';
    el.innerHTML=`<div class="empty-state"><div class="empty-ornament">📚</div><div class="empty-title">Noch keine Rezepte</div><div class="empty-text">Tippe auf + oben rechts, um dein erstes Rezept hinzuzufügen.</div></div>`;
    container.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('bp-no-t')));
    return;
  }
  bookPages.forEach((pg,i)=>{
    const el=document.createElement('div');
    el.className='book-page bp-no-t'+(i===0?' bp-on':''); el.id='bp-'+i;
    el.innerHTML=i===0?buildCoverHTML(pg):buildRecipePageHTML(pg,i);
    container.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('bp-no-t')));
    el.addEventListener('touchstart',e=>{bookTX=e.touches[0].clientX;bookTY=e.touches[0].clientY;},{passive:true});
    el.addEventListener('touchend',e=>{
      const dx=e.changedTouches[0].clientX-bookTX, dy=e.changedTouches[0].clientY-bookTY;
      if(Math.abs(dx)>Math.abs(dy)*1.2&&Math.abs(dx)>50) bookFlip(dx<0?1:-1);
    },{passive:true});
    if(i===0){
      let ptrActive=false;
      const ptrEl=document.getElementById('ptrHint');
      el.addEventListener('touchmove',e=>{
        if(el.scrollTop>0){ptrActive=false;if(ptrEl)ptrEl.classList.remove('visible');return;}
        const dy=e.touches[0].clientY-bookTY, dx=e.touches[0].clientX-bookTX;
        if(dy>0&&dy>Math.abs(dx)*1.2&&dy>20){ptrActive=true;if(ptrEl)ptrEl.classList.add('visible');}
        else{ptrActive=false;if(ptrEl)ptrEl.classList.remove('visible');}
      },{passive:true});
      el.addEventListener('touchend',()=>{
        if(ptrEl)ptrEl.classList.remove('visible');
        if(ptrActive){ptrActive=false;refreshBook();}
      },{passive:true});
    }
  });
}

function bookAdjPortions(id, pageIdx, delta) {
  bookPortions[id]=Math.max(0.5,(bookPortions[id]||4)+delta);
  const val=bookPortions[id], el=document.getElementById('bp-'+pageIdx);
  if(!el) return;
  const pvalEl=el.querySelector('#brp-pval-'+pageIdx);
  if(pvalEl) pvalEl.textContent=val===Math.floor(val)?val:val.toFixed(1);
  const pg=bookPages[pageIdx]; if(!pg?.r) return;
  const scale=val/(pg.r.servings||4), ings=(pg.r.ingredients||[]).filter(i=>!i.custom);
  el.querySelectorAll('.brp-ingr-amt').forEach((amtEl,i)=>{ if(ings[i]) amtEl.textContent=cookFmtAmt(ings[i],scale); });
  const nutrEl=el.querySelector('#brp-nutr-'+pageIdx);
  if(nutrEl) {
    const nutr=calcNutrition(ings,scale);
    if(nutr) {
      const vals=nutrEl.querySelectorAll('.brp-nutr-val');
      if(vals[0]) vals[0].textContent=nutr.kcal;
      if(vals[1]) vals[1].textContent=nutr.protein+' g';
      if(vals[2]) vals[2].textContent=nutr.carbs+' g';
      if(vals[3]) vals[3].textContent=nutr.fat+' g';
      if(vals[4]&&nutr.price!=null) vals[4].textContent='~'+nutr.price.toFixed(2).replace('.',',')+' €';
    }
  }
}

function bookFlip(dir) {
  const nextIdx=bookCurrentPage+dir;
  if(nextIdx<0||nextIdx>=bookPages.length) return;
  const curEl=document.getElementById('bp-'+bookCurrentPage), nextEl=document.getElementById('bp-'+nextIdx);
  if(!curEl||!nextEl) return;
  nextEl.classList.add('bp-no-t'); nextEl.classList.remove('bp-on','bp-left');
  if(dir<0) nextEl.classList.add('bp-left');
  void nextEl.offsetWidth; nextEl.classList.remove('bp-no-t');
  requestAnimationFrame(()=>{
    if(dir>0){curEl.classList.remove('bp-on');curEl.classList.add('bp-left');nextEl.classList.add('bp-on');}
    else{curEl.classList.remove('bp-on','bp-left');nextEl.classList.remove('bp-left');nextEl.classList.add('bp-on');}
    nextEl.scrollTop=0;
    bookCurrentPage=nextIdx; updateBookNav();
    try { localStorage.setItem('rezeptbuch_page', String(bookPages[nextIdx]?.id || nextIdx)); } catch {}
  });
}

function bookBackAction() {
  if(shareMode){toggleShareMode();return;}
  if(bookViewMode==='list') { history.go(-2); return; } // skip guard + leave app
  if(bookCurrentPage===0){ history.go(-2); return; }    // cover → leave app
  if(openedFromList){ _backToList(); return; }
  bookGoToIndex();
}

function updateBookNav() {
  const prevBtn=document.getElementById('bookPrevBtn'), nextBtn=document.getElementById('bookNextBtn');
  const navPg=document.getElementById('bookNavPg'), navName=document.getElementById('bookNavName');
  const backBtn=document.getElementById('bookBackBtn'), addBtn=document.getElementById('bookAddBtn');
  const toggle=document.getElementById('bookViewToggle');
  const shareBtn=document.getElementById('bookShareBtn');
  if(!prevBtn) return;
  if(toggle) toggle.textContent = bookViewMode==='list' ? '📖' : '☰';
  if(shareBtn) shareBtn.style.display = bookViewMode==='list' ? '' : 'none';
  if(bookViewMode==='list'){
    prevBtn.disabled=true; nextBtn.disabled=true;
    navPg.textContent='Liste'; navName.textContent='';
    if(backBtn) backBtn.textContent='← Zurück';
    if(addBtn) addBtn.classList.remove('hidden');
    return;
  }
  prevBtn.disabled=bookCurrentPage===0; nextBtn.disabled=bookCurrentPage===bookPages.length-1;
  if(bookCurrentPage===0){
    navPg.textContent='Inhalt'; navName.textContent='';
    if(backBtn) backBtn.textContent='← Zurück';
    if(addBtn) addBtn.classList.remove('hidden');
  } else {
    const pg=bookPages[bookCurrentPage];
    navPg.textContent=`${bookCurrentPage} / ${bookPages.length-1}`;
    navName.textContent=pg.r?.name||'';
    if(backBtn) backBtn.textContent=openedFromList?'← Liste':'≡ Inhalt';
    if(addBtn) addBtn.classList.add('hidden');
  }
  updateBookmarkBtn();
}

function toggleBookView() {
  if(shareMode) toggleShareMode();
  bookViewMode = bookViewMode==='list' ? 'book' : 'list';
  try { localStorage.setItem('rezeptbuch_view', bookViewMode); } catch {}
  const listEl=document.getElementById('bookListView');
  if(bookViewMode==='list'){
    renderListView();
    listEl.classList.add('visible');
  } else {
    listEl.classList.remove('visible');
  }
  updateBookNav();
}
